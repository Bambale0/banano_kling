# Include inside the Tanya TLS virtual hosts. The app records path-only
# access events; proxy request/error lines must not expose callback nonces.
location = /mini-app/api/wan3/callback {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:1888;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
}
