# Dedicated VK origin. Maintenance only until shared product release.
server {
    listen 80;
    listen [::]:80;
    server_name vk.neuromixbot.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://vk.neuromixbot.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vk.neuromixbot.com;
    ssl_certificate /etc/letsencrypt/live/vk.neuromixbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vk.neuromixbot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru" always;
    location / {
        default_type text/plain;
        charset utf-8;
        return 503 'Приложение готовится к запуску.';
    }
}
