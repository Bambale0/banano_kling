# Retired NEUROMIX origin: never serve a second frontend or uploads tree.
# Keep TLS/ACME for historical links; redirect without dropping the path/query.
server {
    listen 80;
    listen [::]:80;
    server_name tanyapp.chillcreative.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = / {
        return 307 https://neuromixbot.com/mini-app/$is_args$args;
    }

    location / {
        return 307 https://neuromixbot.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tanyapp.chillcreative.ru;

    client_max_body_size 220m;
    ssl_certificate /etc/letsencrypt/live/tanyapp.chillcreative.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanyapp.chillcreative.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~* ^/(?:\.env(?:\..*)?|\.git|\.svn|\.hg|\.DS_Store|package(?:-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|Dockerfile|docker-compose\.ya?ml|server-status|metrics|openapi\.json|docs|swagger)(?:/|$) {
        access_log off;
        return 404;
    }

    location = / {
        return 307 https://neuromixbot.com/mini-app/$is_args$args;
    }

    location / {
        return 307 https://neuromixbot.com$request_uri;
    }
}
