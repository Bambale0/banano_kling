# media.chillcreative.ru
# Existing backend uploads served directly by Nginx behind Cloudflare Free.
# Files stay in the application's current static/uploads directory.

server {
    listen 80;
    listen [::]:80;
    server_name media.chillcreative.ru;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.chillcreative.ru;

    ssl_certificate /etc/letsencrypt/live/media.chillcreative.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.chillcreative.ru/privkey.pem;

    client_max_body_size 1m;
    autoindex off;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio threads;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    etag on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Do not expose hidden files even if they exist under uploads.
    location ~ /\. {
        deny all;
    }

    # Existing backend media directory. No file migration is required.
    # Keep the trailing slash on both location and alias.
    location ^~ /uploads/ {
        alias /root/tanya/banano_kling/static/uploads/;
        try_files $uri =404;

        types {
            image/webp webp;
            image/avif avif;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
        }
        default_type application/octet-stream;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Nginx handles byte ranges for static video/audio automatically.
        access_log off;
        log_not_found off;
    }

    location / {
        return 404;
    }
}
