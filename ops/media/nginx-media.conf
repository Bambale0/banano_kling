# media.chillcreative.ru
# Public immutable media served directly by Nginx behind Cloudflare Free.

server {
    listen 80;
    listen [::]:80;
    server_name media.chillcreative.ru;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.chillcreative.ru;

    ssl_certificate /etc/letsencrypt/live/media.chillcreative.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.chillcreative.ru/privkey.pem;

    root /srv/banano-media/public;

    client_max_body_size 1m;
    autoindex off;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio threads;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    etag on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    location ^~ /previews/ {
        try_files $uri =404;

        types {
            image/webp webp;
            image/avif avif;
            image/jpeg jpg jpeg;
            image/png png;
        }
        default_type application/octet-stream;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;

        access_log off;
        log_not_found off;
    }

    location ^~ /originals/ {
        try_files $uri =404;

        types {
            image/webp webp;
            image/avif avif;
            image/jpeg jpg jpeg;
            image/png png;
            video/mp4 mp4;
            video/webm webm;
        }
        default_type application/octet-stream;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;

        # Range requests are handled by Nginx automatically for static files.
        access_log off;
        log_not_found off;
    }

    location / {
        return 404;
    }
}
