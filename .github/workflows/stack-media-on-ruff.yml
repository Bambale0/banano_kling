name: Stack media fix on Ruff gate

on:
  pull_request:
    branches: [ci/stack-media-on-ruff-base]

permissions:
  contents: write

jobs:
  stack:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout media branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge current Ruff gate branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci/tanyapi-ruff-changed-lines-v2
          if git merge-base --is-ancestor origin/ci/tanyapi-ruff-changed-lines-v2 HEAD; then
            echo "Media branch already contains Ruff gate"
            exit 0
          fi
          git merge --no-ff --no-edit origin/ci/tanyapi-ruff-changed-lines-v2
          git push origin "HEAD:${HEAD_BRANCH}"
