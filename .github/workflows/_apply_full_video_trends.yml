name: Apply full video trend playback

on:
  push:
    branches: [tanyapi]
    paths:
      - '.github/workflows/_apply_full_video_trends.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tanyapi
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Apply full video trend playback
        run: python .github/scripts/apply_full_video_trends.py

      - name: Verify trend video regression contracts
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio
          pip install --quiet -r requirements.txt
          python -m pytest \
            tests/test_trend_full_video_contract.py \
            tests/test_miniapp_four_fixes_contract.py \
            tests/test_trend_video_preview_delivery.py \
            -q

      - name: Verify Mini App production build
        working-directory: frontend/miniapp-v0
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          rm .github/scripts/apply_full_video_trends.py
          rm .github/workflows/_apply_full_video_trends.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/miniapp-v0/components/tabs/trends-tab.tsx \
            frontend/miniapp-v0/components/trend-runner-dialog.tsx \
            tests/test_trend_full_video_contract.py \
            .github/scripts/apply_full_video_trends.py \
            .github/workflows/_apply_full_video_trends.yml
          git commit -m 'fix(miniapp): play complete video trends'
          git push origin HEAD:tanyapi
