name: Shared accounts preview

on:
  pull_request:
    branches: [tanyapi]
    paths:
      - 'bot/shared_accounts/**'
      - 'bot/browser_auth.py'
      - 'bot/db.py'
      - 'bot/postgres*.py'
      - 'tests/test_shared_*.py'
      - 'scripts/audit_shared_account_migration.py'
      - '.github/workflows/shared-accounts-preview.yml'

permissions:
  contents: read

jobs:
  identity-and-admin-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: banano_shared_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: shared-preview-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d banano_shared_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHARED_ACCOUNTS_TEST_DSN: postgresql://postgres:shared-preview-test-only@127.0.0.1:5432/banano_shared_test
      BANANO_SKIP_PROJECT_ENV: '1'
      BANANO_DISABLE_FILE_LOGGING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio pytest-subtests ruff
      - name: Check preview sources
        run: >-
          ruff check bot/shared_accounts tests/test_shared_accounts.py
          tests/test_shared_account_audit.py tests/test_shared_wallet.py tests/test_shared_wallet_openings.py tests/test_shared_wallet_fences.py tests/test_shared_account_links.py tests/test_shared_commerce.py scripts/audit_shared_account_migration.py
      - name: SQLite and PostgreSQL HTTP, security and concurrency contracts
        run: >-
          python -m pytest tests/test_shared_accounts.py
          tests/test_shared_account_audit.py tests/test_shared_wallet.py tests/test_shared_wallet_openings.py tests/test_shared_wallet_fences.py tests/test_shared_account_links.py tests/test_shared_commerce.py tests/test_browser_auth.py -q
