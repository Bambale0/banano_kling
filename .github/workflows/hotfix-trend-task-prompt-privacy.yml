name: Hotfix trend task prompt privacy

on:
  push:
    branches: [tanyapi]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tanyapi
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch shared trend routing and generated task privacy
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('bot/miniapp.py')
          source = path.read_text(encoding='utf-8')

          old_import = 'from bot.config import config\n'
          new_import = 'from bot.config import config\nfrom bot.task_prompt_visibility import is_protected_task_prompt\n'
          if source.count(old_import) != 1:
              raise SystemExit(f'config import count={source.count(old_import)}')
          source = source.replace(old_import, new_import, 1)

          old_helpers = '''def _task_prompt_hidden(row_or_payload: Any) -> bool:\n    return _task_has_source_feed(row_or_payload)\n\n\ndef _task_prompt_actions_allowed(row_or_payload: Any) -> bool:\n    return not _task_has_source_feed(row_or_payload)\n'''
          new_helpers = '''def _task_prompt_hidden(row_or_payload: Any) -> bool:\n    return is_protected_task_prompt(row_or_payload)\n\n\ndef _task_prompt_actions_allowed(row_or_payload: Any) -> bool:\n    return not is_protected_task_prompt(row_or_payload)\n'''
          if source.count(old_helpers) != 1:
              raise SystemExit(f'prompt helper block count={source.count(old_helpers)}')
          source = source.replace(old_helpers, new_helpers, 1)

          old_select = 'source_feed_gen_id, feed_prompt_visible, feed_references_visible,'
          new_select = 'source_feed_gen_id, action_type, feed_prompt_visible, feed_references_visible,'
          if source.count(old_select) != 4:
              raise SystemExit(f'task select count={source.count(old_select)}')
          source = source.replace(old_select, new_select)
          path.write_text(source, encoding='utf-8')

          Path('bot/task_prompt_visibility.py').write_text('''from __future__ import annotations\n\nfrom typing import Any\n\n\ndef _task_value(row_or_payload: Any, key: str) -> Any:\n    if row_or_payload is None:\n        return None\n    try:\n        return row_or_payload[key]\n    except (KeyError, IndexError, TypeError):\n        return getattr(row_or_payload, key, None)\n\n\ndef is_protected_task_prompt(row_or_payload: Any) -> bool:\n    """Hide prompts inherited from another work or from a curated trend."""\n\n    if bool(_task_value(row_or_payload, "source_feed_gen_id")):\n        return True\n    action_type = str(_task_value(row_or_payload, "action_type") or "").strip().lower()\n    return action_type == "trend"\n''', encoding='utf-8')

          app_context_path = Path('frontend/miniapp-v0/lib/app-context.tsx')
          app_context = app_context_path.read_text(encoding='utf-8')
          old_video_guard = '''          const isVideoTrend = isVideoTrendItem(prompt, state.videoModels)\n\n          if (isVideoTrend) {\n'''
          new_video_guard = '''          if (isTrend) {\n            setTrendToRun(prompt)\n            setActiveTabState(5)\n            return\n          }\n\n          const isVideoTrend = isVideoTrendItem(prompt, state.videoModels)\n\n          if (isVideoTrend) {\n'''
          if app_context.count(old_video_guard) != 1:
              raise SystemExit(f'video trend guard count={app_context.count(old_video_guard)}')
          app_context = app_context.replace(old_video_guard, new_video_guard, 1)

          old_late_trend_guard = '''\n          if (isTrend) {\n            setTrendToRun(prompt)\n            setActiveTabState(5)\n            return\n          }\n\n          setPromptPreset({\n'''
          new_late_trend_guard = '''\n          setPromptPreset({\n'''
          if app_context.count(old_late_trend_guard) != 1:
              raise SystemExit(f'late trend guard count={app_context.count(old_late_trend_guard)}')
          app_context = app_context.replace(old_late_trend_guard, new_late_trend_guard, 1)
          app_context_path.write_text(app_context, encoding='utf-8')

          Path('tests/test_task_prompt_visibility.py').write_text('''from pathlib import Path\n\nfrom bot.task_prompt_visibility import is_protected_task_prompt\n\n\nclass AttrTask:\n    source_feed_gen_id = None\n    action_type = "trend"\n\n\ndef test_trend_task_prompt_is_protected() -> None:\n    assert is_protected_task_prompt({"source_feed_gen_id": None, "action_type": "trend"})\n    assert is_protected_task_prompt({"source_feed_gen_id": None, "action_type": "TREND"})\n    assert is_protected_task_prompt(AttrTask())\n\n\ndef test_feed_remix_task_prompt_stays_protected() -> None:\n    assert is_protected_task_prompt({"source_feed_gen_id": 1126, "action_type": "remix"})\n\n\ndef test_ordinary_task_prompt_remains_visible() -> None:\n    assert not is_protected_task_prompt({"source_feed_gen_id": None, "action_type": None})\n    assert not is_protected_task_prompt({"source_feed_gen_id": 0, "action_type": "generate"})\n\n\ndef test_miniapp_task_queries_load_action_type_for_privacy() -> None:\n    source = Path("bot/miniapp.py").read_text(encoding="utf-8")\n    assert "from bot.task_prompt_visibility import is_protected_task_prompt" in source\n    assert source.count("source_feed_gen_id, action_type, feed_prompt_visible") == 4\n    assert "return is_protected_task_prompt(row_or_payload)" in source\n    assert "return not is_protected_task_prompt(row_or_payload)" in source\n\n\ndef test_prompt_deeplink_routes_trend_before_generic_video_repeat() -> None:\n    source = Path("frontend/miniapp-v0/lib/app-context.tsx").read_text(encoding="utf-8")\n    start = source.index("if (startTarget.kind === 'prompt')")\n    end = source.index("if (startTarget.kind === 'task')", start)\n    segment = source[start:end]\n    trend_guard = segment.index("if (isTrend)")\n    video_guard = segment.index("const isVideoTrend")\n    assert trend_guard < video_guard\n''', encoding='utf-8')
          PY

      - name: Verify hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile bot/miniapp.py bot/task_prompt_visibility.py
          python -m pytest -q tests/test_task_prompt_visibility.py

      - name: Commit verified hotfix and remove staging workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot/miniapp.py bot/task_prompt_visibility.py frontend/miniapp-v0/lib/app-context.tsx tests/test_task_prompt_visibility.py
          git commit -m 'fix(trends): route shared templates privately'
          git rm .github/workflows/hotfix-trend-task-prompt-privacy.yml
          git commit -m 'chore: remove trend task privacy hotfix workflow'
          git push origin HEAD:tanyapi
