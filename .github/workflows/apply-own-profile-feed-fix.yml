name: Apply own profile feed fix

on:
  push:
    branches:
      - fix/own-profile-auth-feed
    paths:
      - .github/workflows/apply-own-profile-feed-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/own-profile-auth-feed
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Patch own profile loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/miniapp-v0/components/tabs/profile-tab.tsx')
          text = path.read_text(encoding='utf-8')
          old = """        if (isOwnProfile) {
          if (ownReferralCode) {
            const result = await fetchProfileFeed(ownReferralCode, 120)
            if (!ignore) {
              setItems(mergePendingPublication(result.feed, 'profile'))
              setBrokenMediaIds(new Set())
              setProfile(result.profile)
            }
            return
          }
          const feed = await fetchMyFeed(120)
          if (!ignore) {
            setItems(mergePendingPublication(feed, 'profile'))
            setBrokenMediaIds(new Set())
            setProfile(null)
          }
          return
        }
"""
          new = """        if (isOwnProfile) {
          // The authenticated endpoint is authoritative for the current user.
          // Do not resolve the owner's publications through a referral code:
          // a stale/duplicated code can point the grid at another user record
          // even while a direct generation link opens correctly by gen_id.
          const feed = await fetchMyFeed(120)
          if (!ignore) {
            setItems(mergePendingPublication(feed, 'profile'))
            setBrokenMediaIds(new Set())
            setProfile(null)
          }
          return
        }
"""
          if old not in text:
              raise SystemExit('Expected own-profile loading block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_own_profile_feed_contract.py')
          test.write_text(
              """from pathlib import Path

PROFILE_SOURCE = Path(
    'frontend/miniapp-v0/components/tabs/profile-tab.tsx'
).read_text(encoding='utf-8')


def test_own_profile_uses_authenticated_feed_endpoint():
    own_branch_start = PROFILE_SOURCE.index('if (isOwnProfile) {', PROFILE_SOURCE.index('async function loadProfileFeed'))
    foreign_branch_start = PROFILE_SOURCE.index('const result = await fetchProfileFeed(targetReferralCode', own_branch_start)
    own_branch = PROFILE_SOURCE[own_branch_start:foreign_branch_start]

    assert 'const feed = await fetchMyFeed(120)' in own_branch
    assert 'fetchProfileFeed(ownReferralCode' not in own_branch
    assert "setItems(mergePendingPublication(feed, 'profile'))" in own_branch


def test_foreign_profile_still_uses_referral_code_lookup():
    assert 'const result = await fetchProfileFeed(targetReferralCode, 120)' in PROFILE_SOURCE
""",
              encoding='utf-8',
          )
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-own-profile-feed-fix.yml

      - name: Build Mini App
        working-directory: frontend/miniapp-v0
        run: |
          npm ci
          npm run build

      - name: Run focused contract check
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('frontend/miniapp-v0/components/tabs/profile-tab.tsx').read_text(encoding='utf-8')
          start = source.index('if (isOwnProfile) {', source.index('async function loadProfileFeed'))
          end = source.index('const result = await fetchProfileFeed(targetReferralCode', start)
          branch = source[start:end]
          assert 'const feed = await fetchMyFeed(120)' in branch
          assert 'fetchProfileFeed(ownReferralCode' not in branch
          assert "setItems(mergePendingPublication(feed, 'profile'))" in branch
          print('Own profile authenticated-feed contract OK')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/miniapp-v0/components/tabs/profile-tab.tsx .github/workflows/apply-own-profile-feed-fix.yml
          git add -f tests/test_own_profile_feed_contract.py
          git commit -m "Fix own profile publication loading"
          git push origin HEAD:fix/own-profile-auth-feed
