name: Temporary Ruff Autofix

on:
  push:
    branches:
      - fix/seedance-multimodal-refs

permissions:
  contents: read

jobs:
  autofix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Apply import fix
        run: ruff check --select I --fix bot/handlers/__init__.py
      - name: Upload corrected file
        uses: actions/upload-artifact@v4
        with:
          name: corrected-handler-init
          path: bot/handlers/__init__.py
