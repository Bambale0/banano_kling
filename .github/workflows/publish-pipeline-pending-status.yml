name: Observability — Tanya pipeline pending statuses

on:
  push:
    branches: [tanyapi]

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  publish:
    name: Publish active CI and deploy run links
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Discover exact-SHA runs and publish pending statuses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          publish_pending() {
            local workflow="$1"
            local context="$2"
            local description="$3"
            local run_id=""

            for _ in $(seq 1 30); do
              run_id="$(
                gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                  -f head_sha="$GITHUB_SHA" \
                  -f event=push \
                  -f branch=tanyapi \
                  -F per_page=10 \
                  --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty'
              )"
              [ -n "$run_id" ] && break
              sleep 2
            done

            [ -n "$run_id" ] || {
              echo "::error::Could not discover ${workflow} run for ${GITHUB_SHA}"
              return 1
            }

            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=pending \
              -f context="$context" \
              -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

            echo "$context run_id=$run_id"
          }

          publish_pending ci.yml tanya/ci 'Tanya CI is running'
          publish_pending deploy-production.yml tanya/deploy 'Tanya production deployment is waiting for CI'
