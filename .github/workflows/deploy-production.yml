name: Deploy — Tanya production

on:
  push:
    branches: [tanyapi]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: tanya-production-v5
  cancel-in-progress: true

jobs:
  ci_gate:
    name: Wait for verified CI
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Require the production branch
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REF" = "refs/heads/tanyapi" ] || {
            echo "::error::Production deploy is allowed only from refs/heads/tanyapi, got $GITHUB_REF"
            exit 1
          }

      - name: Wait for the matching CI run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 2700))

          while [ "$SECONDS" -lt "$deadline" ]; do
            payload="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f head_sha="$GITHUB_SHA" \
                -f event=push \
                -f branch=tanyapi \
                -F per_page=10
            )"

            run_id="$(jq -r '.workflow_runs | sort_by(.created_at) | last | .id // empty' <<< "$payload")"
            if [ -z "$run_id" ]; then
              echo "CI run for $GITHUB_SHA has not appeared yet"
              sleep 10
              continue
            fi

            status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<< "$payload")"
            conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // empty' <<< "$payload")"
            echo "CI run $run_id: status=$status conclusion=${conclusion:-pending}"

            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || {
                echo "::error::Matching CI finished with conclusion=$conclusion"
                exit 1
              }
              echo "Matching CI passed for $GITHUB_SHA"
              exit 0
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for CI run for $GITHUB_SHA"
          exit 1

  github_ssh_deploy:
    name: GitHub runner — SSH production deploy
    needs: ci_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    continue-on-error: true
    outputs:
      passed: ${{ steps.result.outputs.passed }}
      attempted: ${{ steps.result.outputs.attempted }}

    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_PROJECT_PATH: ${{ secrets.PROD_PROJECT_PATH }}

    steps:
      - name: Check SSH deployment configuration
        id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${PROD_SSH_HOST:-}" ] \
            && [ -n "${PROD_SSH_PRIVATE_KEY:-}" ] \
            && [ -n "${PROD_SSH_KNOWN_HOSTS:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH deploy is not fully configured; falling back to self-hosted nuromix."
          fi

      - name: Configure pinned SSH
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/production_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/production_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/production_key" >/dev/null

      - name: Deploy backend and Mini App exact commit over SSH
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_user="${PROD_SSH_USER:-root}"
          deploy_port="${PROD_SSH_PORT:-22}"
          deploy_path="${PROD_PROJECT_PATH:-/root/tanya/banano_kling}"
          printf -v quoted_path '%q' "$deploy_path"
          printf -v quoted_sha '%q' "$GITHUB_SHA"

          ssh \
            -i "$HOME/.ssh/production_key" \
            -p "$deploy_port" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes \
            "$deploy_user@$PROD_SSH_HOST" \
            "bash -s -- $quoted_path $quoted_sha" <<'REMOTE'
          set -Eeuo pipefail
          PROJECT_DIR="$1"
          EXPECTED_SHA="$2"
          RUNTIME_PRICE_FILE="data/price.json"
          runtime_price_backup=""

          cleanup_runtime_price_backup() {
            if [ -n "${runtime_price_backup:-}" ] && [ -f "$runtime_price_backup" ]; then
              rm -f "$runtime_price_backup"
            fi
          }
          trap cleanup_runtime_price_backup EXIT

          command -v git >/dev/null
          command -v docker >/dev/null
          command -v flock >/dev/null

          exec 9>/var/lock/banano-kling-production-deploy.lock
          flock -n 9 || {
            echo "Another production deployment is already running" >&2
            exit 1
          }

          cd "$PROJECT_DIR"
          [ -d .git ] || {
            echo "Git repository not found: $PROJECT_DIR" >&2
            exit 1
          }

          git update-index -q --refresh || true
          if ! git diff --cached --quiet; then
            echo "Staged local changes block automatic deployment:" >&2
            git status --short >&2
            exit 1
          fi

          dirty_paths="$(git diff --name-only --diff-filter=ACDMRTUXB)"
          other_dirty_paths="$(
            printf '%s\n' "$dirty_paths" \
              | sed '/^$/d' \
              | grep -vxF "$RUNTIME_PRICE_FILE" \
              | grep -vE '^tests/' \
              || true
          )"
          if [ -n "$other_dirty_paths" ]; then
            echo "Tracked runtime changes outside $RUNTIME_PRICE_FILE block automatic deployment:" >&2
            printf '%s\n' "$other_dirty_paths" >&2
            git status --short >&2
            exit 1
          fi

          git fetch --prune origin tanyapi
          remote_sha="$(git rev-parse origin/tanyapi)"
          [ "$remote_sha" = "$EXPECTED_SHA" ] || {
            echo "Production branch moved: expected=$EXPECTED_SHA origin/tanyapi=$remote_sha" >&2
            exit 1
          }

          preserve_runtime_price=true
          if ! git diff --quiet HEAD "$EXPECTED_SHA" -- "$RUNTIME_PRICE_FILE"; then
            preserve_runtime_price=false
            echo "Applying versioned pricing from $RUNTIME_PRICE_FILE"
          fi

          # Production pricing is mutable runtime state managed by admins.
          # Preserve it unless the deployed commit intentionally changes it.
          if [ "$preserve_runtime_price" = true ] && [ -f "$RUNTIME_PRICE_FILE" ]; then
            runtime_price_backup="$(mktemp)"
            cp -- "$RUNTIME_PRICE_FILE" "$runtime_price_backup"
            echo "Preserving runtime pricing from $RUNTIME_PRICE_FILE"
          fi

          git switch tanyapi
          git reset --hard "$EXPECTED_SHA"
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]

          if [ -n "$runtime_price_backup" ]; then
            cp -- "$runtime_price_backup" "$RUNTIME_PRICE_FILE"
            rm -f "$runtime_price_backup"
            runtime_price_backup=""
            echo "Restored runtime pricing to $RUNTIME_PRICE_FILE"
          fi

          run_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }

          run_root bash scripts/deploy_backend_docker.sh deploy
          run_root bash scripts/deploy_backend_docker.sh status

          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' banano-kling-bot)"
          revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' banano-kling-bot)"
          [ "$health" = healthy ]
          [ "$revision" = "$EXPECTED_SHA" ]

          # The Mini App is served by Nginx on this same production server.
          # Build the exact checked-out commit locally and publish directly to
          # the existing /var/www frontend root. No remote/CDN deploy hop.
          run_root bash scripts/deploy_miniapp_local.sh "$EXPECTED_SHA"

          live_frontend_revision="$(
            curl -fsS --max-time 20 \
              "https://tanyapp.xn--e1aikcel5c5a.online/mini-app/revision.txt?revision=${EXPECTED_SHA}"
          )"
          [ "$live_frontend_revision" = "$EXPECTED_SHA" ]

          echo "deployed_sha=$(git rev-parse HEAD)"
          echo "container_revision=$revision"
          echo "container_health=$health"
          echo "miniapp_revision=$live_frontend_revision"
          REMOTE

      - name: Collect SSH deployment diagnostics
        if: failure() && steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          deploy_user="${PROD_SSH_USER:-root}"
          deploy_port="${PROD_SSH_PORT:-22}"
          deploy_path="${PROD_PROJECT_PATH:-/root/tanya/banano_kling}"
          printf -v quoted_path '%q' "$deploy_path"

          ssh \
            -i "$HOME/.ssh/production_key" \
            -p "$deploy_port" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$deploy_user@$PROD_SSH_HOST" \
            "bash -s -- $quoted_path" <<'REMOTE'
          set +e
          cd "$1" || exit 0
          echo '=== git ==='
          git status --short
          git log -1 --oneline
          echo '=== compose ==='
          docker compose -f compose.backend.yml ps
          docker compose -f compose.backend.yml logs --tail=200 bot
          echo '=== Mini App ==='
          curl -fsS --max-time 10 https://tanyapp.xn--e1aikcel5c5a.online/mini-app/revision.txt || true
          REMOTE

      - name: Record GitHub SSH result
        id: result
        if: always()
        shell: bash
        env:
          ENABLED: ${{ steps.gate.outputs.enabled }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$ENABLED" = true ] && [ "$DEPLOY_OUTCOME" = success ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "attempted=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "attempted=${ENABLED:-false}" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/production_key"

  nuromix_deploy:
    name: nuromix fallback — local production deploy
    needs: [ci_gate, github_ssh_deploy]
    if: >-
      ${{
        always() &&
        needs.ci_gate.result == 'success' &&
        needs.github_ssh_deploy.outputs.passed != 'true'
      }}
    runs-on: [self-hosted, linux, x64, nuromix]
    timeout-minutes: 70
    env:
      NUROMIX_PROJECT_PATH: ${{ vars.NUROMIX_BACKEND_PROJECT_PATH }}

    steps:
      - name: Deploy backend and Mini App exact commit locally
        shell: bash
        run: |
          set -Eeuo pipefail
          project_dir="${NUROMIX_PROJECT_PATH:-/root/tanya/banano_kling}"
          deploy_script="/tmp/nuromix-production-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"

          cat > "$deploy_script" <<'LOCAL'
          set -Eeuo pipefail
          PROJECT_DIR="$1"
          EXPECTED_SHA="$2"
          RUNTIME_PRICE_FILE="data/price.json"
          runtime_price_backup=""

          cleanup_runtime_price_backup() {
            if [ -n "${runtime_price_backup:-}" ] && [ -f "$runtime_price_backup" ]; then
              rm -f "$runtime_price_backup"
            fi
          }
          trap cleanup_runtime_price_backup EXIT

          command -v git >/dev/null
          command -v docker >/dev/null
          command -v flock >/dev/null

          exec 9>/var/lock/banano-kling-production-deploy.lock
          flock -n 9 || {
            echo "Another production deployment is already running" >&2
            exit 1
          }

          cd "$PROJECT_DIR"
          [ -d .git ] || {
            echo "Git repository not found: $PROJECT_DIR" >&2
            exit 1
          }

          git update-index -q --refresh || true
          if ! git diff --cached --quiet; then
            echo "Staged local changes block automatic deployment:" >&2
            git status --short >&2
            exit 1
          fi

          dirty_paths="$(git diff --name-only --diff-filter=ACDMRTUXB)"
          other_dirty_paths="$(
            printf '%s\n' "$dirty_paths" \
              | sed '/^$/d' \
              | grep -vxF "$RUNTIME_PRICE_FILE" \
              | grep -vE '^tests/' \
              || true
          )"
          if [ -n "$other_dirty_paths" ]; then
            echo "Tracked runtime changes outside $RUNTIME_PRICE_FILE block automatic deployment:" >&2
            printf '%s\n' "$other_dirty_paths" >&2
            git status --short >&2
            exit 1
          fi

          git fetch --prune origin tanyapi
          remote_sha="$(git rev-parse origin/tanyapi)"
          [ "$remote_sha" = "$EXPECTED_SHA" ] || {
            echo "Production branch moved: expected=$EXPECTED_SHA origin/tanyapi=$remote_sha" >&2
            exit 1
          }

          preserve_runtime_price=true
          if ! git diff --quiet HEAD "$EXPECTED_SHA" -- "$RUNTIME_PRICE_FILE"; then
            preserve_runtime_price=false
            echo "Applying versioned pricing from $RUNTIME_PRICE_FILE"
          fi

          # Production pricing is mutable runtime state managed by admins.
          # Preserve it unless the deployed commit intentionally changes it.
          if [ "$preserve_runtime_price" = true ] && [ -f "$RUNTIME_PRICE_FILE" ]; then
            runtime_price_backup="$(mktemp)"
            cp -- "$RUNTIME_PRICE_FILE" "$runtime_price_backup"
            echo "Preserving runtime pricing from $RUNTIME_PRICE_FILE"
          fi

          git switch tanyapi
          git reset --hard "$EXPECTED_SHA"
          actual_sha="$(git rev-parse HEAD)"
          [ "$actual_sha" = "$EXPECTED_SHA" ]

          if [ -n "$runtime_price_backup" ]; then
            cp -- "$runtime_price_backup" "$RUNTIME_PRICE_FILE"
            rm -f "$runtime_price_backup"
            runtime_price_backup=""
            echo "Restored runtime pricing to $RUNTIME_PRICE_FILE"
          fi

          bash scripts/deploy_backend_docker.sh deploy
          bash scripts/deploy_backend_docker.sh status

          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' banano-kling-bot)"
          revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' banano-kling-bot)"
          [ "$health" = healthy ]
          [ "$revision" = "$EXPECTED_SHA" ]

          bash scripts/deploy_miniapp_local.sh "$EXPECTED_SHA"
          live_frontend_revision="$(
            curl -fsS --max-time 20 \
              "https://tanyapp.xn--e1aikcel5c5a.online/mini-app/revision.txt?revision=${EXPECTED_SHA}"
          )"
          [ "$live_frontend_revision" = "$EXPECTED_SHA" ]

          echo "nuromix_host=$(hostname)"
          echo "deployed_sha=$actual_sha"
          echo "container_revision=$revision"
          echo "container_health=$health"
          echo "miniapp_revision=$live_frontend_revision"
          LOCAL

          chmod 0700 "$deploy_script"
          cleanup() { rm -f "$deploy_script"; }
          trap cleanup EXIT

          if [ "$(id -u)" -eq 0 ]; then
            bash "$deploy_script" "$project_dir" "$GITHUB_SHA"
          else
            sudo -n bash "$deploy_script" "$project_dir" "$GITHUB_SHA"
          fi

      - name: Collect local diagnostics on failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          project_dir="${NUROMIX_PROJECT_PATH:-/root/tanya/banano_kling}"
          diagnostic='cd "$1" || exit 0
          echo "=== host ==="
          hostname
          id
          echo "=== git ==="
          git status --short
          git log -1 --oneline
          echo "=== compose ==="
          docker compose -f compose.backend.yml ps
          docker compose -f compose.backend.yml logs --tail=200 bot
          echo "=== Mini App ==="
          curl -fsS --max-time 10 https://tanyapp.xn--e1aikcel5c5a.online/mini-app/revision.txt || true'

          if [ "$(id -u)" -eq 0 ]; then
            bash -c "$diagnostic" -- "$project_dir"
          else
            sudo -n bash -c "$diagnostic" -- "$project_dir"
          fi

  deployment_gate:
    name: Production deployment gate
    needs: [github_ssh_deploy, nuromix_deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require one successful deployment path
        env:
          GITHUB_SSH_PASSED: ${{ needs.github_ssh_deploy.outputs.passed }}
          NUROMIX_RESULT: ${{ needs.nuromix_deploy.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_SSH_PASSED" = true ]; then
            echo "Production backend and Mini App deployed through GitHub-hosted SSH runner"
            exit 0
          fi

          if [ "$NUROMIX_RESULT" = success ]; then
            echo "Production backend and Mini App deployed through self-hosted nuromix runner"
            exit 0
          fi

          echo "::error::Production was not deployed. github_ssh=$GITHUB_SSH_PASSED nuromix=$NUROMIX_RESULT"
          exit 1

  publish_status:
    name: Publish production deploy status
    needs: [ci_gate, github_ssh_deploy, nuromix_deploy, deployment_gate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish tanya/deploy status
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_GATE_RESULT: ${{ needs.deployment_gate.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state=failure
          description="Production deployment failed"
          if [ "$DEPLOYMENT_GATE_RESULT" = success ]; then
            state=success
            description="Production backend and Mini App deployed at exact SHA"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='tanya/deploy' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
