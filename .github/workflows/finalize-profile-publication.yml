name: Finalize profile publication guard

on:
  pull_request:
    branches:
      - tanyapi

concurrency:
  group: finalize-profile-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-publication-scope
          fetch-depth: 0
          show-progress: false

      - name: Apply final adult blur guard
        run: python scripts/finalize_profile_publication.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Python checks
        run: |
          python -m py_compile bot/database.py bot/miniapp.py
          python -m pytest tests/test_database.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Frontend build
        working-directory: frontend/miniapp-v0
        run: |
          npm ci
          npm run build

      - name: Commit final guard
        run: |
          rm -f .github/workflows/finalize-profile-publication.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep adult profile publications blurred"
          git push origin HEAD:agent/profile-publication-scope
