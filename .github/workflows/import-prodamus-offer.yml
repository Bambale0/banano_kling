name: Import exact Prodamus offer

on:
  push:
    branches:
      - temp-prodamus-offer-import

permissions:
  contents: write

jobs:
  import-offer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: temp-prodamus-offer-import

      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch exact offer PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legal
          curl --fail --show-error --location \
            --retry 4 --retry-delay 2 --retry-all-errors \
            'https://anketa.prodamus.ru/api/questionnaire/v1/offer/get-pdf?questionnaire_uid=70d8bf093e26e890c66dd3f54b72448c' \
            --output legal/public-offer.pdf
          test "$(head -c 5 legal/public-offer.pdf)" = '%PDF-'
          test "$(stat -c%s legal/public-offer.pdf)" -gt 1000
          pdfinfo legal/public-offer.pdf | tee /tmp/offer-pdfinfo.txt
          pdftotext -layout -nopgbrk legal/public-offer.pdf legal/public-offer.txt
          test -s legal/public-offer.txt
          sha256sum legal/public-offer.pdf | tee /tmp/offer-sha256.txt

      - name: Commit exact document to temporary import branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-prodamus-offer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legal/public-offer.pdf legal/public-offer.txt .github/workflows/import-prodamus-offer.yml
          git commit -m 'chore: import exact Prodamus offer source'
          git push origin HEAD:temp-prodamus-offer-import
