name: Run Mini App four-fix patch

on:
  pull_request:
    branches: [tanyapi]
    types: [edited]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.number == 102
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tanyapi
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Apply requested Mini App fixes
        run: python .github/scripts/apply_miniapp_four_fixes.py

      - name: Verify regression contracts
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio
          pip install --quiet -r requirements.txt
          python -m pytest \
            tests/test_miniapp_four_fixes_contract.py \
            tests/test_trend_video_preview_delivery.py \
            tests/test_feed_video_media_contract.py \
            -q

      - name: Verify Mini App build
        working-directory: frontend/miniapp-v0
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit verified fixes to tanyapi
        shell: bash
        run: |
          rm -f \
            .github/workflows/_apply_trends_profile_refs_hotfix.yml \
            .github/workflows/_run_miniapp_four_fixes_on_pr_edit.yml \
            .github/scripts/apply_miniapp_four_fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(miniapp): repair trends profiles and video refs'
          git push origin HEAD:tanyapi
