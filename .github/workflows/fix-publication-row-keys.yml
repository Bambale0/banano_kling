name: Fix Publication Row Keys

on:
  push:
    branches:
      - feat/profile-only-publication

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-only-publication
          fetch-depth: 0
      - name: Fix aiosqlite Row key lookup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot/handlers/publication_scope_compat.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              '        if hasattr(row, "keys") and key not in row:\n',
              '        if hasattr(row, "keys") and key not in row.keys():  # noqa: SIM118 - Row membership checks values\n',
          )
          path.write_text(source, encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/handlers/publication_scope_compat.py
          git commit -m "fix: read publication scope columns from database rows"
          git push origin HEAD:feat/profile-only-publication
