name: Partner Approval Frontend Validation

on:
  pull_request:
    branches: [tanyapi]
    paths:
      - 'frontend/miniapp-v0/components/partner-approval-sheet.tsx'
      - 'frontend/miniapp-v0/components/mini-app-shell.tsx'
      - 'frontend/miniapp-v0/components/__tests__/partner-approval-sheet.test.tsx'
      - '.github/workflows/partner-approval-frontend.yml'

permissions:
  contents: read

jobs:
  frontend_partner_approval:
    name: Mini App — partner approval unit, lint and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend/miniapp-v0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run partner approval component unit tests
        run: npm test -- --runInBand components/__tests__/partner-approval-sheet.test.tsx

      - name: Lint Mini App
        run: npm run lint

      - name: Build production Mini App
        run: npm run build
