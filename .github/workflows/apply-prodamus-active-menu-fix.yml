name: Apply Prodamus active menu fix

on:
  push:
    branches:
      - fix/tanyapi-prodamus-active-menu-label

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[prodamus-menu-bot]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tanyapi-prodamus-active-menu-label
          fetch-depth: 0

      - name: Apply validated source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('bot/handlers/prodamus_payments.py')
          s = p.read_text()
          s = s.replace('router = Router()\n', 'router = Router()\nPRODAMUS_PAYMENT_BUTTON_TEXT = "🇰🇿🇦🇲 Карта | РФ | СНГ"\n', 1)
          if s.count('PRODAMUS_PAYMENT_BUTTON_TEXT = "🇰🇿🇦🇲 Карта | РФ | СНГ"') != 1:
              raise SystemExit('button label insertion failed')
          s = s.replace('text="💳 Prodamus · Карта и СБП",', 'text=PRODAMUS_PAYMENT_BUTTON_TEXT,')
          marker = 'def install_prodamus_text_payment_keyboard() -> None:\n'
          block = '''def install_prodamus_flat_text_payment_keyboard() -> None:\n    """Expose Prodamus in the active flat Telegram payment-method menu."""\n    from bot.handlers import lava_checkout as lava_checkout_module\n\n    current_keyboard = lava_checkout_module._payment_options_keyboard\n    if getattr(current_keyboard, "_prodamus_flat_payment_compat", False):\n        return\n\n    @wraps(current_keyboard)\n    def payment_options_with_prodamus(*args: Any, **kwargs: Any) -> InlineKeyboardMarkup:\n        package_id = str(args[0] if args else kwargs.get("package_id") or "")\n        markup = current_keyboard(*args, **kwargs)\n        return _decorate_payment_keyboard(markup, package_id)\n\n    payment_options_with_prodamus._prodamus_flat_payment_compat = True\n    lava_checkout_module._payment_options_keyboard = payment_options_with_prodamus\n\n\n'''
          if 'def install_prodamus_flat_text_payment_keyboard()' not in s:
              if marker not in s:
                  raise SystemExit('text keyboard marker missing')
              s = s.replace(marker, block + marker, 1)
          old = '''def install_prodamus_payment_surfaces() -> None:\n    install_prodamus_text_payment_keyboard()\n    install_prodamus_miniapp_payment()\n'''
          new = '''def install_prodamus_payment_surfaces() -> None:\n    install_prodamus_text_payment_keyboard()\n    install_prodamus_flat_text_payment_keyboard()\n    install_prodamus_miniapp_payment()\n'''
          if old not in s:
              raise SystemExit('surface installer marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('frontend/miniapp-v0/components/balance-sheet.tsx')
          s = p.read_text()
          if 'Prodamus · Карта и СБП' not in s:
              raise SystemExit('Mini App label marker missing')
          p.write_text(s.replace('Prodamus · Карта и СБП', '🇰🇿🇦🇲 Карта | РФ | СНГ', 1))

          p = Path('tests/test_tribute_payments.py')
          s = p.read_text()
          if 'from bot.handlers import lava_checkout\n' not in s:
              s = s.replace('from bot.handlers import prodamus_payments as prodamus\n', 'from bot.handlers import lava_checkout\nfrom bot.handlers import prodamus_payments as prodamus\n', 1)
          s = s.replace('button for button in buttons if button.text == "💳 Prodamus · Карта и СБП"', 'button for button in buttons if button.text == prodamus.PRODAMUS_PAYMENT_BUTTON_TEXT')
          s = s.replace('assert "Prodamus · Карта и СБП" in source', 'assert "🇰🇿🇦🇲 Карта | РФ | СНГ" in source')
          anchor = 'def test_miniapp_keeps_tribute_and_prodamus_together() -> None:\n'
          test = '''def test_active_flat_payment_menu_includes_prodamus_before_reserve(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    monkeypatch.setenv("PRODAMUS_PAYFORM_URL", "https://example.payform.ru/")\n    monkeypatch.setenv("PRODAMUS_SECRET_KEY", "test-secret")\n    monkeypatch.setenv("PRODAMUS_SYS", "test-system")\n\n    def fake_flat_keyboard(package_id: str, **_kwargs):\n        from aiogram.types import InlineKeyboardButton, InlineKeyboardMarkup\n\n        return InlineKeyboardMarkup(\n            inline_keyboard=[\n                [InlineKeyboardButton(text="💳 Картой", callback_data=f"card_{package_id}")],\n                [InlineKeyboardButton(text="⚡ СБП", callback_data=f"sbp_{package_id}")],\n                [InlineKeyboardButton(text="Резерв 2", url="https://example.test/reserve")],\n                [InlineKeyboardButton(text="⭐ Stars", callback_data=f"stars_{package_id}")],\n                [InlineKeyboardButton(text="◀️ Назад", callback_data="menu_topup")],\n            ]\n        )\n\n    monkeypatch.setattr(lava_checkout, "_payment_options_keyboard", fake_flat_keyboard)\n    prodamus.install_prodamus_flat_text_payment_keyboard()\n\n    markup = lava_checkout._payment_options_keyboard("start")\n    buttons = [button for row in markup.inline_keyboard for button in row]\n    texts = [button.text for button in buttons]\n    assert prodamus.PRODAMUS_PAYMENT_BUTTON_TEXT in texts\n    assert texts.index(prodamus.PRODAMUS_PAYMENT_BUTTON_TEXT) < texts.index("Резерв 2")\n    button = next(\n        item for item in buttons if item.text == prodamus.PRODAMUS_PAYMENT_BUTTON_TEXT\n    )\n    assert button.callback_data == "prodamus_pay_start"\n\n\n'''
          if 'def test_active_flat_payment_menu_includes_prodamus_before_reserve(' not in s:
              if anchor not in s:
                  raise SystemExit('test insertion anchor missing')
              s = s.replace(anchor, test + anchor, 1)
          p.write_text(s)
          PY

      - name: Verify patch
        run: |
          git diff --check
          grep -q 'PRODAMUS_PAYMENT_BUTTON_TEXT = "🇰🇿🇦🇲 Карта | РФ | СНГ"' bot/handlers/prodamus_payments.py
          grep -q 'install_prodamus_flat_text_payment_keyboard' bot/handlers/prodamus_payments.py
          grep -q '🇰🇿🇦🇲 Карта | РФ | СНГ' frontend/miniapp-v0/components/balance-sheet.tsx

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/handlers/prodamus_payments.py frontend/miniapp-v0/components/balance-sheet.tsx tests/test_tribute_payments.py
          git commit -m 'fix(payments): expose Prodamus in active menu [prodamus-menu-bot]'
          git push origin HEAD:fix/tanyapi-prodamus-active-menu-label
