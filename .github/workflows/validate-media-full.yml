name: Validate mobile media fix

on:
  pull_request:
    branches: [ci/media-full-validation-base]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      BOT_TOKEN: 123456:TEST_TOKEN_FOR_CI_ONLY
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout media branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply one-shot lint fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f scripts/fix_mobile_media_lint.py ]; then
            python scripts/fix_mobile_media_lint.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fix changed-line lint in mobile media upload flow"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet ruff pytest pytest-asyncio pytest-mock
          pip install --quiet -r requirements.txt
          python -m pip check

      - name: Gate Ruff on changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
              'bot/*.py' 'bot/**/*.py' 'scripts/*.py' 'scripts/**/*.py' \
              'tests/*.py' 'tests/**/*.py'
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            python scripts/ruff_changed_lines.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              "${changed_files[@]}"
          fi

      - name: Run full safe regression suite
        run: |
          pytest tests/ \
            --ignore=tests/live \
            -m "not live_smoke" \
            -v \
            --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/miniapp-v0
        run: npm ci --no-audit --no-fund

      - name: Test and lint frontend
        working-directory: frontend/miniapp-v0
        run: |
          npm test -- --runInBand
          npm run lint

      - name: Build production Mini App
        working-directory: frontend/miniapp-v0
        env:
          NEXT_PUBLIC_API_BASE_URL: https://tanyapi.chillcreative.ru
        run: npm run build

      - name: Build production Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          head_sha="$(git rev-parse HEAD)"
          docker build \
            --build-arg VCS_REF="$head_sha" \
            --build-arg BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            -t "banano-media-validation:$head_sha" .
          echo "MEDIA_IMAGE=banano-media-validation:$head_sha" >> "$GITHUB_ENV"

      - name: Verify image and Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint python "$MEDIA_IMAGE" -m compileall -q /app/bot /app/scripts
          docker run --rm \
            -e BOT_TOKEN=123456:TEST_TOKEN_FOR_CI_ONLY \
            -e BANANO_SKIP_PROJECT_ENV=1 \
            -e BANANO_LOG_TO_STDOUT=1 \
            --entrypoint python "$MEDIA_IMAGE" \
            -c 'import bot.config, bot.database, bot.main, bot.miniapp; print("container imports: ok")'
          trap 'rm -f .env .env.postgres' EXIT
          cat > .env <<'ENV'
          BOT_TOKEN=123456:TEST_TOKEN_FOR_CI_ONLY
          WEBHOOK_HOST=https://example.invalid
          WEBHOOK_PORT=1888
          DATABASE_URL=sqlite:////app/data/ci.db
          REDIS_URL=redis://127.0.0.1:6379/0
          ENV
          : > .env.postgres
          BANANO_IMAGE="$MEDIA_IMAGE" docker compose -f compose.backend.yml config --quiet
