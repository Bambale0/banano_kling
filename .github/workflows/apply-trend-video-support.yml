name: Apply trend video support

on:
  push:
    branches:
      - feat/trend-video-support
    paths:
      - "scripts/apply_trend_video_support.py"
      - ".github/workflows/apply-trend-video-support.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trend-video-support
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Apply source changes
        run: python scripts/apply_trend_video_support.py

      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ruff pytest pytest-asyncio
          if [ -f requirements.txt ]; then python -m pip install --quiet -r requirements.txt; fi

      - name: Lint and compile
        run: |
          ruff check \
            bot/handlers/trend_video_compat.py \
            bot/handlers/__init__.py \
            tests/test_trend_video_compat.py \
            --ignore=E402,F403,F405,E501,RUF059
          python -m py_compile \
            bot/handlers/trend_video_compat.py \
            bot/handlers/__init__.py \
            tests/test_trend_video_compat.py

      - name: Run trend tests
        run: pytest tests/test_trends_compat.py tests/test_trend_video_compat.py -q

      - name: Build Mini App
        working-directory: frontend/miniapp-v0
        run: |
          npm ci
          npm run build

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Add video trends to bot and Mini App"
          git push origin HEAD:feat/trend-video-support
