name: One-shot welcome bonus migration

on:
  push:
    branches: [tanyapi]
    paths:
      - .github/workflows/one-shot-welcome-bonus-5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tanyapi
          fetch-depth: 0

      - name: Apply welcome bonus source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          database = Path('bot/database.py')
          text = database.read_text(encoding='utf-8')

          replacements = {
              'PARTNER_NEW_USER_BONUS: int = 15   # бананы новому пользователю при регистрации':
                  'PARTNER_NEW_USER_BONUS: int = 5    # бананы новому пользователю при регистрации',
              '"INSERT INTO users (telegram_id, credits, referral_code, referred_by) VALUES (?, 15, ?, NULL)",\n                (telegram_id, new_referral_code),':
                  '"INSERT INTO users (telegram_id, credits, referral_code, referred_by) VALUES (?, ?, ?, NULL)",\n                (telegram_id, PARTNER_NEW_USER_BONUS, new_referral_code),',
              'новичок уже получил 15 при регистрации':
                  'новичок уже получил 5 при регистрации',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected database fragment: {old}')
              text = text.replace(old, new, 1)

          database.write_text(text, encoding='utf-8')

          tests = Path('tests/test_referral_system.py')
          test_text = tests.read_text(encoding='utf-8').replace(
              'PARTNER_NEW_USER_BONUS=15 at registration',
              'PARTNER_NEW_USER_BONUS=5 at registration',
          )
          if 'def test_new_user_receives_five_welcome_bananas' not in test_text:
              test_text += '''\n\ndef test_new_user_receives_five_welcome_bananas(tmp_path, monkeypatch):
              async def run():
                  db = _reload_database(monkeypatch, tmp_path / "welcome_bonus.db")
                  await db.init_db()
                  user = await db.get_or_create_user(550001)
                  assert db.PARTNER_NEW_USER_BONUS == 5
                  assert user.credits == 5

              asyncio.run(run())
          '''
          tests.write_text(test_text, encoding='utf-8')

          assert 'PARTNER_NEW_USER_BONUS: int = 5' in text
          assert 'VALUES (?, 15, ?, NULL)' not in text
          assert 'Welcome-бонус для новых пользователей: 15🍌' not in Path(
              'frontend/miniapp-v0/components/balance-sheet.tsx'
          ).read_text(encoding='utf-8')
          PY

          python -m compileall -q bot/database.py tests/test_referral_system.py

      - name: Commit changes and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-welcome-bonus-5.yml
          git add bot/database.py tests/test_referral_system.py
          git diff --cached --check
          git commit -m "Fix welcome bonus at 5 bananas"
          git push origin HEAD:tanyapi
