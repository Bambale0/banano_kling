name: Apply focused refund Ruff fixes

on:
  push:
    branches:
      - agent/tanyapi-idempotent-generation-refunds

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tanyapi-idempotent-generation-refunds
          fetch-depth: 0

      - name: Apply focused fixes without reformatting legacy imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          miniapp_path = Path("bot/miniapp.py")
          miniapp = miniapp_path.read_text(encoding="utf-8")

          top_level_import = (
              "from bot.services.generation_refund_service import "
              "refund_generation_credits_once\n"
          )
          if miniapp.count(top_level_import) != 1:
              raise SystemExit(
                  f"Expected one refund service import, found {miniapp.count(top_level_import)}"
              )
          miniapp = miniapp.replace(top_level_import, "", 1)

          helper_marker = "\nVIDEO_MODELS = ("
          helper = '''

async def _refund_miniapp_generation_cost_once(
    telegram_id: int,
    amount: float,
    *,
    refund_key: str,
    reason: str,
) -> bool:
    from bot.services.generation_refund_service import (  # noqa: PLC0415
        refund_generation_credits_once,
    )

    return await refund_generation_credits_once(
        telegram_id,
        amount,
        refund_key=refund_key,
        reason=reason,
    )
'''
          if miniapp.count(helper_marker) != 1:
              raise SystemExit("VIDEO_MODELS helper marker not found exactly once")
          if "async def _refund_miniapp_generation_cost_once(" in miniapp:
              raise SystemExit("Refund helper already exists")
          miniapp = miniapp.replace(helper_marker, helper + helper_marker, 1)

          call_count = miniapp.count("await refund_generation_credits_once(")
          if call_count != 5:
              raise SystemExit(f"Expected 5 refund calls, found {call_count}")
          miniapp = miniapp.replace(
              "await refund_generation_credits_once(",
              "await _refund_miniapp_generation_cost_once(",
          )

          nested = '''        if motion_debit_succeeded:
              if not motion_launch_accepted:
                  try:
          '''.replace("              ", "")
          combined = '''        if motion_debit_succeeded and not motion_launch_accepted:
              try:
          '''.replace("              ", "")
          if miniapp.count(nested) != 1:
              raise SystemExit(
                  f"Expected one nested Motion guard, found {miniapp.count(nested)}"
              )
          miniapp = miniapp.replace(nested, combined, 1)

          old_body = '''                try:
                      await _refund_miniapp_generation_cost_once(
                          telegram_id,
                          cost,
                          refund_key=motion_refund_key,
                          reason="motion_exception_before_provider_acceptance",
                      )
                  except Exception:
                      logger.exception(
                          "Mini App Motion Control refund failed: key=%s",
                          motion_refund_key,
                      )
          '''.replace("              ", "")
          new_body = '''            try:
                  await _refund_miniapp_generation_cost_once(
                      telegram_id,
                      cost,
                      refund_key=motion_refund_key,
                      reason="motion_exception_before_provider_acceptance",
                  )
              except Exception:
                  logger.exception(
                      "Mini App Motion Control refund failed: key=%s",
                      motion_refund_key,
                  )
          '''.replace("              ", "")
          if miniapp.count(old_body) != 1:
              raise SystemExit(
                  f"Expected one nested Motion body, found {miniapp.count(old_body)}"
              )
          miniapp = miniapp.replace(old_body, new_body, 1)
          miniapp_path.write_text(miniapp, encoding="utf-8")

          test_path = Path("tests/test_generation_refund_service.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_imports = "import asyncio\nimport ast\n"
          new_imports = "import ast\nimport asyncio\n"
          if test_text.count(old_imports) != 1:
              raise SystemExit("Refund test import block not found exactly once")
          test_path.write_text(
              test_text.replace(old_imports, new_imports, 1),
              encoding="utf-8",
          )
          PY

          python -m py_compile \
            bot/miniapp.py \
            bot/services/generation_refund_service.py \
            tests/test_generation_refund_service.py
          rm -f .github/workflows/preview-refund-ruff.yml
          rm -f .github/workflows/apply-refund-ruff-fixes.yml

      - name: Commit focused fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bot/miniapp.py \
            tests/test_generation_refund_service.py \
            .github/workflows/preview-refund-ruff.yml \
            .github/workflows/apply-refund-ruff-fixes.yml
          git commit -m 'Fix idempotent refund lint'
          git push origin HEAD:agent/tanyapi-idempotent-generation-refunds
