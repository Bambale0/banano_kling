name: Temporary Ruff preview

on:
  push:
    branches:
      - agent/tanyapi-secure-telegram-webhook

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff
      - name: Show canonical Ruff fixes
        run: |
          ruff check \
            bot/secure_main.py \
            bot/services/telegram_webhook_runtime.py \
            tests/test_secure_telegram_webhook.py \
            --fix --diff
