name: Apply idempotent Mini App refunds

on:
  pull_request:
    branches:
      - agent/tanyapi-atomic-generation-debit

permissions:
  contents: write

jobs:
  codemod:
    if: github.head_ref == 'agent/tanyapi-idempotent-generation-refunds'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tanyapi-idempotent-generation-refunds
          fetch-depth: 0

      - name: Replace direct credit grants with refund ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('bot/miniapp.py')
          text = path.read_text(encoding='utf-8')

          direct_import = '    add_credits,\n'
          if text.count(direct_import) != 1:
              raise SystemExit(
                  f'Expected one add_credits import, found {text.count(direct_import)}'
              )
          text = text.replace(direct_import, '', 1)

          import_marker = (
              'from bot.services.reference_storage_service import save_reference_file\n'
          )
          refund_import = (
              'from bot.services.generation_refund_service import '
              'refund_generation_credits_once\n'
          )
          if text.count(import_marker) != 1:
              raise SystemExit('Reference storage import marker not found exactly once')
          text = text.replace(import_marker, refund_import + import_marker, 1)

          failure_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)if launch_result\["status"\] == "failed":\n'
              r'(?P=indent)    if not is_admin:\n'
              r'(?P=indent)        await add_credits\(telegram_id, (?P<amount>unit_cost|cost)\)$'
          )

          def replace_launch_refund(match: re.Match[str]) -> str:
              indent = match.group('indent')
              amount = match.group('amount')
              return (
                  f'{indent}if launch_result["status"] == "failed":\n'
                  f'{indent}    if not is_admin:\n'
                  f'{indent}        await refund_generation_credits_once(\n'
                  f'{indent}            telegram_id,\n'
                  f'{indent}            {amount},\n'
                  f'{indent}            refund_key=f"generation:{{launch_result[\'task_id\']}}",\n'
                  f'{indent}            reason="provider_launch_failed",\n'
                  f'{indent}        )'
              )

          text, launch_replacements = failure_pattern.subn(
              replace_launch_refund,
              text,
          )
          if launch_replacements != 3:
              raise SystemExit(
                  f'Expected 3 image/video launch refund replacements, got {launch_replacements}'
              )

          motion_header = '''async def miniapp_generate_motion(request: web.Request) -> web.Response:
              """Mini App endpoint for Motion Control."""
              try:
          '''.replace('              ', '')
          motion_header_replacement = '''async def miniapp_generate_motion(request: web.Request) -> web.Response:
              """Mini App endpoint for Motion Control."""
              motion_refund_key = f"miniapp-motion:{time.time_ns()}:{id(request)}"
              motion_debit_succeeded = False
              motion_launch_accepted = False
              try:
          '''.replace('              ', '')
          if text.count(motion_header) != 1:
              raise SystemExit('Motion function header not found exactly once')
          text = text.replace(motion_header, motion_header_replacement, 1)

          motion_start = text.index('async def miniapp_generate_motion(')
          motion_end_marker = '\ndef setup_miniapp_routes('
          motion_end = text.index(motion_end_marker, motion_start)
          before = text[:motion_start]
          motion = text[motion_start:motion_end]
          after = text[motion_end:]

          debit_block = '''        debit_error = await _deduct_miniapp_generation_cost(telegram_id, cost)
              if debit_error is not None:
                  return debit_error
          '''.replace('              ', '')
          debit_replacement = debit_block + '        motion_debit_succeeded = not is_admin\n'
          if motion.count(debit_block) != 1:
              raise SystemExit(
                  f'Expected one Motion debit block, found {motion.count(debit_block)}'
              )
          motion = motion.replace(debit_block, debit_replacement, 1)

          classify_line = (
              '        result_status, error_message = '
              '_classify_video_generation_result(result)\n'
          )
          if motion.count(classify_line) != 1:
              raise SystemExit(
                  f'Expected one Motion classification, found {motion.count(classify_line)}'
              )
          motion = motion.replace(
              classify_line,
              classify_line
              + '        motion_launch_accepted = result_status in {"queued", "done"}\n',
              1,
          )

          explicit_refund = '''        await complete_video_task(local_task_id, None)
              if not is_admin:
                  await add_credits(telegram_id, cost)
          '''.replace('              ', '')
          explicit_replacement = '''        await complete_video_task(local_task_id, None)
              if motion_debit_succeeded:
                  await refund_generation_credits_once(
                      telegram_id,
                      cost,
                      refund_key=motion_refund_key,
                      reason="provider_launch_failed",
                  )
          '''.replace('              ', '')
          if motion.count(explicit_refund) != 1:
              raise SystemExit('Motion explicit refund block not found exactly once')
          motion = motion.replace(explicit_refund, explicit_replacement, 1)

          exception_refund = '''    except Exception as e:
              logger.exception(f"Mini App Motion Control failed: {e}")
              if 'telegram_id' in locals() and 'cost' in locals():
                  try:
                      await add_credits(telegram_id, cost)
                  except Exception:
                      pass
              return _miniapp_error_response(e, log_message="Mini App Motion Control generation failed")
          '''.replace('              ', '')
          exception_replacement = '''    except Exception as e:
              logger.exception(f"Mini App Motion Control failed: {e}")
              if motion_debit_succeeded:
                  if not motion_launch_accepted:
                      try:
                          await refund_generation_credits_once(
                              telegram_id,
                              cost,
                              refund_key=motion_refund_key,
                              reason="motion_exception_before_provider_acceptance",
                          )
                      except Exception:
                          logger.exception(
                              "Mini App Motion Control refund failed: key=%s",
                              motion_refund_key,
                          )
              return _miniapp_error_response(e, log_message="Mini App Motion Control generation failed")
          '''.replace('              ', '')
          if motion.count(exception_refund) != 1:
              raise SystemExit('Motion exception refund block not found exactly once')
          motion = motion.replace(exception_refund, exception_replacement, 1)

          text = before + motion + after
          if 'await add_credits(' in text:
              raise SystemExit('Direct add_credits call remains in Mini App')

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile bot/miniapp.py bot/services/generation_refund_service.py
          rm -f .github/workflows/apply-idempotent-refunds.yml

      - name: Commit focused refund changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/miniapp.py .github/workflows/apply-idempotent-refunds.yml
          git commit -m 'Use idempotent generation refunds'
          git push origin HEAD:agent/tanyapi-idempotent-generation-refunds
