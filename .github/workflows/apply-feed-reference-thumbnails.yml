name: Apply feed reference thumbnails

on:
  push:
    branches: [tanyapi]
    paths:
      - '.github/workflows/apply-feed-reference-thumbnails.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tanyapi
          fetch-depth: 0
      - name: Wire thumbnail endpoints into Mini App
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('bot/main.py')
          text = main.read_text(encoding='utf-8')
          old = 'from bot.browser_auth import setup_browser_auth_routes\nfrom bot.miniapp import setup_miniapp_routes\n'
          new = 'from bot.browser_auth import setup_browser_auth_routes\nfrom bot.feed_reference_media import setup_feed_reference_media_routes\nfrom bot.miniapp import setup_miniapp_routes\n'
          if old not in text and 'from bot.feed_reference_media import setup_feed_reference_media_routes' not in text:
              raise SystemExit('main import anchor not found')
          text = text.replace(old, new, 1)
          old = '    setup_browser_auth_routes(app)\n    setup_miniapp_routes(app)\n'
          new = '    setup_browser_auth_routes(app)\n    setup_feed_reference_media_routes(app)\n    setup_miniapp_routes(app)\n'
          if old not in text and '    setup_feed_reference_media_routes(app)\n' not in text:
              raise SystemExit('main setup anchor not found')
          text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          feed = Path('frontend/miniapp-v0/components/tabs/feed-tab.tsx')
          text = feed.read_text(encoding='utf-8')
          old = "import { normalizeMiniAppMediaUrl, videoPreviewFrameUrl } from '@/lib/media-url'"
          new = "import {\n  feedReferenceImageFullUrl,\n  feedReferenceImageThumbnailUrl,\n  normalizeMiniAppMediaUrl,\n  videoPreviewFrameUrl,\n} from '@/lib/media-url'"
          if old not in text and 'feedReferenceImageThumbnailUrl' not in text:
              raise SystemExit('feed import anchor not found')
          text = text.replace(old, new, 1)

          old = '                    onClick={() => setReferencePreview(reference)}'
          new = """                    onClick={() => setReferencePreview(
                      reference.type === 'image'
                        ? { type: 'image', url: feedReferenceImageFullUrl(previewItem.id, index) }
                        : reference
                    )}"""
          if old not in text and 'feedReferenceImageFullUrl(previewItem.id, index)' not in text:
              raise SystemExit('feed reference click anchor not found')
          text = text.replace(old, new, 1)

          old = '<img src={normalizeMiniAppMediaUrl(reference.url)} alt="" className="h-full w-full object-cover" />'
          new = '<img src={feedReferenceImageThumbnailUrl(previewItem.id, index)} alt="" loading="lazy" decoding="async" className="h-full w-full object-cover" />'
          if old not in text and 'feedReferenceImageThumbnailUrl(previewItem.id, index)' not in text:
              raise SystemExit('feed reference image anchor not found')
          text = text.replace(old, new, 1)
          feed.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/main.py frontend/miniapp-v0/components/tabs/feed-tab.tsx
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'fix(feed): load reference thumbnails on demand'
          git push origin HEAD:tanyapi
