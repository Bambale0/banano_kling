name: Apply browser auth wiring

on:
  push:
    branches:
      - feat/browser-telegram-auth-loader
    paths:
      - scripts/apply_browser_auth_wiring.py
      - .github/workflows/apply-browser-auth-wiring.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply wiring patch
        run: python3 scripts/apply_browser_auth_wiring.py

      - name: Validate Python syntax
        run: |
          python3 -m py_compile bot/browser_auth.py
          python3 -m py_compile bot/main.py

      - name: Commit generated wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/main.py
          git commit -m "feat: register browser Telegram auth route"
          git push origin HEAD:feat/browser-telegram-auth-loader
