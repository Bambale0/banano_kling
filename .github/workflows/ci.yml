name: CI — Tanya TG Bot

on:
  push:
    branches: [tanyapi, main]
  pull_request:
    branches: [tanyapi, main]

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN || 'test:fake-bot-token-for-ci' }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet ruff pytest
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Lint complete FreeKassa integration with ruff
        id: ruff
        continue-on-error: true
        run: |
          files=(
            bot/config.py
            bot/internal_api.py
            bot/handlers/__init__.py
            bot/handlers/freekassa_payments.py
            bot/services/freekassa_service.py
            bot/services/yookassa_service.py
            scripts/poll_freekassa_pending.py
            tests/test_config.py
            tests/standalone/test_freekassa_service.py
          )
          printf 'Linting FreeKassa files:\n%s\n' "${files[*]}" | tee ruff-output.txt
          set -o pipefail
          ruff check "${files[@]}" \
            --ignore=E402,F403,F405,E501 \
            --output-format=concise 2>&1 | tee -a ruff-output.txt

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: ruff-output.txt
          if-no-files-found: ignore

      - name: Fail when Ruff failed
        if: steps.ruff.outcome == 'failure'
        run: exit 1

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Run blocking internal and payment regression tests
        run: |
          pytest \
            tests/test_internal_admin_api.py \
            tests/test_internal_admin_support_cms.py \
            tests/test_internal_admin_notifications.py \
            tests/test_notification_worker.py \
            tests/test_webhook_handler.py \
            tests/test_config.py \
            tests/standalone/test_freekassa_service.py \
            -v \
            --tb=short \
            -x

      - name: Run legacy safe suite diagnostics
        id: legacy_suite
        continue-on-error: true
        run: |
          set -o pipefail
          pytest tests/ \
            --ignore=tests/live \
            --ignore=tests/standalone \
            -m "not live_smoke" \
            -v \
            --tb=short \
            -x | tee legacy-pytest-output.txt

      - name: Upload legacy pytest diagnostics
        if: steps.legacy_suite.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-pytest-output
          path: legacy-pytest-output.txt
          if-no-files-found: ignore

  test-live:
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Run live smoke tests
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LAVA_SECRET_KEY: ${{ secrets.LAVA_SECRET_KEY }}
          LAVA_WEBHOOK_SECRET: ${{ secrets.LAVA_WEBHOOK_SECRET }}
          FREEKASSA_MERCHANT_ID: ${{ secrets.FREEKASSA_MERCHANT_ID }}
          FREEKASSA_SECRET_WORD: ${{ secrets.FREEKASSA_SECRET_WORD }}
          FREEKASSA_SECRET_WORD_2: ${{ secrets.FREEKASSA_SECRET_WORD_2 }}
          FREEKASSA_API_KEY: ${{ secrets.FREEKASSA_API_KEY }}
          WEBHOOK_HOST: ${{ secrets.WEBHOST_HOST }}
        run: |
          pytest tests/live/ -v --tb=short -x
