name: CI — Tanya TG Bot

on:
  push:
    branches: [tanyapi, main]
  pull_request:
    branches: [tanyapi, main]

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN || 'test:fake-bot-token-for-ci' }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet ruff pytest
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Lint changed Python files with ruff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          HEAD_SHA="${PR_HEAD_SHA:-$CURRENT_SHA}"

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
              'bot/*.py' 'bot/**/*.py' 'tests/*.py' 'tests/**/*.py'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed Python files to lint"
            exit 0
          fi

          printf 'Linting changed files:\n%s\n' "${changed_files[*]}"
          ruff check "${changed_files[@]}" \
            --ignore=E402,F403,F405,E501 \
            --output-format=github

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Run blocking internal and payment regression tests
        run: |
          pytest \
            tests/test_internal_admin_api.py \
            tests/test_internal_admin_support_cms.py \
            tests/test_internal_admin_notifications.py \
            tests/test_notification_worker.py \
            tests/test_webhook_handler.py \
            tests/test_config.py \
            tests/standalone/test_freekassa_service.py \
            tests/standalone/test_lava_checkout.py \
            -v \
            --tb=short \
            -x

      - name: Run legacy safe suite diagnostics
        id: legacy_suite
        continue-on-error: true
        run: |
          set -o pipefail
          pytest tests/ \
            --ignore=tests/live \
            --ignore=tests/standalone \
            -m "not live_smoke" \
            -v \
            --tb=short \
            -x | tee legacy-pytest-output.txt

      - name: Upload legacy pytest diagnostics
        if: steps.legacy_suite.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-pytest-output
          path: legacy-pytest-output.txt
          if-no-files-found: ignore

  test-live:
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Run live smoke tests
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LAVA_SECRET_KEY: ${{ secrets.LAVA_SECRET_KEY }}
          LAVA_WEBHOOK_SECRET: ${{ secrets.LAVA_WEBHOOK_SECRET }}
          FREEKASSA_MERCHANT_ID: ${{ secrets.FREEKASSA_MERCHANT_ID }}
          FREEKASSA_SECRET_WORD: ${{ secrets.FREEKASSA_SECRET_WORD }}
          FREEKASSA_SECRET_WORD_2: ${{ secrets.FREEKASSA_SECRET_WORD_2 }}
          FREEKASSA_API_KEY: ${{ secrets.FREEKASSA_API_KEY }}
          WEBHOOK_HOST: ${{ secrets.WEBHOST_HOST }}
        run: |
          pytest tests/live/ -v --tb=short -x
