name: CI — Tanya TG Bot

on:
  push:
    branches: [tanyapi]
  pull_request:
    branches: [tanyapi]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN || '123456:TEST_TOKEN_FOR_CI_ONLY' }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint:
    name: GitHub runner — Python and deployment validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet ruff pytest
          pip install --quiet -r requirements.txt
          python -m pip check

      - name: Validate deployment shell scripts
        id: shell_validation
        run: |
          bash -n scripts/deploy_backend_docker.sh
          bash -n scripts/backup_db.sh
          bash -n cdn.sh

      - name: Lint changed Python files with Ruff
        id: ruff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          HEAD_SHA="${PR_HEAD_SHA:-$CURRENT_SHA}"

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
              'bot/*.py' 'bot/**/*.py' 'scripts/*.py' 'scripts/**/*.py' \
              'tests/*.py' 'tests/**/*.py'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed Python files to lint"
            exit 0
          fi

          printf 'Linting changed files:\n%s\n' "${changed_files[*]}"
          set +e
          python scripts/ruff_changed_lines.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            "${changed_files[@]}" 2>&1 | tee ruff-output.txt
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ruff-output-github
          path: ruff-output.txt
          if-no-files-found: ignore

      - name: Record GitHub lint result
        id: result
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP: ${{ steps.setup_python.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          SHELL_VALIDATION: ${{ steps.shell_validation.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
        run: |
          if [ "$CHECKOUT" = success ] \
            && [ "$SETUP" = success ] \
            && [ "$DEPENDENCIES" = success ] \
            && [ "$SHELL_VALIDATION" = success ] \
            && [ "$RUFF" = success ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: GitHub runner — Safe regression suite
    runs-on: ubuntu-24.04
    needs: lint
    if: >-
      ${{ always() && needs.lint.outputs.passed == 'true' }}
    timeout-minutes: 45
    outputs:
      passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio pytest-mock
          pip install --quiet -r requirements.txt
          python -m pip check

      - name: Run full safe regression suite
        id: full_suite
        run: |
          set -o pipefail
          pytest tests/ \
            --ignore=tests/live \
            -m "not live_smoke" \
            -v \
            --tb=short | tee full-pytest-output.txt

      - name: Upload full pytest diagnostics
        if: steps.full_suite.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: full-pytest-output-github
          path: full-pytest-output.txt
          if-no-files-found: ignore

      - name: Record GitHub test result
        id: result
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP: ${{ steps.setup_python.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          TESTS: ${{ steps.full_suite.outcome }}
        run: |
          if [ "$CHECKOUT" = success ] \
            && [ "$SETUP" = success ] \
            && [ "$DEPENDENCIES" = success ] \
            && [ "$TESTS" = success ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  docker_image:
    name: GitHub runner — Production Docker image
    runs-on: ubuntu-24.04
    needs: [lint, test]
    if: >-
      ${{
        always() &&
        needs.lint.outputs.passed == 'true' &&
        needs.test.outputs.passed == 'true'
      }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA:0:12}"
          echo "local=banano-kling-ci:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${owner}/banano-kling-bot" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with GitHub Actions cache
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.local }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image filesystem and Python imports
        id: verify
        env:
          LOCAL_IMAGE: ${{ steps.image.outputs.local }}
        run: |
          docker run --rm --entrypoint python "$LOCAL_IMAGE" \
            -m compileall -q /app/bot /app/scripts

          docker run --rm \
            -e BOT_TOKEN='123456:TEST_TOKEN_FOR_CI_ONLY' \
            -e BANANO_SKIP_PROJECT_ENV=1 \
            -e BANANO_LOG_TO_STDOUT=1 \
            --entrypoint python "$LOCAL_IMAGE" \
            -c 'import bot.config, bot.database, bot.main, bot.miniapp; print("container imports: ok")'

          docker run --rm --entrypoint ffmpeg "$LOCAL_IMAGE" -version >/dev/null
          docker run --rm --entrypoint pg_dump "$LOCAL_IMAGE" --version >/dev/null
          docker run --rm --entrypoint sqlite3 "$LOCAL_IMAGE" --version >/dev/null

      - name: Validate production Compose configuration
        id: compose
        env:
          LOCAL_IMAGE: ${{ steps.image.outputs.local }}
        run: |
          trap 'rm -f .env .env.postgres' EXIT
          cat > .env <<'ENV'
          BOT_TOKEN=123456:TEST_TOKEN_FOR_CI_ONLY
          WEBHOOK_HOST=https://example.invalid
          WEBHOOK_PORT=1888
          DATABASE_URL=sqlite:////app/data/ci.db
          REDIS_URL=redis://127.0.0.1:6379/0
          ENV
          : > .env.postgres
          BANANO_IMAGE="$LOCAL_IMAGE" docker compose -f compose.backend.yml config --quiet

      - name: Log in to GitHub Container Registry
        id: registry_login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        id: publish
        if: github.event_name == 'push'
        env:
          LOCAL_IMAGE: ${{ steps.image.outputs.local }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE_REPOSITORY:$SHA_TAG"
          docker push "$IMAGE_REPOSITORY:$SHA_TAG"

          docker tag "$LOCAL_IMAGE" "$IMAGE_REPOSITORY:$REF_NAME"
          docker push "$IMAGE_REPOSITORY:$REF_NAME"

          if [ "$REF_NAME" = "tanyapi" ]; then
            docker tag "$LOCAL_IMAGE" "$IMAGE_REPOSITORY:latest"
            docker push "$IMAGE_REPOSITORY:latest"
          fi

      - name: Record GitHub Docker result
        id: result
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          IMAGE: ${{ steps.image.outcome }}
          BUILDX: ${{ steps.buildx.outcome }}
          BUILD: ${{ steps.build.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          LOGIN: ${{ steps.registry_login.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          publish_ok=true
          if [ "$EVENT_NAME" = push ]; then
            [ "$LOGIN" = success ] && [ "$PUBLISH" = success ] || publish_ok=false
          fi

          if [ "$CHECKOUT" = success ] \
            && [ "$IMAGE" = success ] \
            && [ "$BUILDX" = success ] \
            && [ "$BUILD" = success ] \
            && [ "$VERIFY" = success ] \
            && [ "$COMPOSE" = success ] \
            && [ "$publish_ok" = true ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
