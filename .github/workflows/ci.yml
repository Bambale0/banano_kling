name: CI — Tanya TG Bot

on:
  push:
    branches: [tanyapi, main]
  pull_request:
    branches: [tanyapi, main]

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN || 'test:fake-bot-token-for-ci' }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with ruff
        run: ruff check bot/ tests/ --ignore=E402,F403,F405,E501 --output-format=github

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests (smoke + safe)
        run: |
          pytest tests/ \
            --ignore=tests/live \
            --ignore=tests/standalone \
            -m "not live_smoke" \
            -v \
            --tb=short \
            -x

  test-live:
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run live smoke tests
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LAVA_SECRET_KEY: ${{ secrets.LAVA_SECRET_KEY }}
          LAVA_WEBHOOK_SECRET: ${{ secrets.LAVA_WEBHOOK_SECRET }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          WEBHOOK_HOST: ${{ secrets.WEBHOST_HOST }}
        run: |
          pytest tests/live/ -v --tb=short -x
