name: Validate idempotent refund PR

on:
  pull_request:
    branches:
      - ci/idempotent-refund-validation-base

permissions:
  contents: read

concurrency:
  group: validate-idempotent-refund-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'ci/validate-idempotent-refund-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BOT_TOKEN: 123456:TEST_TOKEN_FOR_CI_ONLY
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare focused source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot/miniapp.py')
          text = path.read_text(encoding='utf-8')

          top_import = (
              'from bot.services.generation_refund_service import '
              'refund_generation_credits_once\n'
          )
          if text.count(top_import) != 1:
              raise SystemExit(
                  f'Expected one top-level refund import, got {text.count(top_import)}'
              )
          text = text.replace(top_import, '', 1)

          direct_call = 'await refund_generation_credits_once('
          if text.count(direct_call) != 5:
              raise SystemExit(
                  f'Expected five direct refund calls, got {text.count(direct_call)}'
              )
          text = text.replace(
              direct_call,
              'await _refund_miniapp_generation_cost_once(',
          )

          helper = '''

async def _refund_miniapp_generation_cost_once(
    telegram_id: int,
    amount: float,
    *,
    refund_key: str,
    reason: str,
) -> bool:
    from bot.services.generation_refund_service import (  # noqa: PLC0415
        refund_generation_credits_once,
    )

    return await refund_generation_credits_once(
        telegram_id,
        amount,
        refund_key=refund_key,
        reason=reason,
    )
'''
          marker = '\nVIDEO_MODELS = ('
          if text.count(marker) != 1:
              raise SystemExit(
                  f'Expected one VIDEO_MODELS marker, got {text.count(marker)}'
              )
          if 'async def _refund_miniapp_generation_cost_once(' in text:
              raise SystemExit('Refund helper already exists')
          text = text.replace(marker, helper + marker, 1)

          old_exception = '''    except Exception as e:
        logger.exception(f"Mini App Motion Control failed: {e}")
        if motion_debit_succeeded:
            if not motion_launch_accepted:
                try:
                    await _refund_miniapp_generation_cost_once(
                        telegram_id,
                        cost,
                        refund_key=motion_refund_key,
                        reason="motion_exception_before_provider_acceptance",
                    )
                except Exception:
                    logger.exception(
                        "Mini App Motion Control refund failed: key=%s",
                        motion_refund_key,
                    )
        return _miniapp_error_response(e, log_message="Mini App Motion Control generation failed")
'''
          new_exception = '''    except Exception as e:
        logger.exception(f"Mini App Motion Control failed: {e}")
        if motion_debit_succeeded and not motion_launch_accepted:
            try:
                await _refund_miniapp_generation_cost_once(
                    telegram_id,
                    cost,
                    refund_key=motion_refund_key,
                    reason="motion_exception_before_provider_acceptance",
                )
            except Exception:
                logger.exception(
                    "Mini App Motion Control refund failed: key=%s",
                    motion_refund_key,
                )
        return _miniapp_error_response(e, log_message="Mini App Motion Control generation failed")
'''
          if text.count(old_exception) != 1:
              raise SystemExit(
                  f'Expected one nested Motion exception, got {text.count(old_exception)}'
              )
          path.write_text(
              text.replace(old_exception, new_exception, 1),
              encoding='utf-8',
          )

          test_path = Path('tests/test_generation_refund_service.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_imports = 'import asyncio\nimport ast\n'
          if test_text.count(old_imports) != 1:
              raise SystemExit(
                  f'Expected one test import block, got {test_text.count(old_imports)}'
              )
          test_path.write_text(
              test_text.replace(old_imports, 'import ast\nimport asyncio\n', 1),
              encoding='utf-8',
          )

          for temporary in (
              Path('.github/refund-fix-trigger.txt'),
              Path('.github/workflows/apply-refund-final-pr.yml'),
              Path('.github/workflows/validate-idempotent-refunds.yml'),
          ):
              temporary.unlink(missing_ok=True)
          PY

          python -m py_compile \
            bot/miniapp.py \
            bot/services/generation_refund_service.py \
            tests/test_generation_refund_service.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet ruff pytest pytest-asyncio pytest-mock
          pip install --quiet -r requirements.txt
          python -m pip check

      - name: Run changed-line Ruff gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
              'bot/*.py' 'bot/**/*.py' 'scripts/*.py' 'scripts/**/*.py' \
              'tests/*.py' 'tests/**/*.py'
          )
          python scripts/ruff_changed_lines.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            "${changed_files[@]}"

      - name: Run full safe regression suite
        run: |
          pytest tests/ \
            --ignore=tests/live \
            -m 'not live_smoke' \
            -v \
            --tb=short

      - name: Build production image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            -t banano-kling-refund-validation:${GITHUB_SHA} \
            .

      - name: Verify production image
        run: |
          image="banano-kling-refund-validation:${GITHUB_SHA}"
          docker run --rm --entrypoint python "$image" \
            -m compileall -q /app/bot /app/scripts
          docker run --rm \
            -e BOT_TOKEN='123456:TEST_TOKEN_FOR_CI_ONLY' \
            -e BANANO_SKIP_PROJECT_ENV=1 \
            -e BANANO_LOG_TO_STDOUT=1 \
            --entrypoint python "$image" \
            -c 'import bot.config, bot.database, bot.main, bot.miniapp; print("container imports: ok")'
          docker run --rm --entrypoint ffmpeg "$image" -version >/dev/null
          docker run --rm --entrypoint pg_dump "$image" --version >/dev/null
          docker run --rm --entrypoint sqlite3 "$image" --version >/dev/null

      - name: Validate production Compose
        run: |
          trap 'rm -f .env .env.postgres' EXIT
          cat > .env <<'ENV'
          BOT_TOKEN=123456:TEST_TOKEN_FOR_CI_ONLY
          WEBHOOK_HOST=https://example.invalid
          WEBHOOK_PORT=1888
          DATABASE_URL=sqlite:////app/data/ci.db
          REDIS_URL=redis://127.0.0.1:6379/0
          ENV
          : > .env.postgres
          BANANO_IMAGE="banano-kling-refund-validation:${GITHUB_SHA}" \
            docker compose -f compose.backend.yml config --quiet

      - name: Package prepared files
        run: |
          mkdir -p prepared/bot prepared/tests
          cp bot/miniapp.py prepared/bot/miniapp.py
          cp tests/test_generation_refund_service.py \
            prepared/tests/test_generation_refund_service.py

      - name: Upload prepared files
        uses: actions/upload-artifact@v7
        with:
          name: idempotent-refund-fix
          path: prepared/
          if-no-files-found: error
          retention-days: 1
