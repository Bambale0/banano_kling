name: Apply tanyapi Lava contractId hotfix

on:
  pull_request:
    branches: [tanyapi]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply_tanyapi_lava_contract_id_fix.py
      - .github/workflows/apply-tanyapi-lava-contract-id-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/tanyapi-lava-contract-id
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply deterministic hotfix
        run: python scripts/apply_tanyapi_lava_contract_id_fix.py

      - name: Compile payments handler
        run: python -m py_compile bot/handlers/payments.py

      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

      - name: Run Lava payment reference regression tests
        run: |
          pytest \
            tests/standalone/test_lava_payment_reference.py \
            tests/standalone/test_lava_checkout.py \
            -q --tb=short

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply_tanyapi_lava_contract_id_fix.py
          rm .github/workflows/apply-tanyapi-lava-contract-id-fix.yml
          rm -f HOTFIX_LAVA_CONTRACT_ID.md

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist Lava contractId in legacy payment flow"
          git push origin HEAD:fix/tanyapi-lava-contract-id
