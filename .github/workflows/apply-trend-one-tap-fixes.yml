name: Apply trend one-tap validation fixes

on:
  pull_request:
    branches: [automation/trend-one-tap-codemod]

permissions:
  contents: write

jobs:
  apply_fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch validation findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "bot/database.py",
              "generation_settings: Optional[dict[str, Any]] = None",
              "generation_settings: dict[str, Any] | None = None",
          )
          replace(
              "bot/database.py",
              """def _parse_json_dict(value: Any) -> dict[str, Any]:
              if value in (None, ""):
                  return {}
              if isinstance(value, dict):
                  return value
              try:
                  parsed = json.loads(value)
              except (TypeError, json.JSONDecodeError):
                  return {}
              return parsed if isinstance(parsed, dict) else {}
          """,
              """def _parse_json_dict(value: Any) -> dict[str, Any]:
              if value in (None, ""):
                  return {}
              if isinstance(value, dict):
                  return value
              try:
                  parsed = json.loads(value)
              except (TypeError, json.JSONDecodeError):
                  return {}
              return parsed if isinstance(parsed, dict) else {}


          def _row_optional_value(
              row: db_backend.Row,
              key: str,
              default: Any = None,
          ) -> Any:
              try:
                  return row[key]
              except (KeyError, IndexError):
                  return default
          """,
          )
          replace(
              "bot/database.py",
              """        generation_settings=(
                  _parse_json_dict(row["generation_settings"])
                  if "generation_settings" in row
                  else {}
              ),
          """,
              """        generation_settings=_parse_json_dict(
                  _row_optional_value(row, "generation_settings")
              ),
          """,
          )

          test_path = Path("tests/test_trend_one_tap_contract.py")
          test_text = test_path.read_text(encoding="utf-8")
          if not test_text.startswith("from __future__ import annotations"):
              test_text = "from __future__ import annotations\n\n" + test_text
          if "import sqlite3" not in test_text:
              test_text = test_text.replace(
                  "from pathlib import Path\n",
                  "import sqlite3\nfrom pathlib import Path\n",
                  1,
              )
          if "from bot.database import _row_optional_value" not in test_text:
              test_text = test_text.replace(
                  "from pathlib import Path\n",
                  "from pathlib import Path\n\nfrom bot.database import _row_optional_value\n",
                  1,
              )
          if "def test_sqlite_row_reads_structured_trend_settings" not in test_text:
              test_text += """

          def test_sqlite_row_reads_structured_trend_settings() -> None:
              connection = sqlite3.connect(":memory:")
              connection.row_factory = sqlite3.Row
              try:
                  row = connection.execute(
                      'SELECT ? AS generation_settings',
                      ('{\"ratio\":\"9:16\"}',),
                  ).fetchone()
                  assert row is not None
                  assert _row_optional_value(row, "generation_settings") == '{\"ratio\":\"9:16\"}'
                  assert _row_optional_value(row, "missing") is None
              finally:
                  connection.close()
          """
          test_path.write_text(test_text, encoding="utf-8")

          replace(
              "frontend/miniapp-v0/lib/trend-settings.ts",
              """function finiteNumber(value: unknown): number | null {
            const parsed = Number(value)
            return Number.isFinite(parsed) ? parsed : null
          }
          """,
              """function finiteNumber(value: unknown): number | null {
            if (value === null || value === undefined || value === '') return null
            const parsed = Number(value)
            return Number.isFinite(parsed) ? parsed : null
          }
          """,
          )
          replace(
              "frontend/miniapp-v0/lib/trend-settings.ts",
              """  const model =
            videoModels.find((item) => item.id === stored.model) ||
            videoModels.find((item) => item.id === trend.model) ||
            videoModels.find((item) => item.supports.includes('imgtxt')) ||
            videoModels[0]
          """,
              """  const model =
            videoModels.find(
              (item) => item.id === stored.model && item.supports.includes('imgtxt'),
            ) ||
            videoModels.find(
              (item) => item.id === trend.model && item.supports.includes('imgtxt'),
            ) ||
            videoModels.find((item) => item.supports.includes('imgtxt')) ||
            videoModels[0]
          """,
          )

          replace(
              "frontend/miniapp-v0/components/tabs/trends-tab.tsx",
              "import type { PromptItem, ScenarioType } from '@/lib/types'",
              "import type { PromptItem } from '@/lib/types'",
          )
          replace(
              "frontend/miniapp-v0/components/tabs/trends-tab.tsx",
              "  const [videoScenario, setVideoScenario] = useState<ScenarioType>('imgtxt')\n",
              "",
          )
          replace(
              "frontend/miniapp-v0/components/tabs/trends-tab.tsx",
              """    setVideoScenario((current) => (
              selectedVideoModel.supports.includes(current)
                ? current
                : selectedVideoModel.supports.includes('imgtxt')
                  ? 'imgtxt'
                  : selectedVideoModel.supports[0] || 'text'
            ))
          """,
              "",
          )
          replace(
              "frontend/miniapp-v0/components/tabs/trends-tab.tsx",
              "    setVideoScenario('imgtxt')\n",
              "",
          )
          replace(
              "frontend/miniapp-v0/components/tabs/trends-tab.tsx",
              """  const trendImageQualities =
            selectedTrendImageModel?.id === 'banana_pro' || selectedTrendImageModel?.id === 'banana_2'
              ? ['1K', '2K', '4K']
              : selectedTrendImageModel?.qualities?.length
                ? selectedTrendImageModel.qualities
                : ['basic']
          """,
              """  const trendImageQualities = useMemo(
            () =>
              selectedTrendImageModel?.id === 'banana_pro' || selectedTrendImageModel?.id === 'banana_2'
                ? ['1K', '2K', '4K']
                : selectedTrendImageModel?.qualities?.length
                  ? selectedTrendImageModel.qualities
                  : ['basic'],
            [selectedTrendImageModel],
          )
          """,
          )
          replace(
              "frontend/miniapp-v0/components/trend-runner-dialog.tsx",
              """            onChange={(event) => void handlePhoto(event.target.files?.[0])}
          """,
              """            onChange={(event) => {
              const file = event.currentTarget.files?.[0]
              event.currentTarget.value = ''
              void handlePhoto(file)
            }}
          """,
          )
          PY

      - name: Normalize test imports with Ruff
        run: |
          python -m pip install --quiet ruff
          ruff check --select I --fix tests/test_trend_one_tap_contract.py

      - name: Validate syntax
        run: python -m py_compile bot/database.py bot/miniapp.py tests/test_trend_one_tap_contract.py

      - name: Commit fixes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No fixes needed"
            exit 0
          fi
          git commit -m "Harden one-tap trend settings and upload retry"
          git push origin "HEAD:${HEAD_BRANCH}"
