name: Temporary Ruff Photo Prompt Autofix

on:
  pull_request:
    branches: [tanyapi]

permissions:
  contents: read

jobs:
  autofix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Apply safe Ruff fixes
        run: |
          ruff check --fix \
            bot/services/photo_prompt_vk_compat.py \
            tests/test_photo_prompt_exact_vk_contract.py \
            --ignore=E402,F403,F405,E501
      - name: Upload corrected files
        uses: actions/upload-artifact@v4
        with:
          name: corrected-photo-prompt-files
          path: |
            bot/services/photo_prompt_vk_compat.py
            tests/test_photo_prompt_exact_vk_contract.py
