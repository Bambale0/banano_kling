name: Creator Tariff PostgreSQL Regression

on:
  pull_request:
    branches: [tanyapi]

permissions:
  contents: read

concurrency:
  group: creator-tariff-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  creator_tariff_postgres:
    name: PostgreSQL — creator membership, audit and locked refunds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creator_test
          POSTGRES_PASSWORD: creator_test
          POSTGRES_DB: banano_creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator_test -d banano_creator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BANANO_SKIP_PROJECT_ENV: '1'
      BANANO_DISABLE_FILE_LOGGING: '1'
      BOT_TOKEN: '123456:TEST_TOKEN_FOR_CI_ONLY'
      PYTHONPATH: ${{ github.workspace }}
      CREATOR_POSTGRES_TEST: '1'
      CREATOR_POSTGRES_TEST_DSN: postgresql://creator_test:creator_test@127.0.0.1:5432/banano_creator_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pytest pytest-asyncio ruff
          python -m pip check
      - name: Verify fixture safety and changed test syntax
        run: |
          python -m py_compile tests/test_creator_tariff_postgres.py tests/test_creator_tariff_postgres_safety.py
          python -m ruff check tests/test_creator_tariff_postgres.py tests/test_creator_tariff_postgres_safety.py
          python -m pytest tests/test_creator_tariff_postgres_safety.py -q --tb=short
      - name: Run isolated PostgreSQL creator regressions
        run: python -m pytest tests/test_creator_tariff_postgres.py -vv --tb=short
