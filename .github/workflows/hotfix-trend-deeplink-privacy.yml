name: Hotfix trend deeplink privacy

on:
  push:
    branches: [tanyapi]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tanyapi
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Apply trend privacy fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def patch_function(text: str, name: str, old: str, new: str) -> str:
              marker = f'async def {name}('
              start = text.index(marker)
              next_async = text.find('\n\nasync def ', start + len(marker))
              next_def = text.find('\n\ndef ', start + len(marker))
              candidates = [pos for pos in (next_async, next_def) if pos != -1]
              end = min(candidates) if candidates else len(text)
              segment = text[start:end]
              segment = replace_once(segment, old, new, name)
              return text[:start] + segment + text[end:]

          visibility = '''from __future__ import annotations

from collections.abc import Mapping
from typing import Any


def is_trend_prompt(prompt: Mapping[str, Any] | None) -> bool:
    if not prompt:
        return False
    return any(
        str(tag or "").strip().lower() == "trend"
        for tag in list(prompt.get("tags") or [])
    )


def _same_user(author_id: Any, viewer_user_id: int) -> bool:
    try:
        return int(author_id) == int(viewer_user_id)
    except (TypeError, ValueError):
        return False


def _public_trend_settings(prompt: Mapping[str, Any]) -> dict[str, str]:
    raw_settings = prompt.get("generation_settings")
    settings = raw_settings if isinstance(raw_settings, Mapping) else {}
    tags = {
        str(tag or "").strip().lower()
        for tag in list(prompt.get("tags") or [])
        if str(tag or "").strip()
    }

    kind = str(settings.get("kind") or "").strip().lower()
    if kind not in {"image", "video"}:
        kind = (
            "video"
            if str(prompt.get("category") or "").strip().lower() == "video"
            or "trend-video" in tags
            else "image"
        )

    ratio = str(settings.get("ratio") or "").strip()
    if not ratio:
        ratio = "16:9" if kind == "video" else "1:1"

    return {"kind": kind, "ratio": ratio}


def sanitize_prompt_for_viewer(
    prompt: Mapping[str, Any] | None,
    *,
    viewer_user_id: int,
    viewer_is_admin: bool,
) -> dict[str, Any] | None:
    """Hide executable trend recipe from ordinary Mini App viewers.

    Public trend cards need only metadata plus kind/ratio for their preview and
    runner. Prompt text, provider/model choice and all remaining generation
    settings stay server-side and are loaded by /api/trends/run from the DB.
    """

    if prompt is None:
        return None

    payload = dict(prompt)
    if not is_trend_prompt(payload):
        return payload
    if viewer_is_admin or _same_user(payload.get("author_id"), viewer_user_id):
        return payload

    payload["prompt_text"] = ""
    payload["model"] = None
    payload["generation_settings"] = _public_trend_settings(payload)
    payload["prompt_hidden"] = True
    payload["prompt_actions_allowed"] = False
    return payload
'''
