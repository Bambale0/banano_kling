          backend_test = '''from pathlib import Path

from bot.trend_visibility import sanitize_prompt_for_viewer


def _trend() -> dict:
    return {
        "id": 1126,
        "author_id": 10,
        "title": "Закрытый тренд",
        "description": "Публичное описание",
        "category": "video",
        "tags": ["trend", "trend-video"],
        "preview_url": "/uploads/trend.mp4",
        "prompt_text": "SECRET PROMPT",
        "model": "seedance_2",
        "generation_settings": {
            "kind": "video",
            "user_input": "photo",
            "model": "seedance_2",
            "ratio": "9:16",
            "duration": 10,
            "quality": "4K",
            "kling_negative_prompt": "SECRET NEGATIVE",
        },
    }


def test_public_viewer_gets_only_safe_trend_metadata() -> None:
    payload = sanitize_prompt_for_viewer(
        _trend(), viewer_user_id=99, viewer_is_admin=False
    )
    assert payload is not None
    assert payload["prompt_text"] == ""
    assert payload["model"] is None
    assert payload["generation_settings"] == {"kind": "video", "ratio": "9:16"}
    assert payload["prompt_hidden"] is True
    assert payload["prompt_actions_allowed"] is False
    assert payload["title"] == "Закрытый тренд"
    assert payload["preview_url"] == "/uploads/trend.mp4"
    assert payload["tags"] == ["trend", "trend-video"]


def test_admin_and_author_keep_full_trend_recipe() -> None:
    trend = _trend()
    admin = sanitize_prompt_for_viewer(
        trend, viewer_user_id=99, viewer_is_admin=True
    )
    author = sanitize_prompt_for_viewer(
        trend, viewer_user_id=10, viewer_is_admin=False
    )
    assert admin is not None and admin["prompt_text"] == "SECRET PROMPT"
    assert author is not None and author["prompt_text"] == "SECRET PROMPT"
    assert admin["generation_settings"]["duration"] == 10
    assert author["generation_settings"]["model"] == "seedance_2"


def test_regular_prompt_is_not_redacted() -> None:
    prompt = {
        "id": 5,
        "author_id": 10,
        "tags": ["portrait"],
        "prompt_text": "visible prompt",
        "model": "banana_pro",
        "generation_settings": {},
    }
    payload = sanitize_prompt_for_viewer(
        prompt, viewer_user_id=99, viewer_is_admin=False
    )
    assert payload == prompt


def test_legacy_trend_still_exposes_only_preview_kind_and_ratio() -> None:
    trend = _trend()
    trend["generation_settings"] = {}
    payload = sanitize_prompt_for_viewer(
        trend, viewer_user_id=99, viewer_is_admin=False
    )
    assert payload is not None
    assert payload["generation_settings"] == {"kind": "video", "ratio": "16:9"}


def test_all_public_prompt_endpoints_apply_viewer_sanitizer() -> None:
