          python - <<'PY'
          from pathlib import Path
          source = Path('frontend/miniapp-v0/lib/app-context.tsx').read_text(encoding='utf-8')
          start = source.index("if (startTarget.kind === 'prompt')")
          trend = source.index('if (isTrend)', start)
          video = source.index('if (isVideoTrend)', start)
          if not start < trend < video:
              raise SystemExit('trend deeplink still routes through generic video flow')
          miniapp = Path('bot/miniapp.py').read_text(encoding='utf-8')
          if miniapp.count('sanitize_prompt_for_viewer(') < 5:
              raise SystemExit('not all public prompt endpoints sanitize trend secrets')
