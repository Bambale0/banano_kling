name: Preview refund Ruff fixes

on:
  pull_request:
    branches:
      - agent/tanyapi-atomic-generation-debit

permissions:
  contents: read

jobs:
  preview:
    if: github.head_ref == 'agent/tanyapi-idempotent-generation-refunds'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet ruff
      - run: |
          ruff check \
            bot/miniapp.py \
            tests/test_generation_refund_service.py \
            --fix --diff
