name: CI — Tanya Mini App

on:
  pull_request:
    branches: [tanyapi]
    paths:
      - frontend/miniapp-v0/**
      - .github/workflows/miniapp-ci.yml
  push:
    branches: [tanyapi]
    paths:
      - frontend/miniapp-v0/**
      - .github/workflows/miniapp-ci.yml

permissions:
  contents: read

concurrency:
  group: miniapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: GitHub runner — Trend contract and Mini App build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend/miniapp-v0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server-authoritative trend contract tests
        run: npm test -- --runInBand lib/__tests__/trend-api.test.ts

      - name: Build static Mini App
        run: npm run build
