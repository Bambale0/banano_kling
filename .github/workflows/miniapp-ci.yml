name: CI — Tanya Mini App

on:
  pull_request:
    branches: [tanyapi]
    paths:
      - frontend/miniapp-v0/**
      - bot/miniapp.py
      - bot/trend_api.py
      - bot/handlers/miniapp_video_continuity_compat.py
      - bot/handlers/trend_route_compat.py
      - bot/handlers/trend_seedance_25_compat.py
      - tests/test_development_release_flow.py
      - .github/workflows/miniapp-ci.yml
      - .github/workflows/deploy-miniapp-production.yml
  push:
    branches: [tanyapi]
    paths:
      - frontend/miniapp-v0/**
      - bot/miniapp.py
      - bot/trend_api.py
      - bot/handlers/miniapp_video_continuity_compat.py
      - bot/handlers/trend_route_compat.py
      - bot/handlers/trend_seedance_25_compat.py
      - tests/test_development_release_flow.py
      - .github/workflows/miniapp-ci.yml
      - .github/workflows/deploy-miniapp-production.yml

permissions:
  contents: read

concurrency:
  group: miniapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: GitHub runner — Mini App tests and static build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend/miniapp-v0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Telegram and VK export profiles
        run: node --test scripts/check-build-profile.mjs scripts/check-vk-init-handshake.mjs

      - name: Run Mini App regression tests
        run: >-
          npm test -- --runInBand
          components/__tests__/account-platform-entry.test.tsx
          components/__tests__/shared-account-link-preview.test.tsx
          components/__tests__/shared-account-preview.test.tsx
          components/__tests__/vk-chat-delivery.test.tsx
          lib/__tests__/vk-chat-delivery-api.test.ts
          lib/__tests__/vk-message-permission.test.ts
          components/__tests__/shared-account-auth-recovery.test.tsx
          components/forms/image-reference-selection.test.tsx
          components/personal-reference-library.test.tsx
          lib/__tests__/shared-account-api.test.ts
          components/__tests__/task-detail-publication-references.test.tsx
          __tests__/wan3-manual-trend.test.tsx
          components/__tests__/balance-sheet-payment.test.tsx
          components/generation-funding-offer.test.tsx
          components/__tests__/trend-runner-user-fields.test.tsx
          components/forms/video-generator-form-topup.test.tsx
          lib/contextual-topup.test.ts
          lib/__tests__/trend-api.test.ts
          components/tabs/__tests__/video-tab-repeat.test.tsx
          components/forms/video-generator-form-repeat-pricing.test.tsx
          components/forms/video-generator-form-repeat.test.tsx
          components/forms/wan3-prime-form.test.tsx
          components/forms/repeat-image-choices.test.tsx
          lib/__tests__/personalization-errors.test.ts
          components/forms/image-generator-form-remix.test.tsx
          components/tabs/__tests__/feed-image-remix.test.tsx

      - name: Build static Mini App
        run: npm run build

      - name: Build VK Mini App at domain root
        run: npm run build:vk

      - name: Install Chromium for VK root smoke
        run: npx playwright install --with-deps chromium

      - name: Check VK root entry and administrator surface
        run: node --test scripts/check-vk-root-browser.mjs

      - name: Check VK result chat delivery states
        run: E2E_APP_PATH=/ node e2e/vk-chat-delivery.mjs

