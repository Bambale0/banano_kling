name: Preview atomic debit Ruff fix

on:
  pull_request:
    branches:
      - ci/tanyapi-ruff-changed-lines

permissions:
  contents: read

jobs:
  preview:
    if: github.head_ref == 'agent/tanyapi-atomic-generation-debit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet ruff
      - run: ruff check tests/test_generation_credit_debit_contract.py --fix --diff
