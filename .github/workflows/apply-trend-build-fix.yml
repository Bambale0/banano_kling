name: Apply trend one-tap build fix

on:
  pull_request:
    branches: [automation/trend-one-tap-build-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove stale scenario state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/miniapp-v0/components/tabs/trends-tab.tsx')
          text = path.read_text(encoding='utf-8')
          marker = "  useEffect(() => {\n    if (trendKind !== 'video') return"
          start = text.find(marker)
          if start < 0:
              if 'setVideoScenario' not in text:
                  print('Stale scenario block already removed')
                  raise SystemExit(0)
              raise SystemExit('Could not locate stale scenario effect')

          end_marker = "\n\n  useEffect(() => {"
          end = text.find(end_marker, start + len(marker))
          if end < 0:
              raise SystemExit('Could not locate the next effect boundary')

          replacement = """  useEffect(() => {
            if (trendKind !== 'video' || !selectedTrendVideoModel) return
            setVideoDuration((current) => (
              selectedTrendVideoModel.durations.includes(current)
                ? current
                : selectedTrendVideoModel.durations[0] || 5
            ))
          }, [selectedTrendVideoModel, trendKind])"""
          text = text[:start] + replacement + text[end:]

          if 'setVideoScenario' in text:
              raise SystemExit('Legacy setVideoScenario call remains')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate source invariant
        run: |
          set -Eeuo pipefail
          ! grep -q 'setVideoScenario' frontend/miniapp-v0/components/tabs/trends-tab.tsx
          grep -q "selectedTrendVideoModel.durations.includes" frontend/miniapp-v0/components/tabs/trends-tab.tsx

      - name: Commit build fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/miniapp-v0/components/tabs/trends-tab.tsx
          if git diff --cached --quiet; then
            echo "Build fix already present"
            exit 0
          fi
          git commit -m "Fix one-tap trend frontend build"
          git push origin "HEAD:${HEAD_BRANCH}"
