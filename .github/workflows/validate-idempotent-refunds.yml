name: Validate idempotent refund stack

on:
  pull_request:
    branches:
      - agent/tanyapi-atomic-generation-debit

permissions:
  contents: read

concurrency:
  group: idempotent-refunds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/tanyapi-idempotent-generation-refunds'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BOT_TOKEN: 123456:TEST_TOKEN_FOR_CI_ONLY
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet ruff pytest pytest-asyncio pytest-mock
          pip install --quiet -r requirements.txt
          python -m pip check

      - name: Run changed-line Ruff gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show origin/ci/tanyapi-ruff-changed-lines:scripts/ruff_changed_lines.py \
            > /tmp/ruff_changed_lines.py
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
              'bot/*.py' 'bot/**/*.py' 'scripts/*.py' 'scripts/**/*.py' \
              'tests/*.py' 'tests/**/*.py'
          )
          python /tmp/ruff_changed_lines.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            "${changed_files[@]}"

      - name: Run full safe regression suite
        run: |
          pytest tests/ \
            --ignore=tests/live \
            -m 'not live_smoke' \
            -v \
            --tb=short

      - name: Build production image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            -t banano-kling-refunds:${GITHUB_SHA} \
            .

      - name: Verify production image
        run: |
          image="banano-kling-refunds:${GITHUB_SHA}"
          docker run --rm --entrypoint python "$image" \
            -m compileall -q /app/bot /app/scripts
          docker run --rm \
            -e BOT_TOKEN='123456:TEST_TOKEN_FOR_CI_ONLY' \
            -e BANANO_SKIP_PROJECT_ENV=1 \
            -e BANANO_LOG_TO_STDOUT=1 \
            --entrypoint python "$image" \
            -c 'import bot.config, bot.database, bot.main, bot.miniapp; print("container imports: ok")'
          docker run --rm --entrypoint ffmpeg "$image" -version >/dev/null
          docker run --rm --entrypoint pg_dump "$image" --version >/dev/null
          docker run --rm --entrypoint sqlite3 "$image" --version >/dev/null

      - name: Validate production Compose
        run: |
          trap 'rm -f .env .env.postgres' EXIT
          cat > .env <<'ENV'
          BOT_TOKEN=123456:TEST_TOKEN_FOR_CI_ONLY
          WEBHOOK_HOST=https://example.invalid
          WEBHOOK_PORT=1888
          DATABASE_URL=sqlite:////app/data/ci.db
          REDIS_URL=redis://127.0.0.1:6379/0
          ENV
          : > .env.postgres
          BANANO_IMAGE="banano-kling-refunds:${GITHUB_SHA}" \
            docker compose -f compose.backend.yml config --quiet
