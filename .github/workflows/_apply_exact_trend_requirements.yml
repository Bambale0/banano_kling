name: Apply exact trend reference requirements

on:
  push:
    branches:
      - feat/pinterest-trend-exact
    paths:
      - .github/workflows/_apply_exact_trend_requirements.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pinterest-trend-exact
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Apply focused source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          path = 'bot/trend_api.py'
          source = read(path)
          old = '    if raw_value in (None, "", False):\n        return None\n'
          new = '    if raw_value is None or raw_value == "":\n        return None\n'
          if old not in source:
              raise SystemExit('trend_api exact-count empty-value marker not found')
          write(path, source.replace(old, new, 1))

          path = 'frontend/miniapp-v0/components/tabs/trends-tab.tsx'
          source = read(path)

          old = "  const [imageQuality, setImageQuality] = useState('2K')\n  const [previewUrl, setPreviewUrl] = useState('')\n"
          new = "  const [imageQuality, setImageQuality] = useState('2K')\n  const [requiredReferenceCount, setRequiredReferenceCount] = useState(1)\n  const [referenceHint, setReferenceHint] = useState('')\n  const [previewUrl, setPreviewUrl] = useState('')\n"
          if old not in source:
              raise SystemExit('trend admin state marker not found')
          source = source.replace(old, new, 1)

          old = "        : ['basic']\n\n  const videoModelIds = useMemo(\n"
          new = "        : ['basic']\n  const maxTrendReferences = trendKind === 'video'\n    ? Math.max(1, (selectedTrendVideoModel?.max_image_references ?? 0) + 1)\n    : Math.max(1, selectedTrendImageModel?.max_references ?? 1)\n\n  const videoModelIds = useMemo(\n"
          if old not in source:
              raise SystemExit('trend reference max marker not found')
          source = source.replace(old, new, 1)

          marker = "  const changeTrendKind = (nextKind: TrendKind) => {\n"
          clamp = "  useEffect(() => {\n    setRequiredReferenceCount((current) =>\n      Math.min(maxTrendReferences, Math.max(1, current)),\n    )\n  }, [maxTrendReferences])\n\n"
          if marker not in source:
              raise SystemExit('trend count clamp insertion marker not found')
          source = source.replace(marker, clamp + marker, 1)

          old = "    setImageQuality('2K')\n    setPreviewUrl('')\n"
          new = "    setImageQuality('2K')\n    setRequiredReferenceCount(1)\n    setReferenceHint('')\n    setPreviewUrl('')\n"
          if old not in source:
              raise SystemExit('trend reset marker not found')
          source = source.replace(old, new, 1)

          old = "            ratio: trendRatio,\n"
          new = "            ratio: trendRatio,\n            required_reference_count: requiredReferenceCount,\n            reference_hint: referenceHint.trim(),\n"
          if source.count(old) < 2:
              raise SystemExit('expected two generation ratio markers')
          source = source.replace(old, new, 2)

          old = '''          <Textarea
            value={description}
            onChange={(event) => setDescription(event.target.value)}
            placeholder={
              trendKind === 'video'
                ? 'Что получится и какие исходники нужны'
                : 'Что получится и какое фото лучше загрузить'
            }
            className="min-h-[76px] resize-none bg-secondary/50"
            maxLength={240}
          />

          <label className="block space-y-2">'''
          new = '''          <Textarea
            value={description}
            onChange={(event) => setDescription(event.target.value)}
            placeholder={
              trendKind === 'video'
                ? 'Что получится и какие исходники нужны'
                : 'Что получится и какое фото лучше загрузить'
            }
            className="min-h-[76px] resize-none bg-secondary/50"
            maxLength={240}
          />

          <div className="grid gap-3 sm:grid-cols-[160px_1fr]">
            <label className="block space-y-2">
              <span className="text-xs font-medium text-muted-foreground">
                Сколько фото нужно
              </span>
              <select
                value={requiredReferenceCount}
                onChange={(event) => setRequiredReferenceCount(Number(event.target.value))}
                className="h-11 w-full rounded-xl border border-border/50 bg-secondary/70 px-3 text-sm text-foreground outline-none focus:border-gold/50"
              >
                {Array.from({ length: maxTrendReferences }, (_, index) => index + 1).map((count) => (
                  <option key={count} value={count}>{count}</option>
                ))}
              </select>
            </label>
            <label className="block space-y-2">
              <span className="text-xs font-medium text-muted-foreground">
                Порядок фото для пользователя
              </span>
              <input
                value={referenceHint}
                onChange={(event) => setReferenceHint(event.target.value)}
                placeholder="Например: Фото 1 — референс Pinterest, Фото 2 — ваше фото"
                maxLength={240}
                className="h-11 w-full rounded-xl border border-border/50 bg-secondary/50 px-3 text-sm outline-none focus:border-gold/50"
              />
            </label>
          </div>

          <label className="block space-y-2">'''
          if old not in source:
              raise SystemExit('trend admin reference UI marker not found')
          source = source.replace(old, new, 1)
          write(path, source)

          test_path = Path('tests/test_trend_exact_reference_ui_contract.py')
          test_path.write_text(r'''from pathlib import Path


def _read(path: str) -> str:
    return Path(path).read_text(encoding="utf-8")


def test_admin_can_save_exact_reference_count_and_order_hint():
    source = _read("frontend/miniapp-v0/components/tabs/trends-tab.tsx")
    assert "requiredReferenceCount" in source
    assert "required_reference_count: requiredReferenceCount" in source
    assert "reference_hint: referenceHint.trim()" in source
    assert "Сколько фото нужно" in source
    assert "Порядок фото для пользователя" in source


def test_runner_requires_complete_exact_reference_set_before_generate():
    source = _read("frontend/miniapp-v0/components/trend-runner-dialog.tsx")
    assert "required_reference_count" in source
    assert "uploadedReferences.length === exactReferenceCount" in source
    assert "disabled={busy || !hasEnoughReferences}" in source
    assert "removeReference" in source


def test_backend_enforces_exact_reference_count():
    source = _read("bot/trend_api.py")
    assert "_required_reference_count" in source
    assert "len(reference_urls) != required_count" in source
    assert "ровно {required_count} фото" in source
''', encoding='utf-8')
          PY

      - name: Verify backend exact-count behavior
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          pytest -q tests/test_trend_api.py tests/test_trend_exact_reference_ui_contract.py

      - name: Verify Mini App production build
        working-directory: frontend/miniapp-v0
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          rm .github/workflows/_apply_exact_trend_requirements.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: configure exact trend reference requirements'
          git push origin HEAD:feat/pinterest-trend-exact
