name: Cleanup trend one-tap helper

on:
  pull_request:
    branches: [automation/trend-one-tap-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove duplicate helper definition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot/database.py')
          text = path.read_text(encoding='utf-8')
          block = '''def _row_optional_value(
              row: db_backend.Row,
              key: str,
              default: Any = None,
          ) -> Any:
              try:
                  return row[key]
              except (KeyError, IndexError):
                  return default
          '''
          while text.count(block) > 1:
              text = text.replace(block + '\n\n' + block, block, 1)
          if text.count(block) != 1:
              raise SystemExit(f'Expected exactly one helper, found {text.count(block)}')
          if '_row_optional_value(row, "generation_settings")' not in text:
              raise SystemExit('Structured trend settings are not using safe row access')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate cleanup
        run: |
          python -m py_compile bot/database.py
          python -m pip install --quiet ruff
          ruff check --select F811 bot/database.py

      - name: Commit cleanup
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/database.py
          if git diff --cached --quiet; then
            echo "Cleanup already applied"
            exit 0
          fi
          git commit -m "Remove duplicate trend settings helper"
          git push origin "HEAD:${HEAD_BRANCH}"
