name: Cleanup trend one-tap helper

on:
  pull_request:
    branches: [automation/trend-one-tap-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Repair helper and structured row access
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('bot/database.py')
          text = path.read_text(encoding='utf-8')
          block = '''def _row_optional_value(
              row: db_backend.Row,
              key: str,
              default: Any = None,
          ) -> Any:
              try:
                  return row[key]
              except (KeyError, IndexError):
                  return default
          '''
          while text.count(block) > 1:
              text = text.replace(block + '\n\n' + block, block, 1)

          pattern = re.compile(
              r'(?m)^\s{8}generation_settings=\(\n'
              r'\s+_parse_json_dict\(row\["generation_settings"\]\)\n'
              r'\s+if "generation_settings" in row\n'
              r'\s+else \{\}\n'
              r'\s+\),'
          )
          replacement = (
              '        generation_settings=_parse_json_dict(\n'
              '            _row_optional_value(row, "generation_settings")\n'
              '        ),'
          )
          text, replacements = pattern.subn(replacement, text, count=1)
          if replacements not in (0, 1):
              raise SystemExit(f'Unexpected row-access replacements: {replacements}')

          definitions = text.count('def _row_optional_value(')
          usages = text.count('_row_optional_value(') - definitions
          if definitions != 1:
              raise SystemExit(f'Expected exactly one helper definition, found {definitions}')
          if usages < 1:
              raise SystemExit('Structured trend settings are not using safe row access')
          if 'if "generation_settings" in row' in text:
              raise SystemExit('Unsafe aiosqlite.Row membership check remains')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate cleanup
        run: |
          python -m py_compile bot/database.py
          python -m pip install --quiet ruff
          ruff check --select F811 bot/database.py

      - name: Commit cleanup
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/database.py
          if git diff --cached --quiet; then
            echo "Cleanup already applied"
            exit 0
          fi
          git commit -m "Repair trend settings row access"
          git push origin "HEAD:${HEAD_BRANCH}"
