name: Runtime PostgreSQL Regression

on:
  pull_request:
    branches: [tanyapi]
    paths:
      - 'bot/promo_campaigns.py'
      - 'bot/promo_message.py'
      - 'bot/notification_service.py'
      - 'bot/internal_admin_notification_schema.py'
      - 'tests/test_promo_campaigns_postgres.py'
      - 'bot/database.py'
      - 'bot/db.py'
      - 'bot/postgres_pool.py'
      - 'bot/postgres_aiosqlite.py'
      - 'tests/conftest.py'
      - 'tests/test_runtime72_saved_references.py'
      - 'tests/test_runtime72_postgres_refunds.py'
      - 'tests/test_result_durability_postgres.py'
      - 'tests/runtime72_postgres_fixture.py'
      - 'bot/services/task_watchdog.py'
      - 'tests/test_partner_approval_postgres.py'
      - 'bot/genjutsu/**'
      - 'tests/test_genjutsu_postgres.py'
      - '.github/workflows/runtime-postgres.yml'
  push:
    branches: [tanyapi]
    paths:
      - 'bot/promo_campaigns.py'
      - 'bot/promo_message.py'
      - 'bot/notification_service.py'
      - 'bot/internal_admin_notification_schema.py'
      - 'tests/test_promo_campaigns_postgres.py'
      - 'bot/database.py'
      - 'bot/db.py'
      - 'bot/postgres_pool.py'
      - 'bot/postgres_aiosqlite.py'
      - 'tests/conftest.py'
      - 'tests/test_runtime72_saved_references.py'
      - 'tests/test_runtime72_postgres_refunds.py'
      - 'tests/test_result_durability_postgres.py'
      - 'tests/runtime72_postgres_fixture.py'
      - 'bot/services/task_watchdog.py'
      - 'tests/test_partner_approval_postgres.py'
      - 'bot/genjutsu/**'
      - 'tests/test_genjutsu_postgres.py'
      - '.github/workflows/runtime-postgres.yml'

permissions:
  contents: read

jobs:
  saved_reference_postgres:
    name: PostgreSQL — retention and refund transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banano_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d banano_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: 123456:TEST_TOKEN_FOR_CI_ONLY
      BANANO_SKIP_PROJECT_ENV: '1'
      BANANO_DISABLE_FILE_LOGGING: '1'
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/banano_runtime_test
      PARTNER_POSTGRES_TEST: '1'
      RUNTIME_POSTGRES_TEST: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio
          pip install --quiet -r requirements.txt
          python -m pip check
      - name: Run PostgreSQL regressions
        run: pytest tests/test_runtime72_saved_references.py tests/test_runtime72_postgres_refunds.py tests/test_result_durability_postgres.py tests/test_genjutsu_postgres.py -vv --tb=short

      - name: Create isolated promo test database
        run: |
          python - <<'PYCODE'
          import os
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as connection:
              connection.execute("CREATE DATABASE banano_promo_test")
          PYCODE
      - name: Run promo PostgreSQL acceptance tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/banano_promo_test
          PROMO_POSTGRES_TEST: '1'
        run: pytest tests/test_promo_campaigns_postgres.py -vv --tb=short
