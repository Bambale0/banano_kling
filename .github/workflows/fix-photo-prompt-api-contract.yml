name: Fix photo prompt API contract

on:
  pull_request:
    branches: [automation/photo-prompt-api-contract-fix]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Return authoritative pricing fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/miniapp-v0/lib/api.ts')
          text = path.read_text(encoding='utf-8')
          start = text.find('export async function photoToPrompt(')
          end = text.find('\nexport async function ', start + 1)
          if start < 0 or end < 0:
              raise SystemExit('photoToPrompt function boundaries not found')

          function = text[start:end]
          response_start = function.find('  const response = await postJson<{')
          response_end = function.find("  }>('photo-to-prompt', {", response_start)
          if response_start < 0 or response_end < 0:
              raise SystemExit('photoToPrompt postJson response boundaries not found')
          response_type = function[response_start:response_end]

          if 'credits: number' not in response_type:
              response_anchor = '    model_hint: string\n'
              response_replacement = (
                  '    model_hint: string\n'
                  '    credits: number\n'
                  '    cost_credits: number\n'
                  '    price_rub: number\n'
              )
              if response_anchor not in response_type:
                  raise SystemExit('photoToPrompt response type anchor not found')
              response_type = response_type.replace(response_anchor, response_replacement, 1)
              function = (
                  function[:response_start]
                  + response_type
                  + function[response_end:]
              )

          if 'credits: response.credits' not in function:
              return_anchor = '    model_hint: response.model_hint,\n  }'
              return_replacement = (
                  '    model_hint: response.model_hint,\n'
                  '    credits: response.credits,\n'
                  '    cost_credits: response.cost_credits,\n'
                  '    price_rub: response.price_rub,\n'
                  '  }'
              )
              if return_anchor not in function:
                  raise SystemExit('photoToPrompt return anchor not found')
              function = function.replace(return_anchor, return_replacement, 1)

          text = text[:start] + function + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate frontend contract
        working-directory: frontend/miniapp-v0
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit API contract fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/miniapp-v0/lib/api.ts
          if git diff --cached --quiet; then
            echo "API contract already fixed"
            exit 0
          fi
          git commit -m "Return photo prompt pricing fields to Mini App"
          git push origin "HEAD:${HEAD_BRANCH}"
