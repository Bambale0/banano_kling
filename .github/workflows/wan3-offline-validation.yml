name: Wan isolated validation bundle
on:
  pull_request:
    branches: [tanyapi]
    paths: ['.github/workflows/wan3-offline-validation.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Fetch locked dependencies and browser for offline verification
        working-directory: frontend/miniapp-v0
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/offline-browsers
        run: |
          npm ci
          npx playwright install chromium
      - name: Package dependency-only bundle
        run: |
          mkdir -p offline-validation
          tar -czf offline-validation/frontend-dependencies.tar.gz -C frontend/miniapp-v0 node_modules
          tar -czf offline-validation/browser-dependencies.tar.gz offline-browsers
      - uses: actions/upload-artifact@v4
        with:
          name: wan-frontend-validation
          path: offline-validation
          retention-days: 1
