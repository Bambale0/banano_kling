name: Apply video repeat source-media fix

on:
  push:
    branches:
      - fix/tanyapi-video-repeat-source-media

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[repeatbot]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tanyapi-video-repeat-source-media
          fetch-depth: 0

      - name: Apply validated UI fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/miniapp-v0/components/forms/video-generator-form.tsx')
          source = path.read_text()

          old = "  const needsStartImage = ((selectedScenario === 'imgtxt' && !isOmniVideo) || selectedScenario === 'character') && startImage.length === 0\n  const needsVideoRef = selectedScenario === 'video' && !isOmniVideo && videoReferences.length === 0\n"
          new = "  const hasServerRepeatSource = Boolean(sourceFeedGenId)\n  const needsStartImage = ((selectedScenario === 'imgtxt' && !isOmniVideo) || selectedScenario === 'character') && startImage.length === 0 && !hasServerRepeatSource\n  const needsVideoRef = selectedScenario === 'video' && !isOmniVideo && videoReferences.length === 0 && !hasServerRepeatSource\n"
          if source.count(old) != 1:
              raise SystemExit('validation lines drifted')
          source = source.replace(old, new, 1)

          required_start = "              required={!isOmniVideo}\n"
          if source.count(required_start) != 1:
              raise SystemExit('start-image required prop drifted')
          source = source.replace(required_start, "              required={!isOmniVideo && !hasServerRepeatSource}\n", 1)

          required_video = "            required={!isOmniVideo}\n"
          if source.count(required_video) != 1:
              raise SystemExit('video-reference required prop drifted')
          source = source.replace(required_video, "            required={!isOmniVideo && !hasServerRepeatSource}\n", 1)

          star = "              ) : (\n                <span className=\"text-destructive ml-1\">*</span>\n              )}"

          start_marker = "                  : 'Стартовое изображение'}"
          start_at = source.index(start_marker)
          star_at = source.index(star, start_at)
          start_replacement = "              ) : hasServerRepeatSource && startImage.length === 0 ? (\n                <span className=\"text-xs text-muted-foreground ml-2\">(из исходной генерации)</span>\n              ) : (\n                <span className=\"text-destructive ml-1\">*</span>\n              )}"
          source = source[:star_at] + start_replacement + source[star_at + len(star):]

          video_marker = "              {isOmniVideo ? 'Видео-референс' : 'Видео-референсы'}"
          video_at = source.index(video_marker)
          star_at = source.index(star, video_at)
          video_replacement = "              ) : hasServerRepeatSource && videoReferences.length === 0 ? (\n                <span className=\"text-xs text-muted-foreground ml-2\">(из исходной генерации)</span>\n              ) : (\n                <span className=\"text-destructive ml-1\">*</span>\n              )}"
          source = source[:star_at] + video_replacement + source[star_at + len(star):]

          path.write_text(source)
          PY

      - name: Verify exact diff shape
        run: |
          git diff --check
          grep -q 'const hasServerRepeatSource = Boolean(sourceFeedGenId)' frontend/miniapp-v0/components/forms/video-generator-form.tsx
          grep -q '(из исходной генерации)' frontend/miniapp-v0/components/forms/video-generator-form.tsx
          test "$(grep -c '(из исходной генерации)' frontend/miniapp-v0/components/forms/video-generator-form.tsx)" -eq 2

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/miniapp-v0/components/forms/video-generator-form.tsx
          git commit -m 'fix(video): reuse source media on repeat [repeatbot]'
          git push origin HEAD:fix/tanyapi-video-repeat-source-media
