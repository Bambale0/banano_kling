name: Deploy — Tanya production reliable

on:
  push:
    branches: [tanyapi]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  verify_ci:
    name: Verify exact release CI
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Require production branch and verified code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REF" = "refs/heads/tanyapi" ] || {
            echo "::error::Production deploy is allowed only from refs/heads/tanyapi"
            exit 1
          }

          # Recovery path: if this commit changes deploy workflow files only,
          # an already-green parent CI verifies the application code unchanged.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            before="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${before}...${GITHUB_SHA}" --jq '.files[].filename')"
              non_deploy="$(printf '%s\n' "$changed" | grep -Ev '^\.github/workflows/deploy-production[^/]*\.ya?ml$' || true)"
              if [ -n "$changed" ] && [ -z "$non_deploy" ]; then
                parent_run="$(
                  gh api --method GET \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                    -f head_sha="$before" -f event=push -f branch=tanyapi -F per_page=10 \
                    --jq '.workflow_runs | sort_by(.created_at) | last // {}'
                )"
                parent_status="$(jq -r '.status // empty' <<< "$parent_run")"
                parent_conclusion="$(jq -r '.conclusion // empty' <<< "$parent_run")"
                if [ "$parent_status" = completed ] && [ "$parent_conclusion" = success ]; then
                  echo "Application code is unchanged; parent CI is green: $before"
                  exit 0
                fi
              fi
            fi
          fi

          deadline=$((SECONDS + 2700))
          while [ "$SECONDS" -lt "$deadline" ]; do
            run="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f head_sha="$GITHUB_SHA" -f event=push -f branch=tanyapi -F per_page=10 \
                --jq '.workflow_runs | sort_by(.created_at) | last // {}'
            )"
            status="$(jq -r '.status // empty' <<< "$run")"
            conclusion="$(jq -r '.conclusion // empty' <<< "$run")"
            run_id="$(jq -r '.id // empty' <<< "$run")"
            echo "CI ${run_id:-missing}: status=${status:-missing} conclusion=${conclusion:-pending}"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || {
                echo "::error::Exact CI failed with conclusion=$conclusion"
                exit 1
              }
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for exact CI for $GITHUB_SHA"
          exit 1

  deploy:
    name: GitHub runner — reliable SSH production deploy
    needs: verify_ci
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_PROJECT_PATH: ${{ secrets.PROD_PROJECT_PATH }}
    steps:
      - name: Require SSH production configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in PROD_SSH_HOST PROD_SSH_PRIVATE_KEY PROD_SSH_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || {
              echo "::error::$name is not configured"
              exit 1
            }
          done

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/production_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/production_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/production_key" >/dev/null

      - name: Deploy exact tanyapi commit
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_user="${PROD_SSH_USER:-root}"
          deploy_port="${PROD_SSH_PORT:-22}"
          deploy_path="${PROD_PROJECT_PATH:-/root/tanya/banano_kling}"
          printf -v quoted_path '%q' "$deploy_path"
          printf -v quoted_sha '%q' "$GITHUB_SHA"

          ssh \
            -i "$HOME/.ssh/production_key" \
            -p "$deploy_port" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes \
            "$deploy_user@$PROD_SSH_HOST" \
            "bash -s -- $quoted_path $quoted_sha" <<'REMOTE'
          set -Eeuo pipefail
          PROJECT_DIR="$1"
          EXPECTED_SHA="$2"
          RUNTIME_PRICE_FILE="data/price.json"
          runtime_price_backup=""
          runtime_price_default=""

          validate_runtime_price() {
            if [ ! -f "$1" ] || [ -L "$1" ] \
              || ! python3 -c 'import json, sys; sys.exit(0 if isinstance(json.load(open(sys.argv[1], encoding="utf-8")), dict) else 1)' "$1"; then
              echo "Invalid runtime pricing JSON object or file type; refusing deployment" >&2
              return 1
            fi
          }

          cleanup_runtime_price_backup() {
            local exit_status=$?
            if [ -n "${runtime_price_default:-}" ]; then
              rm -f -- "$runtime_price_default"
            fi
            if [ -n "${runtime_price_backup:-}" ] && [ -f "$runtime_price_backup" ]; then
              if [ "$exit_status" -eq 0 ]; then
                rm -f -- "$runtime_price_backup"
              else
                echo "Runtime pricing backup retained at $runtime_price_backup" >&2
              fi
            fi
            # Never copy a snapshot back: an admin may have saved newer prices.
            exit "$exit_status"
          }
          trap cleanup_runtime_price_backup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          command -v git >/dev/null
          command -v python3 >/dev/null
          command -v docker >/dev/null
          command -v flock >/dev/null
          command -v curl >/dev/null

          exec 9>/var/lock/banano-kling-production-deploy.lock
          flock -w 300 9 || {
            echo "Timed out waiting for production deployment lock" >&2
            exit 1
          }

          cd "$PROJECT_DIR"
          [ -d .git ] || { echo "Git repository not found: $PROJECT_DIR" >&2; exit 1; }

          git update-index -q --refresh || true
          if ! git diff --cached --quiet; then
            echo "Staged local changes block deployment" >&2
            git status --short >&2
            exit 1
          fi

          dirty_paths="$(git diff --name-only --diff-filter=ACDMRTUXB)"
          other_dirty_paths="$(
            printf '%s\n' "$dirty_paths" \
              | sed '/^$/d' \
              | grep -vxF "$RUNTIME_PRICE_FILE" \
              | grep -vE '^tests/' \
              || true
          )"
          if [ -n "$other_dirty_paths" ]; then
            echo "Tracked runtime changes block deployment:" >&2
            printf '%s\n' "$other_dirty_paths" >&2
            git status --short >&2
            exit 1
          fi

          git fetch --prune origin tanyapi
          remote_sha="$(git rev-parse origin/tanyapi)"
          [ "$remote_sha" = "$EXPECTED_SHA" ] || {
            echo "Production branch moved: expected=$EXPECTED_SHA origin/tanyapi=$remote_sha" >&2
            exit 1
          }

          # Production pricing is mutable runtime state managed by admins.
          # Standard releases never write an existing price file, even when defaults
          # change or contain the legacy force_apply_runtime_price flag.
          [ "$(git branch --show-current)" = tanyapi ] || {
            echo "Production checkout must already be on tanyapi; refusing branch switch" >&2
            exit 1
          }
          # An excluded child path cannot protect against replacing its parent with
          # a file/symlink. Reject such source trees before any worktree update.
          target_data_type="$(git cat-file -t "$EXPECTED_SHA:data" 2>/dev/null || true)"
          if [ -L data ] || { [ -n "$target_data_type" ] && [ "$target_data_type" != tree ]; }; then
            echo "Production data directory cannot be replaced by deployment" >&2
            exit 1
          fi
          target_price_type="$(git cat-file -t "$EXPECTED_SHA:$RUNTIME_PRICE_FILE" 2>/dev/null || true)"
          if [ -n "$target_price_type" ] && [ "$target_price_type" != blob ]; then
            echo "Versioned runtime price path must be a file or absent" >&2
            exit 1
          fi

          if [ -e "$RUNTIME_PRICE_FILE" ] || [ -L "$RUNTIME_PRICE_FILE" ]; then
            validate_runtime_price "$RUNTIME_PRICE_FILE"
            runtime_price_backup="$(mktemp "${TMPDIR:-/tmp}/banano-runtime-price.XXXXXX")"
            cp -- "$RUNTIME_PRICE_FILE" "$runtime_price_backup"
            cmp -s -- "$RUNTIME_PRICE_FILE" "$runtime_price_backup"
            validate_runtime_price "$runtime_price_backup"
            echo "Preserving runtime pricing from $RUNTIME_PRICE_FILE"
          fi

          # Restore source additions, changes and deletions, always excluding prices.
          # The mixed reset updates HEAD/index only; it cannot overwrite a concurrent
          # admin save, unlike reset --hard followed by snapshot restoration.
          git restore --source="$EXPECTED_SHA" --worktree -- . ":(top,exclude)$RUNTIME_PRICE_FILE"
          git reset --mixed --no-refresh "$EXPECTED_SHA"
          actual_sha="$(git rev-parse HEAD)"
          [ "$actual_sha" = "$EXPECTED_SHA" ]

          if [ -z "$runtime_price_backup" ] && [ ! -e "$RUNTIME_PRICE_FILE" ] && [ ! -L "$RUNTIME_PRICE_FILE" ]; then
            # Seed first installs only. The atomic hard link cannot replace a price
            # file created by an admin after the existence check above.
            mkdir -p -- "$(dirname -- "$RUNTIME_PRICE_FILE")"
            runtime_price_default="$(mktemp "data/.price-default.XXXXXX")"
            git show "$EXPECTED_SHA:$RUNTIME_PRICE_FILE" > "$runtime_price_default"
            validate_runtime_price "$runtime_price_default"
            if ln -T -- "$runtime_price_default" "$RUNTIME_PRICE_FILE" 2>/dev/null; then
              echo "Initialized absent runtime pricing from the checked-in default"
            else
              validate_runtime_price "$RUNTIME_PRICE_FILE"
              echo "Preserving runtime pricing created during deployment"
            fi
          fi
          validate_runtime_price "$RUNTIME_PRICE_FILE"
          echo "Retained runtime pricing at $RUNTIME_PRICE_FILE"

          run_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }

          run_root bash scripts/deploy_backend_docker.sh deploy
          run_root bash scripts/deploy_backend_docker.sh status

          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' banano-kling-bot)"
          revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' banano-kling-bot)"
          [ "$health" = healthy ]
          [ "$revision" = "$EXPECTED_SHA" ]

          if ! docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' banano-kling-bot \
            | grep -Eq '^TRIBUTE_API_KEY=.+$'; then
            echo "TRIBUTE_API_KEY is missing in production container" >&2
            exit 42
          fi
          echo "Tribute runtime key: configured"

          run_root bash scripts/deploy_miniapp_local.sh "$EXPECTED_SHA"

          curl -fsS --max-time 20 https://tanyapi.chillcreative.ru/health >/dev/null
          live_frontend_revision="$(curl -fsS --max-time 20 "https://tanyapp.xn--e1aikcel5c5a.online/mini-app/revision.txt?revision=${EXPECTED_SHA}")"
          [ "$live_frontend_revision" = "$EXPECTED_SHA" ]

          tribute_http="$(curl -sS --max-time 20 -o /tmp/tribute-probe.json -w '%{http_code}' \
            -X POST https://tanyapi.chillcreative.ru/tribute/webhook \
            -H 'Content-Type: application/json' --data '{}')"
          if [ "$tribute_http" != 401 ]; then
            echo "Tribute webhook probe returned HTTP $tribute_http (expected 401 for unsigned request)" >&2
            cat /tmp/tribute-probe.json >&2 || true
            exit 43
          fi
          rm -f /tmp/tribute-probe.json

          prodamus_env="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' banano-kling-bot)"
          if printf '%s\n' "$prodamus_env" | grep -Eq '^PRODAMUS_PAYFORM_URL=.+$' \
            && printf '%s\n' "$prodamus_env" | grep -Eq '^PRODAMUS_SECRET_KEY=.+$' \
            && printf '%s\n' "$prodamus_env" | grep -Eq '^PRODAMUS_SYS=.+$'; then
            prodamus_http="$(curl -sS --max-time 20 -o /tmp/prodamus-probe.txt -w '%{http_code}' \
              -X POST https://tanyapi.chillcreative.ru/prodamus/webhook \
              -H 'Content-Type: application/json' --data '{}')"
            if [ "$prodamus_http" != 401 ]; then
              echo "Prodamus webhook probe returned HTTP $prodamus_http (expected 401 for unsigned request)" >&2
              cat /tmp/prodamus-probe.txt >&2 || true
              exit 44
            fi
            rm -f /tmp/prodamus-probe.txt
            echo "Prodamus runtime: configured; unsigned webhook probe=401"
          else
            echo "Prodamus runtime: disabled (merchant env is incomplete)"
          fi

          echo "deployed_sha=$(git rev-parse HEAD)"
          echo "container_revision=$revision"
          echo "container_health=$health"
          echo "miniapp_revision=$live_frontend_revision"
          echo "tribute_webhook_probe=401"
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/production_key"

  publish_status:
    name: Publish production deploy status
    needs: [verify_ci, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish tanya/deploy status
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RESULT: ${{ needs.verify_ci.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state=failure
          description="Production deployment failed"

          if [ "$VERIFY_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ]; then
            state=success
            description="Production backend and Mini App deployed at exact SHA"
          elif [ "$VERIFY_RESULT" != success ]; then
            description="Production deployment blocked by CI verification"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='tanya/deploy' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
