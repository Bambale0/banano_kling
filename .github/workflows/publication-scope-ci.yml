name: Publication Scope CI

on:
  pull_request:
    branches:
      - tanyapi
    paths:
      - "bot/handlers/publication_scope_compat.py"
      - "bot/services/publication_scope_postgres_compat.py"
      - "bot/handlers/__init__.py"
      - "frontend/miniapp-v0/**"
      - ".github/workflows/publication-scope-ci.yml"

permissions:
  contents: write

jobs:
  profile-only-ui-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply profile-only interaction guards
        run: |
          python - <<'PY'
          from pathlib import Path

          types_path = Path("frontend/miniapp-v0/lib/types.ts")
          types_source = types_path.read_text(encoding="utf-8")
          types_source = types_source.replace(
              "  is_public_feed?: boolean\n  is_prompt_library?: boolean\n",
              "  is_public_feed?: boolean\n"
              "  is_profile_visible?: boolean\n"
              "  publication_scope?: 'private' | 'profile' | 'feed'\n"
              "  feed_interactions_enabled?: boolean\n"
              "  is_prompt_library?: boolean\n",
          )
          types_source = types_source.replace(
              "  is_mine: boolean\n  can_remove?: boolean\n",
              "  is_mine: boolean\n"
              "  is_profile_visible?: boolean\n"
              "  publication_scope?: 'private' | 'profile' | 'feed'\n"
              "  feed_interactions_enabled?: boolean\n"
              "  can_remove?: boolean\n",
          )
          types_path.write_text(types_source, encoding="utf-8")

          profile_path = Path("frontend/miniapp-v0/components/tabs/profile-tab.tsx")
          profile_source = profile_path.read_text(encoding="utf-8")
          helper_anchor = """function getPublicReferences(item: FeedItem | null) {
  if (!item) return []
  return [
    ...(item.reference_images || []).map((url) => ({ type: 'image' as const, url })),
    ...(item.reference_videos || []).map((url) => ({ type: 'video' as const, url })),
  ].filter((item) => isHttpUrl(item.url))
}
"""
          helper_replacement = helper_anchor + """
function feedInteractionsEnabled(item: FeedItem | null | undefined) {
  return Boolean(
    item &&
      item.feed_interactions_enabled !== false &&
      item.publication_scope !== 'profile'
  )
}
"""
          if "function feedInteractionsEnabled" not in profile_source:
              profile_source = profile_source.replace(helper_anchor, helper_replacement)

          profile_source = profile_source.replace(
              "      if (!commentsItem || !isLive) {\n",
              "      if (!commentsItem || !isLive || !feedInteractionsEnabled(commentsItem)) {\n",
          )
          profile_source = profile_source.replace(
              "  async function handleCopyPostLink(item: FeedItem) {\n    if (!isLive) return\n",
              "  async function handleCopyPostLink(item: FeedItem) {\n"
              "    if (!isLive || !feedInteractionsEnabled(item)) return\n",
          )
          profile_source = profile_source.replace(
              "    if (!isLive || !commentsItem || !text) return\n",
              "    if (!isLive || !commentsItem || !text || !feedInteractionsEnabled(commentsItem)) return\n",
          )
          profile_source = profile_source.replace(
              "  function handleRemix(item: FeedItem) {\n",
              "  function handleRemix(item: FeedItem) {\n"
              "    if (!feedInteractionsEnabled(item)) return\n",
          )
          profile_source = profile_source.replace(
              "                disabled={!isLive || busyId === item.id}\n"
              "                onClick={() => handleCopyPostLink(item)}\n",
              "                disabled={!isLive || busyId === item.id || !feedInteractionsEnabled(item)}\n"
              "                onClick={() => handleCopyPostLink(item)}\n",
          )
          profile_source = profile_source.replace(
              "                disabled={!isLive}\n"
              "                onClick={() => setCommentsItem(item)}\n",
              "                disabled={!isLive || !feedInteractionsEnabled(item)}\n"
              "                onClick={() => setCommentsItem(item)}\n",
          )
          profile_source = profile_source.replace(
              "                  {formatCompactNumber(item.remixes)}\n"
              "                </span>\n"
              "              </button>\n",
              "                  {formatCompactNumber(item.remixes)}\n"
              "                </span>\n"
              "                {!feedInteractionsEnabled(item) ? (\n"
              "                  <span className=\"pointer-events-none absolute bottom-1 left-1/2 -translate-x-1/2 rounded bg-background/85 px-1.5 py-0.5 text-[9px] font-semibold text-cyan backdrop-blur\">\n"
              "                    Только профиль\n"
              "                  </span>\n"
              "                ) : null}\n"
              "              </button>\n",
          )
          profile_source = profile_source.replace(
              "          <p className=\"mt-1 text-sm text-muted-foreground\">В профиле появятся фото и видео, опубликованные в ленте.</p>\n",
              "          <p className=\"mt-1 text-sm text-muted-foreground\">Здесь появятся работы, опубликованные в ленте или только в профиле.</p>\n",
          )
          profile_source = profile_source.replace(
              "              disabled={!isLive}\n"
              "              onClick={() => setCommentsItem(previewItem)}\n",
              "              disabled={!isLive || !feedInteractionsEnabled(previewItem)}\n"
              "              onClick={() => setCommentsItem(previewItem)}\n",
          )
          profile_source = profile_source.replace(
              "              className=\"h-10 rounded-full px-4\"\n"
              "              onClick={() => handleRemix(previewItem)}\n",
              "              className=\"h-10 rounded-full px-4\"\n"
              "              disabled={!feedInteractionsEnabled(previewItem)}\n"
              "              onClick={() => handleRemix(previewItem)}\n",
          )
          profile_source = profile_source.replace(
              "                disabled={!commentText.trim() || busyId === commentsItem.id || !isLive}\n",
              "                disabled={\n"
              "                  !commentText.trim() ||\n"
              "                  busyId === commentsItem.id ||\n"
              "                  !isLive ||\n"
              "                  !feedInteractionsEnabled(commentsItem)\n"
              "                }\n",
          )
          profile_path.write_text(profile_source, encoding="utf-8")
          PY
      - name: Commit UI compatibility changes
        run: |
          if git diff --quiet; then
            echo "No UI compatibility changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/miniapp-v0/lib/types.ts \
            frontend/miniapp-v0/components/tabs/profile-tab.tsx
          git commit -m "fix: guard profile-only feed interactions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  python-lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet ruff
      - name: Lint publication scope modules
        run: |
          ruff check \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py \
            --ignore=E402,F403,F405,E501
      - name: Compile publication scope modules
        run: |
          python -m py_compile \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py

  miniapp-build:
    runs-on: ubuntu-latest
    needs: profile-only-ui-compat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Install dependencies
        working-directory: frontend/miniapp-v0
        run: npm ci
      - name: Build Mini App
        working-directory: frontend/miniapp-v0
        run: npm run build
