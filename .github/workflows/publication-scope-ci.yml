name: Publication Scope CI

on:
  pull_request:
    branches:
      - tanyapi
    paths:
      - "bot/handlers/publication_scope_compat.py"
      - "bot/services/publication_scope_postgres_compat.py"
      - "bot/handlers/feed_model_filter_compat.py"
      - "bot/handlers/__init__.py"
      - "bot/main.py"
      - "frontend/miniapp-v0/**"
      - "tests/test_publication_scope_compat.py"
      - "tests/test_feed_model_filter_compat.py"
      - ".github/workflows/publication-scope-ci.yml"
  push:
    branches:
      - agent/feed-model-filters
    paths:
      - "scripts/apply_feed_model_filters.py"
      - ".github/workflows/publication-scope-ci.yml"

permissions:
  contents: write

jobs:
  apply-feed-model-filters:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[feed-model-filter-patch]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/feed-model-filters
          fetch-depth: 0
          show-progress: false
      - name: Apply source patches
        run: python scripts/apply_feed_model_filters.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pytest-asyncio ruff
          if [ -f requirements.txt ]; then python -m pip install --quiet -r requirements.txt; fi
      - name: Python checks
        run: |
          ruff check bot/handlers/feed_model_filter_compat.py tests/test_feed_model_filter_compat.py --ignore=E402,E501,BLE001
          python -m py_compile bot/handlers/feed_model_filter_compat.py bot/handlers/__init__.py bot/main.py
          pytest tests/test_feed_model_filter_compat.py tests/test_database.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Build Mini App
        working-directory: frontend/miniapp-v0
        run: |
          npm ci
          npm run build
      - name: Commit implementation
        run: |
          git checkout origin/tanyapi -- .github/workflows/publication-scope-ci.yml
          rm -f scripts/apply_feed_model_filters.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: filter feed by generation model [feed-model-filter-patch]"
          git push origin HEAD:agent/feed-model-filters

  python-lint-and-compile:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet ruff
      - name: Lint publication scope modules
        run: |
          ruff check \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/feed_model_filter_compat.py \
            bot/handlers/__init__.py \
            tests/test_publication_scope_compat.py \
            tests/test_feed_model_filter_compat.py \
            --ignore=E402,F403,F405,E501,I001,RUF059,BLE001
      - name: Compile publication scope modules
        run: |
          python -m py_compile \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/feed_model_filter_compat.py \
            bot/handlers/__init__.py \
            tests/test_publication_scope_compat.py \
            tests/test_feed_model_filter_compat.py

  publication-scope-test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pytest-asyncio
          if [ -f requirements.txt ]; then python -m pip install --quiet -r requirements.txt; fi
      - name: Run publication and feed-filter tests
        run: |
          pytest tests/test_publication_scope_compat.py tests/test_feed_model_filter_compat.py -vv -s --tb=long

  miniapp-build:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/miniapp-v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Mini App
        run: npm run build
