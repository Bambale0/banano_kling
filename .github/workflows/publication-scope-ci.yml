name: Publication Scope CI

on:
  pull_request:
    branches:
      - tanyapi
    paths:
      - "bot/handlers/publication_scope_compat.py"
      - "bot/services/publication_scope_postgres_compat.py"
      - "bot/handlers/__init__.py"
      - "frontend/miniapp-v0/**"
      - "tests/test_publication_scope_compat.py"
      - ".github/workflows/publication-scope-ci.yml"
  push:
    branches:
      - agent/profile-publication-scope
    paths:
      - "scripts/apply_profile_interactions.py"
      - "scripts/run_profile_interactions_patch.py"
      - ".github/workflows/publication-scope-ci.yml"

permissions:
  contents: write

jobs:
  apply-profile-interactions:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[profile-interactions-patch]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-publication-scope
          fetch-depth: 0
          show-progress: false
      - name: Apply profile interaction patch
        run: |
          set -o pipefail
          python scripts/run_profile_interactions_patch.py 2>&1 | tee /tmp/profile-interactions-patch.log
      - name: Upload profile interaction diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: profile-interactions-patch-diagnostics
          path: /tmp/profile-interactions-patch.log
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then python -m pip install --quiet -r requirements.txt; fi
      - name: Python checks
        run: |
          python -m py_compile bot/database.py bot/miniapp.py
          python -m pytest tests/test_database.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Build Mini App
        working-directory: frontend/miniapp-v0
        run: |
          npm ci
          npm run build
      - name: Commit interaction support
        run: |
          git checkout 9d6e2bea8aba05c20c273ac1b8478139e12a9f84 -- .github/workflows/publication-scope-ci.yml
          rm -f .github/workflows/profile-interactions-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enable profile-only interactions and links [profile-interactions-patch]"
          git push origin HEAD:agent/profile-publication-scope

  python-lint-and-compile:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet ruff
      - name: Lint publication scope modules
        run: |
          ruff check \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py \
            tests/test_publication_scope_compat.py \
            --ignore=E402,F403,F405,E501
      - name: Compile publication scope modules
        run: |
          python -m py_compile \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py \
            tests/test_publication_scope_compat.py

  publication-scope-test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pytest-asyncio
          if [ -f requirements.txt ]; then python -m pip install --quiet -r requirements.txt; fi
      - name: Run publication scope lifecycle test
        id: scope_test
        shell: bash
        run: |
          set +e
          pytest tests/test_publication_scope_compat.py -vv -s --tb=long 2>&1 | tee publication-scope-test.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload publication scope diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-scope-test-log
          path: publication-scope-test.log
      - name: Fail when lifecycle test failed
        if: steps.scope_test.outputs.exit_code != '0'
        run: exit 1

  miniapp-build:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/miniapp-v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Mini App
        run: npm run build
