name: Publication Scope CI

on:
  pull_request:
    branches:
      - tanyapi
    paths:
      - "bot/handlers/publication_scope_compat.py"
      - "bot/services/publication_scope_postgres_compat.py"
      - "bot/handlers/__init__.py"
      - "frontend/miniapp-v0/**"
      - ".github/workflows/publication-scope-ci.yml"

permissions:
  contents: write

jobs:
  python-fix-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet ruff
      - name: Apply targeted compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot/handlers/publication_scope_compat.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "from datetime import datetime\n",
              "from datetime import datetime, timezone\n",
          )
          if "from aiogram.exceptions import TelegramBadRequest\n" not in source:
              source = source.replace(
                  "from aiogram import F, Router, types\n",
                  "from aiogram import F, Router, types\n"
                  "from aiogram.exceptions import TelegramBadRequest\n",
              )
          source = source.replace(
              "    except Exception:\n        return getattr(row, key, default)\n",
              "    except (AttributeError, IndexError, KeyError, TypeError):\n"
              "        return getattr(row, key, default)\n",
          )
          source = source.replace(
              "            except Exception:\n"
              "                # The compatibility layer is loaded on every start. Existing columns are expected.\n"
              "                pass\n",
              "            except db_backend.OperationalError:\n"
              "                # The compatibility layer is loaded on every start. Existing columns are expected.\n"
              "                logger.debug(\"Publication scope column already exists: %s\", statement)\n",
          )
          source = source.replace(
              "        except Exception:\n"
              "            logger.debug(\"Could not create publication profile index\", exc_info=True)\n",
              "        except db_backend.OperationalError:\n"
              "            logger.debug(\"Could not create publication profile index\", exc_info=True)\n",
          )
          source = source.replace(
              "        published_at = datetime.utcnow().isoformat(sep=\" \", timespec=\"microseconds\")\n",
              "        published_at = datetime.now(timezone.utc).replace(tzinfo=None).isoformat(\n"
              "            sep=\" \", timespec=\"microseconds\"\n"
              "        )\n",
          )
          source = source.replace(
              "    except Exception:\n"
              "        logger.debug(\"Could not refresh publication result keyboard\", exc_info=True)\n",
              "    except (AttributeError, TelegramBadRequest, TypeError):\n"
              "        logger.debug(\"Could not refresh publication result keyboard\", exc_info=True)\n",
          )
          source = source.replace(
              "        try:\n"
              "            invalidator()\n"
              "        except Exception:\n"
              "            logger.debug(\"Could not invalidate feed/profile caches\", exc_info=True)\n",
              "        invalidator()\n",
          )
          source = source.replace(
              "    except Exception as error:\n"
              "        return module._miniapp_error_response(\n",
              "    except Exception as error:  # noqa: BLE001 - API boundary converts unexpected failures to JSON\n"
              "        return module._miniapp_error_response(\n",
          )
          source = source.replace(
              "def _patch_miniapp_module(module) -> None:\n"
              "    module.miniapp_generation_share = lambda request: _miniapp_generation_share_scoped(module, request)\n",
              "def _patch_miniapp_module(module) -> None:\n"
              "    async def scoped_generation_share(request):\n"
              "        return await _miniapp_generation_share_scoped(module, request)\n\n"
              "    module.miniapp_generation_share = scoped_generation_share\n",
          )
          path.write_text(source, encoding="utf-8")
          PY
      - name: Format and lint publication scope modules
        run: |
          ruff check \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py \
            --ignore=E402,F403,F405,E501 \
            --fix --unsafe-fixes
          ruff check \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py \
            --ignore=E402,F403,F405,E501
      - name: Compile publication scope modules
        run: |
          python -m py_compile \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py
      - name: Commit lint fixes to feature branch
        run: |
          if git diff --quiet; then
            echo "No lint fixes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py
          git commit -m "fix: satisfy publication scope lint"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  miniapp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Install dependencies
        working-directory: frontend/miniapp-v0
        run: npm ci
      - name: Build Mini App
        working-directory: frontend/miniapp-v0
        run: npm run build
