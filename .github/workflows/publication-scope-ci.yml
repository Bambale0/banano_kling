name: Publication Scope CI

on:
  pull_request:
    branches:
      - tanyapi
    paths:
      - "bot/handlers/publication_scope_compat.py"
      - "bot/services/publication_scope_postgres_compat.py"
      - "bot/handlers/__init__.py"
      - "frontend/miniapp-v0/**"
      - "tests/test_publication_scope_compat.py"
      - ".github/workflows/publication-scope-ci.yml"

permissions:
  contents: read

jobs:
  python-lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet ruff
      - name: Lint publication scope modules
        run: |
          ruff check \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py \
            tests/test_publication_scope_compat.py \
            --ignore=E402,F403,F405,E501
      - name: Compile publication scope modules
        run: |
          python -m py_compile \
            bot/handlers/publication_scope_compat.py \
            bot/services/publication_scope_postgres_compat.py \
            bot/handlers/__init__.py \
            tests/test_publication_scope_compat.py

  publication-scope-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pytest-asyncio
          if [ -f requirements.txt ]; then python -m pip install --quiet -r requirements.txt; fi
      - name: Run publication scope lifecycle test
        id: scope_test
        shell: bash
        run: |
          set +e
          pytest tests/test_publication_scope_compat.py -vv -s --tb=long 2>&1 | tee publication-scope-test.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload publication scope diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-scope-test-log
          path: publication-scope-test.log
      - name: Fail when lifecycle test failed
        if: steps.scope_test.outputs.exit_code != '0'
        run: exit 1

  miniapp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/miniapp-v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Mini App
        run: npm run build
