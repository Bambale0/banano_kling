name: tmp seedance repeat model fix

on:
  push:
    branches:
      - fix/tanyapi-feed-repeat-model-seedance-default

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tanyapi-feed-repeat-model-seedance-default
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Patch source and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count} for {old!r}')
              p.write_text(text.replace(old, new, 1))

          video_tab = 'frontend/miniapp-v0/components/tabs/video-tab.tsx'
          replace_once(
              video_tab,
              """    // A remix preset must keep sourceFeedGenId all the way to generateVideo().\n    // The dedicated Seedance form is for fresh generations and intentionally has\n    // no feed-repeat contract, so use the generic form only for this repeat case.\n    setVideoMode(\n      videoPromptPreset.model === 'seedance_2_5' && videoPromptPreset.sourceFeedGenId\n        ? 'regular'\n        : videoPromptPreset.model === 'seedance_2_5'\n          ? 'seedance25'\n          : 'regular',\n    )\n""",
              """    // Seedance 2.5 repeats still use the source-aware generic form below,\n    // but the model switch must reflect the source model instead of falsely\n    // highlighting the generic catalog.\n    setVideoMode(videoPromptPreset.model === 'seedance_2_5' ? 'seedance25' : 'regular')\n""",
          )
          replace_once(
              video_tab,
              "effectiveMode === 'seedance25' && !isSeedanceRepeat\n                  ? 'border border-gold/45 bg-gold/15 text-gold shadow-[0_0_18px_rgba(251,191,36,0.10)]'",
              "effectiveMode === 'seedance25'\n                  ? 'border border-gold/45 bg-gold/15 text-gold shadow-[0_0_18px_rgba(251,191,36,0.10)]'",
          )
          replace_once(
              video_tab,
              "effectiveMode === 'regular' || isSeedanceRepeat\n                  ? 'border border-border bg-secondary text-foreground'",
              "effectiveMode === 'regular'\n                  ? 'border border-border bg-secondary text-foreground'",
          )

          form = 'frontend/miniapp-v0/components/forms/video-generator-form.tsx'
          replace_once(
              form,
              """    if (nextModel.id === 'grok_imagine') {\n""",
              """    if (nextModel.id === 'seedance_2') {\n      // Seedance 2.0 is primarily an image-to-video flow in the Mini App.\n      // Selecting the model should open the useful default immediately instead\n      // of leaving the previous Text -> Video scenario selected.\n      setSelectedScenario('imgtxt')\n      setVideoReferences([])\n      setAudioReference([])\n    } else if (nextModel.id === 'grok_imagine') {\n""",
          )

          test = 'frontend/miniapp-v0/components/tabs/__tests__/video-tab-repeat.test.tsx'
          replace_once(
              test,
              """  it('keeps Seedance 2.5 feed repeats on the source-aware generic form', () => {\n""",
              """  it('keeps Seedance 2.5 selected while feed repeat uses the source-aware generic form', () => {\n""",
          )
          replace_once(
              test,
              """    expect(screen.getByTestId('regular-video-form')).toBeInTheDocument()\n    expect(screen.queryByTestId('seedance25-form')).not.toBeInTheDocument()\n  })\n})\n""",
              """    expect(screen.getByTestId('regular-video-form')).toBeInTheDocument()\n    expect(screen.queryByTestId('seedance25-form')).not.toBeInTheDocument()\n\n    const seedanceButton = screen.getByRole('button', { name: /Seedance 2\\.5/i })\n    const catalogButton = screen.getByRole('button', { name: /Другие модели/i })\n    expect(seedanceButton.className).toContain('border-gold/45')\n    expect(catalogButton.className).not.toContain('border-border bg-secondary')\n  })\n})\n""",
          )

          default_test = Path('frontend/miniapp-v0/components/forms/video-generator-form-seedance-default.test.tsx')
          default_test.write_text(r'''import '@testing-library/jest-dom'
          import { fireEvent, render, screen, waitFor } from '@testing-library/react'

          jest.mock('@/components/forms/model-select', () => ({
            ModelSelect: ({ value, onChange }: { value: string; onChange: (value: string) => void }) => (
              <div>
                <div data-testid="model">{value}</div>
                <button type="button" onClick={() => onChange('seedance_2')}>select Seedance 2.0</button>
              </div>
            ),
          }))
          jest.mock('@/components/forms/ratio-select', () => ({
            RatioSelect: ({ value }: { value: string }) => <div data-testid="ratio">{value}</div>,
          }))
          jest.mock('@/components/forms/scenario-select', () => ({
            ScenarioSelect: ({ value }: { value: string }) => <div data-testid="scenario">{value}</div>,
          }))
          jest.mock('@/components/forms/duration-select', () => ({
            DurationSelect: ({ value }: { value: number }) => <div data-testid="duration">{value}</div>,
          }))
          jest.mock('@/components/forms/upload-area', () => ({
            UploadArea: () => <div data-testid="upload-area" />,
          }))

          import { VideoGeneratorForm } from '@/components/forms/video-generator-form'
          import type { VideoModel } from '@/lib/types'

          const models: VideoModel[] = [
            {
              id: 'v3_pro',
              label: 'Kling 3.0',
              description: 'default',
              durations: [5],
              ratios: ['16:9'],
              supports: ['text', 'imgtxt'],
              costs: { '5': 5 },
              max_image_references: 8,
            },
            {
              id: 'seedance_2',
              label: 'Bytedance Seedance 2.0',
              description: 'image to video',
              durations: [5, 10, 15],
              ratios: ['16:9', '9:16', '1:1'],
              supports: ['text', 'imgtxt', 'video'],
              costs: { '5': 2, '10': 4, '15': 6 },
              max_image_references: 9,
              max_video_references: 3,
            },
          ]

          describe('Seedance 2.0 model defaults', () => {
            it('opens Photo + Text when Seedance 2.0 is selected', async () => {
              render(
                <VideoGeneratorForm
                  models={models}
                  onSubmit={jest.fn().mockResolvedValue(undefined)}
                  isSubmitting={false}
                  credits={100}
                />,
              )

              expect(screen.getByTestId('scenario')).toHaveTextContent('text')
              fireEvent.click(screen.getByRole('button', { name: /select Seedance 2\.0/i }))

              await waitFor(() => {
                expect(screen.getByTestId('model')).toHaveTextContent('seedance_2')
                expect(screen.getByTestId('scenario')).toHaveTextContent('imgtxt')
              })
            })
          })
          '''.replace('\n          ', '\n').lstrip())
          PY
      - name: Install Mini App dependencies
        working-directory: frontend/miniapp-v0
        run: npm ci --no-audit --fund=false
      - name: Run targeted regressions
        working-directory: frontend/miniapp-v0
        run: npm test -- --runInBand components/tabs/__tests__/video-tab-repeat.test.tsx components/forms/video-generator-form-seedance-default.test.tsx components/forms/video-generator-form-repeat.test.tsx
      - name: Lint changed source
        working-directory: frontend/miniapp-v0
        run: npx eslint components/tabs/video-tab.tsx components/forms/video-generator-form.tsx components/tabs/__tests__/video-tab-repeat.test.tsx components/forms/video-generator-form-seedance-default.test.tsx
      - name: Build production Mini App
        working-directory: frontend/miniapp-v0
        run: npm run build
      - name: Commit tested fix and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/tmp-feed-repeat-model-seedance-default.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/miniapp-v0/components/tabs/video-tab.tsx \
                  frontend/miniapp-v0/components/forms/video-generator-form.tsx \
                  frontend/miniapp-v0/components/tabs/__tests__/video-tab-repeat.test.tsx \
                  frontend/miniapp-v0/components/forms/video-generator-form-seedance-default.test.tsx \
                  .github/workflows/tmp-feed-repeat-model-seedance-default.yml
          git commit -m 'fix(miniapp): preserve Seedance model on video repeat'
          git push origin HEAD:fix/tanyapi-feed-repeat-model-seedance-default
