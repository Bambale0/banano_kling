name: Apply profile immediate refresh v2

on:
  push:
    branches:
      - fix/profile-immediate-publication-v2
    paths:
      - .github/workflows/apply-profile-immediate-v2.yml
  pull_request:
    branches:
      - tanyapi
    paths:
      - .github/workflows/apply-profile-immediate-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-immediate-publication-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json

      - name: Patch profile publication refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/miniapp-v0/components/tabs/profile-tab.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { mergePendingPublication } from '@/lib/feed-events'",
                  "import { mergePendingPublication, mergePublication } from '@/lib/feed-events'",
              ),
              (
                  """  useEffect(() => {\n    const refreshProfileFeed = () => {\n      setItems((current) => mergePendingPublication(current, 'profile'))\n      setFeedRefreshToken((value) => value + 1)\n    }\n    window.addEventListener('banano:feed-changed', refreshProfileFeed)\n    return () => window.removeEventListener('banano:feed-changed', refreshProfileFeed)\n  }, [])""",
                  """  useEffect(() => {\n    if (!isOwnProfile) return\n    setItems((current) => mergePendingPublication(current, 'profile'))\n  }, [isOwnProfile])\n\n  useEffect(() => {\n    const refreshProfileFeed = (event: Event) => {\n      const published = (event as CustomEvent<FeedItem | undefined>).detail\n      if (published) {\n        if (isOwnProfile) {\n          setItems((current) => mergePublication(current, published, 'profile'))\n        }\n        return\n      }\n      setFeedRefreshToken((value) => value + 1)\n    }\n    window.addEventListener('banano:feed-changed', refreshProfileFeed)\n    return () => window.removeEventListener('banano:feed-changed', refreshProfileFeed)\n  }, [isOwnProfile])""",
              ),
              (
                  "setItems(mergePendingPublication(result.feed, 'profile'))\n          setBrokenMediaIds(new Set())\n          setProfile(result.profile)",
                  "setItems(result.feed)\n          setBrokenMediaIds(new Set())\n          setProfile(result.profile)",
              ),
              (
                  "posts: Number(profile.posts_count || 0),",
                  "posts: Math.max(Number(profile.posts_count || 0), profileItems.length),",
              ),
              (
                  "{loading ? (",
                  "{loading && !profileItems.length ? (",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_profile_immediate_publication_contract.py')
          test_path.write_text(
              """from pathlib import Path\n\n\ndef test_profile_uses_publication_event_payload_directly():\n    source = Path('frontend/miniapp-v0/components/tabs/profile-tab.tsx').read_text(encoding='utf-8')\n    assert \"(event as CustomEvent<FeedItem | undefined>).detail\" in source\n    assert \"mergePublication(current, published, 'profile')\" in source\n    assert \"loading && !profileItems.length\" in source\n\n\ndef test_pending_publication_is_shared_across_dynamic_chunks():\n    source = Path('frontend/miniapp-v0/lib/feed-events.ts').read_text(encoding='utf-8')\n    assert '__BANANO_PENDING_PUBLICATION__' in source\n    assert \"new CustomEvent<FeedItem | undefined>('banano:feed-changed', { detail: item })\" in source\n""",
              encoding='utf-8',
          )
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-profile-immediate-v2.yml

      - name: Build Mini App
        working-directory: frontend/miniapp-v0
        run: |
          npm ci
          npm run build

      - name: Run focused contract check
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path('frontend/miniapp-v0/components/tabs/profile-tab.tsx').read_text(encoding='utf-8')
          events = Path('frontend/miniapp-v0/lib/feed-events.ts').read_text(encoding='utf-8')
          required_profile = (
              "(event as CustomEvent<FeedItem | undefined>).detail",
              "mergePublication(current, published, 'profile')",
              "loading && !profileItems.length",
              "setItems(result.feed)",
          )
          for fragment in required_profile:
              assert fragment in profile, fragment
          assert '__BANANO_PENDING_PUBLICATION__' in events
          assert "new CustomEvent<FeedItem | undefined>('banano:feed-changed', { detail: item })" in events
          print('Profile publication contract OK')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/miniapp-v0/components/tabs/profile-tab.tsx frontend/miniapp-v0/lib/feed-events.ts .github/workflows/apply-profile-immediate-v2.yml
          git add -f tests/test_profile_immediate_publication_contract.py
          git commit -m "Fix immediate profile publication refresh"
          git push origin HEAD:fix/profile-immediate-publication-v2
