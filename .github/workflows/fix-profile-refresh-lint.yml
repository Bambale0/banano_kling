name: Fix profile refresh lint

on:
  pull_request:
    branches:
      - tanyapi
    paths:
      - ".github/workflows/fix-profile-refresh-lint.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-publication-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet ruff
      - name: Fix existing import order
        run: |
          ruff check bot/handlers/__init__.py bot/handlers/trends_compat.py --fix --select=I001
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No fixes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/handlers/__init__.py bot/handlers/trends_compat.py
          git commit -m "Fix existing import ordering"
          git push origin HEAD:fix/profile-publication-refresh
