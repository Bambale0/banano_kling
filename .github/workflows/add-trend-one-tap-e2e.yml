name: Stabilize trend one-tap browser coverage

on:
  pull_request:
    branches: [automation/trend-one-tap-e2e]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Replace unstable animated button click
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/miniapp-v0/e2e/critical-flows.mjs')
          text = path.read_text(encoding='utf-8')
          stable_line = "  await page.mouse.click(10, 10)"
          if stable_line in text:
              print('Stable backdrop close is already present')
              raise SystemExit(0)

          start_marker = "  const taskDetailTitle = page.getByText('Детали задачи', { exact: true })"
          end_marker = "  await taskDetailTitle.locator('xpath=..').locator('button').click()"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Task detail close boundaries not found')
          end += len(end_marker)

          replacement = "\n".join([
              start_marker,
              "  await taskDetailTitle.waitFor()",
              stable_line,
              "  await taskDetailTitle.waitFor({ state: 'hidden' })",
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check frontend/miniapp-v0/e2e/critical-flows.mjs

      - name: Commit E2E stabilization
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/miniapp-v0/e2e/critical-flows.mjs
          if git diff --cached --quiet; then
            echo "E2E close already stable"
            exit 0
          fi
          git commit -m "Stabilize one-tap trend browser test"
          git push origin "HEAD:${HEAD_BRANCH}"
