name: Stabilize trend one-tap browser coverage

on:
  pull_request:
    branches: [automation/trend-one-tap-e2e]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Replace unstable animated button click
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/miniapp-v0/e2e/critical-flows.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  const taskDetailTitle = page.getByText('Детали задачи', { exact: true })
          await taskDetailTitle.waitFor()
          await taskDetailTitle.locator('xpath=..').locator('button').click()
          """
          new = """  const taskDetailTitle = page.getByText('Детали задачи', { exact: true })
          await taskDetailTitle.waitFor()
          await page.mouse.click(10, 10)
          await taskDetailTitle.waitFor({ state: 'hidden' })
          """
          if new in text:
              print('Stable backdrop close is already present')
          elif old in text:
              text = text.replace(old, new, 1)
          else:
              raise SystemExit('Task detail close anchor not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check frontend/miniapp-v0/e2e/critical-flows.mjs

      - name: Commit E2E stabilization
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/miniapp-v0/e2e/critical-flows.mjs
          if git diff --cached --quiet; then
            echo "E2E close already stable"
            exit 0
          fi
          git commit -m "Stabilize one-tap trend browser test"
          git push origin "HEAD:${HEAD_BRANCH}"
