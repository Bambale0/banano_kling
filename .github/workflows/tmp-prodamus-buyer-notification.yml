name: Temporary Prodamus buyer notification patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          cat > /tmp/prodamus.patch <<'PATCH'
          diff --git a/bot/handlers/prodamus_payments.py b/bot/handlers/prodamus_payments.py
          index 7d68f5f..cca4e36 100644
          --- a/bot/handlers/prodamus_payments.py
          +++ b/bot/handlers/prodamus_payments.py
          @@ -378,10 +378,37 @@ async def handle_prodamus_webhook(request: web.Request) -> web.Response:
                   )
                   return web.Response(text="error: completion failed", status=500)
           
          +    duplicate = bool(result.get("already_completed"))
          +    if not duplicate:
          +        bot = request.app.get("bot")
          +        telegram_id = result.get("telegram_id")
          +        completed_transaction = result.get("transaction")
          +        if bot is not None and telegram_id and completed_transaction is not None:
          +            credits = int(getattr(completed_transaction, "credits", 0) or 0)
          +            try:
          +                await bot.send_message(
          +                    int(telegram_id),
          +                    "✅ Оплата получена\n"
          +                    f"Начислено: {credits} 🍌",
          +                )
          +                logger.info(
          +                    "Prodamus buyer notification sent order=%s telegram_id=%s",
          +                    order_id,
          +                    telegram_id,
          +                )
          +            except Exception:
          +                # Payment is already committed. A Telegram delivery failure must
          +                # not make Prodamus retry a successfully processed payment.
          +                logger.exception(
          +                    "Failed to notify Prodamus buyer order=%s telegram_id=%s",
          +                    order_id,
          +                    telegram_id,
          +                )
          +
               logger.info(
                   "Prodamus payment completed order=%s duplicate=%s",
                   order_id,
          -        bool(result.get("already_completed")),
          +        duplicate,
               )
               return web.Response(text="success", status=200)
          diff --git a/tests/test_prodamus_payments.py b/tests/test_prodamus_payments.py
          index c43a72a..b2ce457 100644
          --- a/tests/test_prodamus_payments.py
          +++ b/tests/test_prodamus_payments.py
          @@ -1,4 +1,5 @@
           from types import SimpleNamespace
          +from unittest.mock import AsyncMock
           from urllib.parse import parse_qs, urlparse
           
           import pytest
          @@ -231,6 +232,64 @@ async def test_prodamus_webhook_completes_valid_signed_payment(
               assert completed == ["42_1000_mini"]
           
           
          +@pytest.mark.asyncio
          +async def test_prodamus_webhook_notifies_buyer_only_on_first_completion(
          +    monkeypatch: pytest.MonkeyPatch,
          +) -> None:
          +    import bot.handlers.prodamus_payments as prodamus
          +    from bot.handlers import payments as payments_handler
          +
          +    payload = {
          +        "payment_status": "success",
          +        "order_num": "42_2000_mini",
          +        "sum": "150.00",
          +        "currency": "rub",
          +    }
          +    secret = "webhook-secret"
          +    signature = sign_prodamus_payload(payload, secret)
          +    monkeypatch.setenv("PRODAMUS_SECRET_KEY", secret)
          +
          +    async def fake_transaction(order_id: str):
          +        assert order_id == "42_2000_mini"
          +        return SimpleNamespace(provider="prodamus", amount_rub=150.0, status="pending")
          +
          +    completion_count = 0
          +
          +    async def fake_complete(order_id: str, *, bot=None):
          +        nonlocal completion_count
          +        completion_count += 1
          +        return {
          +            "ok": True,
          +            "already_completed": completion_count > 1,
          +            "telegram_id": 42,
          +            "transaction": SimpleNamespace(credits=15),
          +        }
          +
          +    bot = SimpleNamespace(send_message=AsyncMock())
          +    monkeypatch.setattr(prodamus, "get_transaction_by_order", fake_transaction)
          +    monkeypatch.setattr(payments_handler, "_complete_transaction", fake_complete)
          +
          +    class FakeRequest:
          +        content_type = "application/json"
          +
          +        def __init__(self) -> None:
          +            self.headers = {"Sign": signature}
          +            self.app = {"bot": bot}
          +
          +        async def json(self):
          +            return payload
          +
          +    first = await handle_prodamus_webhook(FakeRequest())
          +    replay = await handle_prodamus_webhook(FakeRequest())
          +
          +    assert first.status == 200
          +    assert replay.status == 200
          +    bot.send_message.assert_awaited_once_with(
          +        42,
          +        "✅ Оплата получена\nНачислено: 15 🍌",
          +    )
          +
          +
           @pytest.mark.asyncio
           async def test_prodamus_webhook_rejects_invalid_signature_before_db(
               monkeypatch: pytest.MonkeyPatch,
          PATCH
          git apply /tmp/prodamus.patch
          git diff --check
      - name: Run targeted checks
        run: |
          python -m pip install -q -r requirements.txt
          python -m pytest -q tests/test_prodamus_payments.py
          python -m ruff check bot/handlers/prodamus_payments.py tests/test_prodamus_payments.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot/handlers/prodamus_payments.py tests/test_prodamus_payments.py
          git commit -m 'fix(payments): notify Prodamus buyer after payment'
          git push
