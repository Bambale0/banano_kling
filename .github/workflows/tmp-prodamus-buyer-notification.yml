name: Temporary Prodamus buyer notification patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested source changes
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          old = base64.b64decode('ICAgIGxvZ2dlci5pbmZvKAogICAgICAgICJQcm9kYW11cyBwYXltZW50IGNvbXBsZXRlZCBvcmRlcj0lcyBkdXBsaWNhdGU9JXMiLAogICAgICAgIG9yZGVyX2lkLAogICAgICAgIGJvb2wocmVzdWx0LmdldCgiYWxyZWFkeV9jb21wbGV0ZWQiKSksCiAgICApCiAgICByZXR1cm4gd2ViLlJlc3BvbnNlKHRleHQ9InN1Y2Nlc3MiLCBzdGF0dXM9MjAwKQo=').decode()
          new = base64.b64decode('').decode()
          handler = Path('bot/handlers/prodamus_payments.py')
          text = handler.read_text()
          if old not in text:
              raise SystemExit('handler marker not found')
          handler.write_text(text.replace(old, new, 1))
          test = Path('tests/test_prodamus_payments.py')
          text = test.read_text()
          if 'from unittest.mock import AsyncMock\n' not in text:
              text = text.replace('from types import SimpleNamespace\n', 'from types import SimpleNamespace\nfrom unittest.mock import AsyncMock\n', 1)
          marker = base64.b64decode('QHB5dGVzdC5tYXJrLmFzeW5jaW8KYXN5bmMgZGVmIHRlc3RfcHJvZGFtdXNfd2ViaG9va19yZWplY3RzX2ludmFsaWRfc2lnbmF0dXJlX2JlZm9yZV9kYigK').decode()
          addition = base64.b64decode('').decode()
          if marker not in text:
              raise SystemExit('test marker not found')
          test.write_text(text.replace(marker, addition + marker, 1))
          PY
          git diff --check
      - name: Run targeted checks
        run: |
          python -m pip install -q -r requirements.txt pytest pytest-asyncio ruff
          python -m pytest -q tests/test_prodamus_payments.py
          python -m ruff check bot/handlers/prodamus_payments.py tests/test_prodamus_payments.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot/handlers/prodamus_payments.py tests/test_prodamus_payments.py
          git commit -m 'fix(payments): notify Prodamus buyer after payment'
          git push
