name: Apply atomic generation debit codemod

on:
  pull_request:
    branches:
      - tanyapi

permissions:
  contents: write

jobs:
  codemod:
    if: github.head_ref == 'agent/tanyapi-atomic-generation-debit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tanyapi-atomic-generation-debit
          fetch-depth: 0

      - name: Apply focused debit-result checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          miniapp_path = Path('bot/miniapp.py')
          miniapp = miniapp_path.read_text(encoding='utf-8')

          helper = '''\n\nasync def _deduct_miniapp_generation_cost(\n    telegram_id: int,\n    amount: int | float,\n) -> web.Response | None:\n    """Atomically debit one launch and stop when the balance changed concurrently."""\n    if config.is_admin(telegram_id):\n        return None\n    if await deduct_credits(telegram_id, amount):\n        return None\n\n    fresh_user = await get_or_create_user(telegram_id)\n    required = f"{float(amount):g}"\n    return web.json_response(\n        {\n            "ok": False,\n            "error": f"Недостаточно бананов. Нужно {required}🍌",\n            "credits": fresh_user.credits,\n        },\n        status=400,\n    )\n'''

          marker = '\nVIDEO_MODELS = ('
          if '_deduct_miniapp_generation_cost' not in miniapp:
              if marker not in miniapp:
                  raise SystemExit('Mini App helper insertion marker not found')
              miniapp = miniapp.replace(marker, helper + marker, 1)

          debit_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)if not is_admin:\n'
              r'(?P=indent)    await deduct_credits\(telegram_id, (?P<amount>unit_cost|cost)\)$'
          )

          def replace_miniapp_debit(match: re.Match[str]) -> str:
              indent = match.group('indent')
              amount = match.group('amount')
              return (
                  f'{indent}debit_error = await _deduct_miniapp_generation_cost('
                  f'telegram_id, {amount})\n'
                  f'{indent}if debit_error is not None:\n'
                  f'{indent}    return debit_error'
              )

          miniapp, miniapp_replacements = debit_pattern.subn(
              replace_miniapp_debit,
              miniapp,
          )
          if miniapp_replacements != 4:
              raise SystemExit(
                  f'Expected 4 Mini App debit replacements, got {miniapp_replacements}'
              )
          miniapp_path.write_text(miniapp, encoding='utf-8')

          generation_path = Path('bot/handlers/generation.py')
          generation = generation_path.read_text(encoding='utf-8')
          bare_debit_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)await deduct_credits\('
              r'message\.from_user\.id, (?P<amount>cost|total_cost)\)$'
          )

          def replace_telegram_debit(match: re.Match[str]) -> str:
              indent = match.group('indent')
              amount = match.group('amount')
              return (
                  f'{indent}if not await deduct_credits(message.from_user.id, {amount}):\n'
                  f'{indent}    await message.answer(\n'
                  f'{indent}        "❌ Баланс изменился во время запуска. "\n'
                  f'{indent}        "Пополните баланс и попробуйте снова.",\n'
                  f'{indent}        parse_mode="HTML",\n'
                  f'{indent}    )\n'
                  f'{indent}    return'
              )

          generation, generation_replacements = bare_debit_pattern.subn(
              replace_telegram_debit,
              generation,
          )
          if generation_replacements != 3:
              raise SystemExit(
                  f'Expected 3 Telegram debit replacements, got {generation_replacements}'
              )
          generation_path.write_text(generation, encoding='utf-8')
          PY

          python -m compileall -q bot/miniapp.py bot/handlers/generation.py
          rm -f .github/workflows/atomic-debit-codemod.yml

      - name: Commit focused source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/miniapp.py bot/handlers/generation.py .github/workflows/atomic-debit-codemod.yml
          git commit -m 'Enforce atomic generation debit results'
          git push origin HEAD:agent/tanyapi-atomic-generation-debit
