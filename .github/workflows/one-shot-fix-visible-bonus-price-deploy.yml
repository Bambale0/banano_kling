name: One-shot fix visible pricing and backend deploy

on:
  push:
    branches: [tanyapi]
    paths:
      - .github/workflows/one-shot-fix-visible-bonus-price-deploy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout tanyapi
        uses: actions/checkout@v4
        with:
          ref: tanyapi
          fetch-depth: 0

      - name: Apply visible pricing and deployment fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "bot/keyboards.py",
              "from bot.services.preset_manager import preset_manager\n",
              "from bot.services.preset_manager import preset_manager\n"
              "from bot.services.photo_prompt_billing import photo_prompt_price_label\n",
          )
          replace_once(
              "bot/keyboards.py",
              'InlineKeyboardButton(text="✍️ Промпт по описанию", callback_data="photo_to_prompt"),',
              dedent('''\
                  InlineKeyboardButton(
                      text=f"✍️ Промпт по описанию • {photo_prompt_price_label()}",
                      callback_data="photo_to_prompt",
                  ),
              ''').rstrip(),
          )

          replace_once(
              "bot/services/photo_prompt_billing.py",
              dedent('''\
                  def photo_prompt_price_label() -> str:
                      return f"{photo_prompt_price_rub():g} ₽ ({photo_prompt_cost_credits():g} 🍌)"
              '''),
              dedent('''\
                  def _format_price_number(value: float) -> str:
                      return f"{float(value):g}".replace(".", ",")


                  def photo_prompt_price_label() -> str:
                      return (
                          f"{_format_price_number(photo_prompt_price_rub())} ₽ "
                          f"({_format_price_number(photo_prompt_cost_credits())} 🍌)"
                      )
              '''),
          )

          replace_once(
              "bot/handlers/image_analyzer.py",
              dedent('''\
                      "📸 <b>Промпт по фото</b>\\n\\n"
                      f"Стоимость анализа фото: <b>{photo_prompt_price_label()}</b>\\n\\n"
              '''),
              dedent('''\
                      "✍️ <b>Промпт по описанию</b>\\n\\n"
                      f"Стоимость: <b>{photo_prompt_price_label()}</b>\\n\\n"
              '''),
          )

          replace_once(
              "tests/test_keyboards.py",
              '        btn.text == "✍️ Промпт по описанию"\n',
              dedent('''\
                      btn.text == (
                          "✍️ Промпт по описанию • "
                          f"{keyboards_module.photo_prompt_price_label()}"
                      )
              '''),
          )

          deploy_path = Path(".github/workflows/deploy-production.yml")
          deploy_text = deploy_path.read_text(encoding="utf-8")
          old_gate = dedent('''\
                          if [ "$status" = completed ]; then
                            [ "$conclusion" = success ] || {
                              echo "::error::Matching CI finished with conclusion=$conclusion"
                              exit 1
                            }
                            echo "Matching CI passed for $GITHUB_SHA"
                            exit 0
                          fi

                          sleep 15
          ''')
          new_gate = dedent('''\
                          if [ "$status" != completed ]; then
                            sleep 15
                            continue
                          fi

                          jobs_payload="$(
                            gh api --method GET \\
                              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \\
                              -F per_page=100
                          )"

                          github_image_ok=false
                          if jq -e '\
                            [.jobs[] | select(.name == "GitHub runner — Production Docker image")]\
                            | last as $job\
                            | $job != null\
                              and any($job.steps[]?; .name == "Build image with GitHub Actions cache" and .conclusion == "success")\
                              and any($job.steps[]?; .name == "Verify image filesystem and Python imports" and .conclusion == "success")\
                              and any($job.steps[]?; .name == "Validate production Compose configuration" and .conclusion == "success")\
                              and any($job.steps[]?; .name == "Publish verified image" and .conclusion == "success")\
                          ' <<< "$jobs_payload" >/dev/null; then
                            github_image_ok=true
                          fi

                          nuromix_image_ok=false
                          if jq -e '\
                            [.jobs[] | select(.name == "nuromix fallback — Full CI validation")]\
                            | last as $job\
                            | $job != null\
                              and any($job.steps[]?; .name == "Run full safe regression suite" and .conclusion == "success")\
                              and any($job.steps[]?; .name == "Build image on nuromix" and .conclusion == "success")\
                              and any($job.steps[]?; .name == "Verify nuromix image" and .conclusion == "success")\
                              and any($job.steps[]?; .name == "Validate production Compose on nuromix" and .conclusion == "success")\
                              and any($job.steps[]?; .name == "Publish nuromix-verified image" and .conclusion == "success")\
                          ' <<< "$jobs_payload" >/dev/null; then
                            nuromix_image_ok=true
                          fi

                          echo "verified_github_image=$github_image_ok"
                          echo "verified_nuromix_image=$nuromix_image_ok"

                          if [ "$github_image_ok" = true ] || [ "$nuromix_image_ok" = true ]; then
                            echo "Exact commit $GITHUB_SHA passed a complete CI image path"
                            exit 0
                          fi

                          echo "::error::CI completed without a fully verified image path for $GITHUB_SHA"
                          jq -r '.jobs[] | "job=\\(.name) status=\\(.status) conclusion=\\(.conclusion)"' \\
                            <<< "$jobs_payload"
                          exit 1
          ''')
          if deploy_text.count(old_gate) != 1:
              raise SystemExit(
                  f"Expected one legacy deploy gate, found {deploy_text.count(old_gate)}"
              )
          deploy_text = deploy_text.replace(old_gate, new_gate, 1)
          deploy_text = deploy_text.replace(
              "name: Wait for verified CI\n",
              "name: Require verified CI for exact commit\n",
              1,
          )
          deploy_text = deploy_text.replace(
              "- name: Wait for the matching CI run\n",
              "- name: Wait for matching CI and require a verified image path\n",
              1,
          )
          deploy_path.write_text(deploy_text, encoding="utf-8")

          keyboard_text = Path("bot/keyboards.py").read_text(encoding="utf-8")
          billing_text = Path("bot/services/photo_prompt_billing.py").read_text(encoding="utf-8")
          analyzer_text = Path("bot/handlers/image_analyzer.py").read_text(encoding="utf-8")
          assert "Промпт по описанию • {photo_prompt_price_label()}" in keyboard_text
          assert 'replace(".", ",")' in billing_text
          assert "Стоимость: <b>{photo_prompt_price_label()}</b>" in analyzer_text
          assert "PARTNER_NEW_USER_BONUS: int = 5" in Path("bot/database.py").read_text(encoding="utf-8")
          assert "Welcome-бонус для новых пользователей: 5🍌" in Path(
              "frontend/miniapp-v0/components/balance-sheet.tsx"
          ).read_text(encoding="utf-8")
          PY

          python -m compileall -q \
            bot/keyboards.py \
            bot/services/photo_prompt_billing.py \
            bot/handlers/image_analyzer.py \
            tests/test_keyboards.py

      - name: Commit final fix and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-visible-bonus-price-deploy.yml
          git add \
            bot/keyboards.py \
            bot/services/photo_prompt_billing.py \
            bot/handlers/image_analyzer.py \
            tests/test_keyboards.py \
            .github/workflows/deploy-production.yml
          git diff --cached --check
          git commit -m "Fix visible photo prompt pricing and backend deploy gate"
          git push origin HEAD:tanyapi
