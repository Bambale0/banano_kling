name: Maintenance — Clear stale runs before final hotfix

on:
  push:
    branches: [tanyapi]
    paths:
      - ops/deploy-triggers/2026-08-04-clear-stale-runs.txt

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: GitHub runner — Cancel stale queued and active runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Cancel runs from older commits
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          for status in queued in_progress waiting requested pending; do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[] | [.id, .head_sha, .name, .status] | @tsv' \
              || true
          done | sort -u > stale-runs.tsv

          while IFS=$'\t' read -r run_id head_sha name status; do
            [ -n "$run_id" ] || continue
            [ "$run_id" != "$CURRENT_RUN_ID" ] || continue
            [ "$head_sha" != "$CURRENT_SHA" ] || continue

            echo "Cancelling stale run id=$run_id sha=$head_sha status=$status name=$name"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
              >/dev/null 2>&1 || true

            # GitHub may leave queued workflow runs stuck after the regular
            # cancellation request. Give cancellation a short grace period,
            # then force-cancel only the same stale run if it is still active.
            sleep 2
            current_status="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --jq '.status' \
                2>/dev/null || true
            )"
            if [ -n "$current_status" ] && [ "$current_status" != completed ]; then
              echo "Force-cancelling stale run id=$run_id status=$current_status"
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" \
                >/dev/null 2>&1 || true
            fi
          done < stale-runs.tsv

          # Do not report success while an older queued/pending workflow still
          # owns a concurrency slot. Wait briefly for GitHub to settle state.
          for _ in $(seq 1 10); do
            remaining="$(
              for status in queued in_progress waiting requested pending; do
                gh api \
                  "repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
                  --jq ".workflow_runs[] | select(.id != ${CURRENT_RUN_ID} and .head_sha != \"${CURRENT_SHA}\") | .id" \
                  2>/dev/null || true
              done | sort -u
            )"
            [ -z "$remaining" ] && break
            echo "Waiting for stale runs to leave the scheduler: $remaining"
            sleep 2
          done

          remaining="$(
            for status in queued in_progress waiting requested pending; do
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
                --jq ".workflow_runs[] | select(.id != ${CURRENT_RUN_ID} and .head_sha != \"${CURRENT_SHA}\") | .id" \
                2>/dev/null || true
            done | sort -u
          )"
          if [ -n "$remaining" ]; then
            echo "::error::Stale workflow runs are still active after force-cancel: $remaining"
            exit 1
          fi

          echo 'Remaining runs for current commit:'
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CURRENT_SHA}&per_page=100" \
            --jq '.workflow_runs[] | "id=\(.id) name=\(.name) status=\(.status)"' \
            || true
