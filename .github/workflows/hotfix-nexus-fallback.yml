name: Hotfix Nano Banana Nexus fallback

on:
  push:
    branches: [tanyapi]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tanyapi
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply provider routing fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'bot/services/nano_banana_2_service.py',
              '''        if task_id:\n            return {\n                "task_id": task_id,\n                "provider": "kie",\n                "provider_model": "nano-banana-2",\n            }\n        return primary_result\n''',
              '''        if task_id:\n            return {\n                "task_id": task_id,\n                "provider": "kie",\n                "provider_model": "nano-banana-2",\n            }\n\n        if self.fallback_provider is not None and hasattr(\n            self.fallback_provider, "generate_image"\n        ):\n            logger.info(\n                "Nano Banana 2: Kie primary failed; trying Nexus fallback"\n            )\n            fallback_result = await self.fallback_provider.generate_image(\n                clean_prompt,\n                aspect_ratio,\n                resolution,\n                image_input,\n                output_format,\n            )\n            if isinstance(fallback_result, dict):\n                return fallback_result\n            if isinstance(fallback_result, (bytes, bytearray)):\n                return {"image_bytes": bytes(fallback_result)}\n            if fallback_result is not None:\n                return fallback_result\n\n        return primary_result\n''',
          )

          replace_once(
              'bot/services/nano_banana_2_service.py',
              '''# Nexus remains the preferred provider by product decision.\n_kie_provider = ProviderClient(\n    api_key=config.KIE_AI_API_KEY or config.NANOBANANA_API_KEY,\n    base_url="https://api.kie.ai",\n)\n\nnexus_api_key = str(getattr(config, "NEXUS_API_KEY", "") or "").strip()\n_nexus_provider = (\n    NexusImageProvider(\n        api_key=nexus_api_key,\n        model_name="nano-banana-2",\n        base_url=getattr(config, "NEXUS_API_BASE_URL", "https://nexusapi.dev"),\n        timeout_seconds=getattr(config, "NEXUS_API_TIMEOUT_SECONDS", 600),\n        poll_interval_seconds=getattr(config, "NEXUS_API_POLL_INTERVAL_SECONDS", 5),\n        max_references=MAX_IMAGE_INPUTS,\n    )\n    if nexus_api_key\n    else None\n)\n\nif _nexus_provider:\n    logger.info("Nano Banana 2: using Nexus as primary, Kie.ai as technical fallback")\n    nano_banana_2_service = NanoBanana2Service(\n        primary_provider=_nexus_provider,\n        fallback_provider=_kie_provider,\n    )\nelse:\n    logger.info("Nano Banana 2: Nexus is not configured; using Kie.ai")\n    nano_banana_2_service = NanoBanana2Service(\n        primary_provider=_kie_provider,\n        fallback_provider=None,\n    )\n''',
              '''# Kie.ai stays primary. Nexus is a technical fallback only.\n_kie_provider = ProviderClient(\n    api_key=config.KIE_AI_API_KEY or config.NANOBANANA_API_KEY,\n    base_url="https://api.kie.ai",\n)\n\nnexus_api_key = str(getattr(config, "NEXUS_API_KEY", "") or "").strip()\n_nexus_provider = (\n    NexusImageProvider(\n        api_key=nexus_api_key,\n        model_name="nano-banana-2",\n        base_url=getattr(config, "NEXUS_API_BASE_URL", "https://nexusapi.dev"),\n        timeout_seconds=getattr(config, "NEXUS_API_TIMEOUT_SECONDS", 600),\n        poll_interval_seconds=getattr(config, "NEXUS_API_POLL_INTERVAL_SECONDS", 5),\n        max_references=MAX_IMAGE_INPUTS,\n    )\n    if nexus_api_key\n    else None\n)\n\nif _nexus_provider:\n    logger.info("Nano Banana 2: using Kie.ai as primary, Nexus as technical fallback")\n    nano_banana_2_service = NanoBanana2Service(\n        primary_provider=_kie_provider,\n        fallback_provider=_nexus_provider,\n    )\nelse:\n    logger.info("Nano Banana 2: Nexus is not configured; using Kie.ai only")\n    nano_banana_2_service = NanoBanana2Service(\n        primary_provider=_kie_provider,\n        fallback_provider=None,\n    )\n''',
          )

          replace_once(
              'bot/services/nano_banana_pro_service.py',
              '''            result = await self.fallback_provider.generate_image(\n                prompt, aspect_ratio, resolution, image_input, output_format\n            )\n            if result is not None:\n                return {"image_bytes": result}\n        return None\n''',
              '''            result = await self.fallback_provider.generate_image(\n                prompt, aspect_ratio, resolution, image_input, output_format\n            )\n            if isinstance(result, dict):\n                return result\n            if isinstance(result, (bytes, bytearray)):\n                return {"image_bytes": bytes(result)}\n            if result is not None:\n                return result\n        return None\n''',
          )

          replace_once(
              'bot/services/nano_banana_pro_service.py',
              '''# --- Инициализация: prefer Nexus, fallback to kie.ai ---\n\n_kie_provider = ProviderClient(\n    api_key=config.KIE_AI_API_KEY or config.NANOBANANA_API_KEY,\n    base_url="https://api.kie.ai",\n)\n\nnexus_api_key = str(getattr(config, "NEXUS_API_KEY", "") or "").strip()\n_nexus_provider = (\n    NexusImageProvider(\n        api_key=nexus_api_key,\n        model_name="nano-banana-pro",\n        base_url=getattr(config, "NEXUS_API_BASE_URL", "https://nexusapi.dev"),\n        timeout_seconds=getattr(config, "NEXUS_API_TIMEOUT_SECONDS", 600),\n        poll_interval_seconds=getattr(config, "NEXUS_API_POLL_INTERVAL_SECONDS", 5),\n        max_references=MAX_IMAGE_INPUTS,\n    )\n    if nexus_api_key\n    else None\n)\n\nif _nexus_provider:\n    logger.info("Nano Banana Pro: using Nexus as primary, kie.ai as fallback")\n    nano_banana_pro_service = NanoBananaProService(\n        primary_provider=_nexus_provider,\n        fallback_provider=_kie_provider,\n    )\nelse:\n    logger.info("Nano Banana Pro: Nexus is not configured; using kie.ai as primary")\n    nano_banana_pro_service = NanoBananaProService(\n        primary_provider=_kie_provider,\n        fallback_provider=None,\n    )\n''',
              '''# --- Инициализация: Kie.ai primary, Nexus fallback ---\n\n_kie_provider = ProviderClient(\n    api_key=config.KIE_AI_API_KEY or config.NANOBANANA_API_KEY,\n    base_url="https://api.kie.ai",\n)\n\nnexus_api_key = str(getattr(config, "NEXUS_API_KEY", "") or "").strip()\n_nexus_provider = (\n    NexusImageProvider(\n        api_key=nexus_api_key,\n        model_name="nano-banana-pro",\n        base_url=getattr(config, "NEXUS_API_BASE_URL", "https://nexusapi.dev"),\n        timeout_seconds=getattr(config, "NEXUS_API_TIMEOUT_SECONDS", 600),\n        poll_interval_seconds=getattr(config, "NEXUS_API_POLL_INTERVAL_SECONDS", 5),\n        max_references=MAX_IMAGE_INPUTS,\n    )\n    if nexus_api_key\n    else None\n)\n\nif _nexus_provider:\n    logger.info("Nano Banana Pro: using Kie.ai as primary, Nexus as fallback")\n    nano_banana_pro_service = NanoBananaProService(\n        primary_provider=_kie_provider,\n        fallback_provider=_nexus_provider,\n    )\nelse:\n    logger.info("Nano Banana Pro: Nexus is not configured; using Kie.ai only")\n    nano_banana_pro_service = NanoBananaProService(\n        primary_provider=_kie_provider,\n        fallback_provider=None,\n    )\n''',
          )

          init_path = Path('bot/services/__init__.py')
          init_text = init_path.read_text(encoding='utf-8')
          start = init_text.index('def _configure_nexus_nanobanana_routing() -> None:')
          end = init_text.index('\n\n_configure_nexus_nanobanana_routing()', start)
          new_function = '''def _configure_nexus_nanobanana_routing() -> None:\n    """Keep Kie.ai primary and use Nexus only as Nano Banana 2/Pro fallback.\n\n    Nano Banana 2 Lite is intentionally untouched and keeps its dedicated Kie\n    Market route inside NanoBanana2Service.\n    """\n\n    nexus_api_key = os.getenv("NEXUS_API_KEY", "").strip()\n    nexus_base_url = os.getenv("NEXUS_API_BASE_URL", "https://nexusapi.dev").strip().rstrip("/")\n    try:\n        timeout_seconds = max(30, int(os.getenv("NEXUS_API_TIMEOUT_SECONDS", "180")))\n    except ValueError:\n        timeout_seconds = 180\n    try:\n        poll_interval_seconds = max(0.5, float(os.getenv("NEXUS_API_POLL_INTERVAL_SECONDS", "1")))\n    except ValueError:\n        poll_interval_seconds = 1.0\n\n    # Module-level services may already carry the old Nexus-primary wiring.\n    # Preserve the known Kie client and make it primary again.\n    banana2_kie = nano_banana_2_service.primary_provider\n    if isinstance(banana2_kie, NexusImageProvider):\n        banana2_kie = nano_banana_2_service.fallback_provider\n\n    banana_pro_kie = nano_banana_pro_service.primary_provider\n    if isinstance(banana_pro_kie, NexusImageProvider):\n        banana_pro_kie = nano_banana_pro_service.fallback_provider\n\n    if banana2_kie is None or banana_pro_kie is None:\n        raise RuntimeError("Kie.ai Nano Banana provider wiring is unavailable")\n\n    nano_banana_2_service.primary_provider = banana2_kie\n    nano_banana_pro_service.primary_provider = banana_pro_kie\n\n    if not nexus_api_key:\n        nano_banana_2_service.fallback_provider = None\n        nano_banana_pro_service.fallback_provider = None\n        logger.warning(\n            "NEXUS_API_KEY is not configured; Nano Banana 2/Pro use Kie.ai only"\n        )\n        return\n\n    nano_banana_2_service.fallback_provider = NexusImageProvider(\n        api_key=nexus_api_key,\n        model_name="nano-banana-2",\n        base_url=nexus_base_url,\n        timeout_seconds=timeout_seconds,\n        poll_interval_seconds=poll_interval_seconds,\n        max_references=8,\n    )\n    nano_banana_pro_service.fallback_provider = NexusImageProvider(\n        api_key=nexus_api_key,\n        model_name="nano-banana-pro",\n        base_url=nexus_base_url,\n        timeout_seconds=timeout_seconds,\n        poll_interval_seconds=poll_interval_seconds,\n        max_references=8,\n    )\n\n    logger.info(\n        "Nano Banana routing: Kie.ai primary (2 + Pro), Nexus fallback; Lite unchanged"\n    )\n'''
          init_text = init_text[:start] + new_function + init_text[end:]
          init_text = init_text.replace(
              'explicitly owns provider selection below: Nexus primary -> Kie fallback.',
              'explicitly owns provider selection below: Kie primary -> Nexus fallback.',
          )
          init_path.write_text(init_text, encoding='utf-8')

          test_path = Path('tests/test_nexus_nanobanana_provider.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_routing_test = '''def test_branch_routing_keeps_nexus_primary_and_kie_fallback_for_2_and_pro() -> None:\n    source = Path("bot/services/__init__.py").read_text(encoding="utf-8")\n\n    assert 'model_name="nano-banana-2"' in source\n    assert 'model_name="nano-banana-pro"' in source\n    assert "nano_banana_2_service.fallback_provider = banana2_kie" in source\n    assert "nano_banana_pro_service.fallback_provider = banana_pro_kie" in source\n    assert "Nano Banana 2 Lite is intentionally untouched" in source\n'''
          new_routing_test = '''def test_branch_routing_keeps_kie_primary_and_nexus_fallback_for_2_and_pro() -> None:\n    source = Path("bot/services/__init__.py").read_text(encoding="utf-8")\n\n    assert 'model_name="nano-banana-2"' in source\n    assert 'model_name="nano-banana-pro"' in source\n    assert "nano_banana_2_service.primary_provider = banana2_kie" in source\n    assert "nano_banana_pro_service.primary_provider = banana_pro_kie" in source\n    assert "nano_banana_2_service.fallback_provider = NexusImageProvider(" in source\n    assert "nano_banana_pro_service.fallback_provider = NexusImageProvider(" in source\n    assert "Nano Banana 2 Lite is intentionally untouched" in source\n'''
          if test_text.count(old_routing_test) != 1:
              raise SystemExit('routing contract test needle mismatch')
          test_text = test_text.replace(old_routing_test, new_routing_test, 1)

          insert_before = '\n\ndef test_branch_routing_keeps_kie_primary_and_nexus_fallback_for_2_and_pro() -> None:'
          extra_tests = '''\n\nclass _FailingKie:\n    async def _post(self, endpoint: str, payload: dict):\n        return None\n\n    async def _get(self, endpoint: str, params: dict | None = None):\n        return None\n\n    async def close(self):\n        return None\n\n\nclass _FakeNexusFallback:\n    def __init__(self, model_name: str) -> None:\n        self.model_name = model_name\n        self.calls = 0\n\n    async def generate_image(self, *args, **kwargs):\n        self.calls += 1\n        return {\n            "task_id": f"nexus-{self.model_name}",\n            "provider": "nexus",\n            "provider_model": self.model_name,\n            "provider_task_id": f"nexus-{self.model_name}",\n            "retryable": False,\n        }\n\n    async def close(self):\n        return None\n\n\n@pytest.mark.asyncio\nasync def test_nano_banana_2_uses_nexus_only_after_kie_create_fails(monkeypatch) -> None:\n    module = importlib.import_module("bot.services.nano_banana_2_service")\n\n    async def _upload(sources):\n        return list(sources)\n\n    monkeypatch.setattr(module.kie_file_upload_service, "upload_local_image_sources", _upload)\n    nexus = _FakeNexusFallback("nano-banana-2")\n    service = NanoBanana2Service(primary_provider=_FailingKie(), fallback_provider=nexus)\n\n    result = await service.generate_image("prompt", aspect_ratio="1:1", resolution="4K")\n\n    assert result is not None\n    assert result["task_id"] == "nexus-nano-banana-2"\n    assert result["provider"] == "nexus"\n    assert nexus.calls == 1\n\n\n@pytest.mark.asyncio\nasync def test_nano_banana_pro_preserves_nexus_task_after_kie_create_fails(monkeypatch) -> None:\n    module = importlib.import_module("bot.services.nano_banana_pro_service")\n\n    async def _upload(sources):\n        return list(sources)\n\n    monkeypatch.setattr(module.kie_file_upload_service, "upload_local_image_sources", _upload)\n    nexus = _FakeNexusFallback("nano-banana-pro")\n    service = NanoBananaProService(primary_provider=_FailingKie(), fallback_provider=nexus)\n\n    result = await service.generate_image("prompt", aspect_ratio="1:1", resolution="2K")\n\n    assert result is not None\n    assert result["task_id"] == "nexus-nano-banana-pro"\n    assert result["provider"] == "nexus"\n    assert nexus.calls == 1\n'''
          if insert_before not in test_text:
              raise SystemExit('test insertion point missing')
          test_text = test_text.replace(insert_before, extra_tests + insert_before, 1)
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Verify targeted provider tests
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio
          pip install --quiet -r requirements.txt
          python -m pytest tests/test_nexus_nanobanana_provider.py -q
          python -m py_compile \
            bot/services/__init__.py \
            bot/services/nano_banana_2_service.py \
            bot/services/nano_banana_pro_service.py \
            bot/services/nexus_image_provider.py

      - name: Commit provider fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bot/services/__init__.py \
            bot/services/nano_banana_2_service.py \
            bot/services/nano_banana_pro_service.py \
            tests/test_nexus_nanobanana_provider.py
          git diff --cached --check
          git commit -m 'fix(providers): use Nexus as Nano Banana fallback'
          git push origin HEAD:tanyapi
